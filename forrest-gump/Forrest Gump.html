et.", "zh": "每天我们都去散步，我就像树上的猴子一样叽叽喳喳说个不停。她听我讲乒乓球、捕虾船，还有妈妈上了天堂的事。都是我在说，珍妮大部分时候都很安静。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...big ol' gobs of rain and little bitty stinging rain and rain...", "zh": "……又大又肥的雨、细细扎人的雨，还有雨……"}, {"t": "a", "text": "Jenny's old house stands at the end of the dirt road. It appears to be deserted. Jenny walks toward the house and stops. She stares at the house. Forrest walks toward Jenny.", "zh": "珍妮的老房子立在土路尽头，看起来已经荒废。珍妮朝房子走去，停下脚步，盯着它。福雷斯走向珍妮。"}, {"t": "a", "text": "Jenny suddenly heaves a rock angrily at the house. She throws other things at the house.", "zh": "珍妮突然愤怒地朝房子扔石头，又扔起别的东西。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "How could you do this?", "zh": "你怎么能这样做？"}, {"t": "a", "text": "She breaks a window. Jenny collapses to the ground and sobs.", "zh": "她砸碎了一扇窗，瘫倒在地抽泣。"}, {"t": "a", "text": "Forrest knees down next to her.", "zh": "福雷斯在她身边跪下。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometimes I guess there just aren't enough rocks.", "zh": "有时候我想，石头根本不够用。"}]}, {"index": 146, "title": "EXT. OLD OAK TREE - DAY", "blocks": [{"t": "a", "text": "Jenny and Forrest sit on a limb together.", "zh": "珍妮和福雷斯一起坐在树枝上。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I never really knew why she came back, but I didn't care. It was like olden times. We was like peas and carrots again.", "zh": "我从不知道她为什么回来，但我不在乎。就像从前一样，我们又好得像豌豆和胡萝卜。"}]}, {"index": 147, "title": "INT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Jenny sits by the vase of flowers and look out the window.", "zh": "珍妮坐在一瓶花旁望着窗外。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Every day I'd pick pretty flowers and put them in her room for her.", "zh": "每天我都摘些漂亮的花，放在她房间里。"}]}, {"index": 148, "title": "EXT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Forrest closes his eyes as he sits on the porch. Jenny places a box of Nike running shoes in his lap.", "zh": "福雷斯坐在门廊上闭着眼。珍妮把一盒耐克跑鞋放到他腿上。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And she gave me the best gift anyone could ever get in the wide world.", "zh": "她送了我世界上任何人能得到的最好的礼物。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Okay, you can open your eyes.", "zh": "好了，你可以睁开眼睛了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "New shoes.", "zh": "新鞋。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "They make them just for running.", "zh": "专门用来跑步的鞋。"}]}, {"index": 149, "title": "EXT. GUMP HOUSE - NIGHT", "blocks": [{"t": "a", "text": "Through the windows, Forrest and Jenny are dancing as it rains outside.", "zh": "窗外下着雨，福雷斯和珍妮在屋里跳舞。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And she even showed me how to dance. And, well, we was like family... Jenny and me.", "zh": "她甚至教我跳舞。嗯，我们就像一家人一样……我和珍妮。"}]}, {"index": 150, "title": "EXT. RIVER - NIGHT", "blocks": [{"t": "a", "text": "Jenny and Forrest sit on a log together and look at the river.", "zh": "珍妮和福雷斯一起坐在圆木上看河。"}, {"t": "a", "text": "Jenny places her arms around Forrest.", "zh": "珍妮伸出手臂环住福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And it was the happiest time of my life.", "zh": "那是我一生中最幸福的时光。"}, {"t": "a", "text": "The fireworks explode in the sky.", "zh": "烟花在天空绽放。"}]}, {"index": 151, "title": "INT. GUMP'S HOUSE - NIGHT", "blocks": [{"t": "a", "text": "The Statue of Liberty is shown on the TV. Fireworks go off.", "zh": "电视里是自由女神像，烟花齐放。"}, {"t": "a", "text": "Forrest and Jenny are watching the 4th of July celebration on TV.", "zh": "福雷斯和珍妮在看七月四日独立日庆典。"}, {"t": "d", "speaker": "ANNOUNCER", "note": "over television", "text": "And this Fourth is witnessing one of the largest fireworks displays in the nation's two-hundred year history...", "zh": "今年的独立日正在上演美国建国两百年来规模最大的烟花表演之一……"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You done watching it?", "zh": "你看完了吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Mm-hmm.", "zh": "嗯。"}, {"t": "d", "speaker": "ANNOUNCER", "note": "over television", "text": "...here in New York Harbor. After the spectacular display of tall ships earlier, the Statue of Liberty...", "zh": "……地点在纽约港。在早些时候壮观的高桅帆船表演之后，自由女神像……"}, {"t": "a", "text": "Jenny stands up and kisses Forrest on the cheek.", "zh": "珍妮起身亲了亲福雷斯的脸颊。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'm going to bed.", "zh": "我去睡了。"}, {"t": "a", "text": "Jenny turns off the TV and walks outside. Forrest stands as he puts down his Dr. Pepper. Jenny walks toward the stairs.", "zh": "珍妮关掉电视走出门外。福雷斯放下胡椒博士站起身。珍妮走向楼梯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Will you marry me? I'd make a good husband, Jenny.", "zh": "你愿意嫁给我吗？我会做个好丈夫的，珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You would, Forrest.", "zh": "你会的，福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "But you won't marry me.", "zh": "可你不会嫁给我。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You don't want to marry me.", "zh": "你不会想娶我的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Why don't you love me, Jenny? I'm not a smart man, but I know what love is.", "zh": "你为什么不爱我，珍妮？我不聪明，但我知道什么是爱。"}, {"t": "a", "text": "Forrest turns and walks toward the door. Jenny turns and walks up the stairs. Forrest stands outside.", "zh": "福雷斯转身朝门口走。珍妮转身上楼。福雷斯站在门外。"}]}, {"index": 152, "title": "EXT. GUMP HOUSE - NIGHT", "blocks": [{"t": "a", "text": "The house stands in the rain.", "zh": "房子矗立在雨中。"}]}, {"index": 153, "title": "EXT. GUMP HOUSE - NIGHT", "blocks": [{"t": "a", "text": "Forrest lies in his bed as the door opens. Jenny gets into bed next to Forrest.", "zh": "福雷斯躺在床上，门开了，珍妮在他身边躺下。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Jenny?", "zh": "珍妮？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, I do love you.", "zh": "福雷斯，我真的爱你。"}, {"t": "a", "text": "Jenny and Forrest kiss. Jenny takes off her nightgown as they make love.", "zh": "珍妮和福雷斯接吻。珍妮脱下睡裙，两人做爱。"}]}, {"index": 154, "title": "EXT. GUMP HOUSE - MORNING", "blocks": [{"t": "a", "text": "Jenny carries her purse and walks toward a waiting cab.", "zh": "珍妮拎着手提包走向等候的出租车。"}, {"t": "d", "speaker": "CAB DRIVER", "note": "", "text": "Where are you running off to?", "zh": "你要跑到哪儿去？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'm not running.", "zh": "我不是要跑。"}]}, {"index": 155, "title": "INT. GUMP HOUSE", "blocks": [{"t": "a", "text": "The cab drives away as Forrest is asleep in his bed. The Congressional Medal lies on a table by a ping-pong paddle.", "zh": "出租车驶走时福雷斯还在床上熟睡。荣誉勋章放在桌上，旁边是一只乒乓球拍。"}, {"t": "a", "text": "Forrest holds a glass of milk and wears his bathrobe. He looks at the medal he had give to Jenny. Jenny's bed is made. Forrest stands in the doorway looking at the room and bed where Jenny had been.", "zh": "福雷斯穿着浴衣，端着一杯牛奶，看着他送给珍妮的勋章。珍妮的床铺收拾得整整齐齐。他站在门口，望着珍妮睡过的房间和床。"}]}, {"index": 156, "title": "EXT. FRONT PORCH - DAY", "blocks": [{"t": "a", "text": "Forrest sit on a rocking chair with his running shoes on. He is still, as if in a trance. He slowly puts on his Bubba- Gump cap. Forrest stands. He walks off the porch. He begins to jog across the lawn. His speed increases as he runs farther away. Forrest runs down the drive away from his house.", "zh": "福雷斯穿着跑鞋坐在摇椅上，一动不动，仿佛出神。他慢慢戴上“布巴-甘”棒球帽，站起身，走下门廊，开始慢跑着穿过草坪，越跑越快，沿车道离家跑去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "That day, for no particular reason, I decided to go for a little run.", "zh": "那一天，没什么特别的原因，我决定出去小跑一下。"}, {"t": "a", "text": "Forrest runs to the end of the drive, then turns right and runs down the highway.", "zh": "福雷斯跑到车道尽头，右转跑上公路。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So I ran to the end of the road, and when I got there, I thought maybe I'd run to the end of town.", "zh": "我跑到路的尽头，到了那儿，我想也许可以跑到镇的尽头。"}]}, {"index": 157, "title": "INT. BARBER SHOP - DAY", "blocks": [{"t": "a", "text": "The three men sit as they watch the television. Forrest runs through the main street of town.", "zh": "三个男人坐着看电视。福雷斯跑过镇上的主要街道。"}, {"t": "d", "speaker": "NEWSCASTER", "note": "", "text": "President Carter, suffering from heat exhaustion fell into the arms of security agents.", "zh": "卡特总统因中暑体力不支，倒在了安保人员怀中。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And when I got there...", "zh": "等我到了那儿……"}]}, {"index": 158, "title": "EXT. ALABAMA ROAD", "blocks": [{"t": "a", "text": "The sign reads \"Entering Greenbow County.\"", "zh": "牌子上写着：“进入绿弓县”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...I thought maybe I'd just run across Greenbow County. And I figured since I run this far, maybe I'd just run across the great...", "zh": "……我想也许就横穿绿弓县吧。既然都跑了这么远，我想干脆跑过整个……"}, {"t": "a", "text": "Forrest runs by a sign that reads \"Mississippi welcomes you. The Magnolia State.\"", "zh": "福雷斯跑过一块牌子：“密西西比欢迎您，木兰州”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...state of Alabama. And that's what I did I ran clear across Alabama.", "zh": "……亚拉巴马州。我就那么做了，跑着横穿了整个亚拉巴马。"}]}, {"index": 159, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "For no particular reason, I just kept on going. I ran clear to the ocean.", "zh": "没有什么特别的原因，我就一直跑，一直跑到了大海边。"}]}, {"index": 160, "title": "EXT. SANTA MONICA - DAY", "blocks": [{"t": "a", "text": "The sign reads \"Santa Monica yacht harbor sports fishing - boating - cafes.\" Forrest runs under the sign and onto the pier.", "zh": "牌子上写着：“圣莫尼卡游艇港——海钓、划船、咖啡馆”。福雷斯从牌子下跑过，上了码头。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And when I got there, I figured since I'd gone this far, I might as well turn around, just keep on going.", "zh": "等我到了那儿，我想既然都跑了这么远，不如掉个头，继续跑下去。"}]}, {"index": 161, "title": "EXT. ATLANTIC OCEAN", "blocks": [{"t": "a", "text": "Forrest runs to a pier at the Atlantic Ocean.", "zh": "福雷斯跑到大西洋边的一个码头。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "When I got to another ocean, I figured since I've gone this far, I might as well just turn back, keep right on going.", "zh": "等我到了另一片大海，我想既然都跑了这么远，不如掉个头，继续跑。"}, {"t": "a", "text": "Forrest runs across the pier. A lighthouse stands at the end of the pier.", "zh": "福雷斯跑过码头，码头尽头立着一座灯塔。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "When I got tired, I slept. When I got hungry, I ate.", "zh": "累了我就睡，饿了我就吃。"}]}, {"index": 162, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "When I had to go, you know, I went.", "zh": "想上厕所的时候，你懂的，我就去。"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "And so, you just ran?", "zh": "所以，你就这么一直跑？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yeah.", "zh": "对。"}]}, {"index": 163, "title": "EXT. HIGHWAY", "blocks": [{"t": "a", "text": "Forrest is running along the highway. Forrest runs down a road between field of wheat. A Mountain river. Forrest runs across a cobble-stone bridge. The Rocky Mountains are behind him in distance. Forrest runs through some meadowland.", "zh": "福雷斯沿公路跑，穿过麦田之间的道路，跑过山间河流和鹅卵石桥，远处是落基山脉，跑过草地牧场。"}, {"t": "a", "text": "Split rail fences line the road.", "zh": "路边是劈木栅栏。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I'd think a lot about Momma and Bubba, and Lieutenant Dan, but most of all, I thought about Jenny. I thought about her a lot.", "zh": "我想了很多关于妈妈、布巴和丹中尉的事，但想得最多的还是珍妮。我一直一直想她。"}]}, {"index": 164, "title": "EXT. BARBER SHOP", "blocks": [{"t": "a", "text": "The three men in the barber shop watch the news on television.", "zh": "理发店里三个男人看着电视新闻。"}, {"t": "d", "speaker": "NEWSCASTER", "note": "", "text": "For more than two years now, a man named Forrest Gump, a gardener from Greenbow, Alabama, stopping only to sleep, has been running across America.", "zh": "两年多来，一个名叫福雷斯·甘的男子——亚拉巴马州绿弓镇的园丁——除了睡觉从不停止，一直在跑步横穿美国。"}]}, {"index": 165, "title": "INT. COFFEE SHOP", "blocks": [{"t": "a", "text": "Jenny fills customer's coffee cups.", "zh": "珍妮给客人的咖啡杯续杯。"}, {"t": "d", "speaker": "NEWSCASTER", "note": "", "text": "Charles Cooper brings us this report.", "zh": "查尔斯·库珀为您带来报道。"}, {"t": "d", "speaker": "NEWSMAN", "note": "", "text": "For the fourth time on his journey across America, Forrest Gump, a gardener from Greenbow, Alabama, is about to cross the Mississippi River again today.", "zh": "在横穿美国的旅程中，福雷斯·甘——亚拉巴马州绿弓镇的园丁——今天将第四次再次横渡密西西比河。"}, {"t": "a", "text": "The TV shows Forrest runs across a bridge that reads \"Mississippi River.\"", "zh": "电视上福雷斯跑过一座标着“密西西比河”的桥。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'll be damned. Forrest...", "zh": "真不敢相信。福雷斯……"}]}, {"index": 166, "title": "EXT. MISSISSIPPI BRIDGE", "blocks": [{"t": "d", "speaker": "NEWSMAN", "note": "", "text": "Sir, why are you running?", "zh": "先生，您为什么要跑？"}, {"t": "d", "speaker": "1ST REPORTER", "note": "", "text": "Why are you running?", "zh": "您为什么跑？"}, {"t": "d", "speaker": "2ND REPORTER", "note": "", "text": "Are you doing this for world peace?", "zh": "您是为了世界和平吗？"}, {"t": "d", "speaker": "3RD REPORTER", "note": "", "text": "Are you doing this for women's right?", "zh": "是为了妇女权利吗？"}, {"t": "d", "speaker": "NEWSMAN", "note": "", "text": "Or for the environment?", "zh": "还是为了环境？"}, {"t": "d", "speaker": "REPORTER", "note": "", "text": "Or for animals?", "zh": "为了动物？"}, {"t": "d", "speaker": "3RD REPORTER", "note": "", "text": "Or for nuclear arms?", "zh": "为了核军控？"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "They just couldn't believe that somebody would do all that running for no particular reason.", "zh": "他们就是无法相信，有人会毫无理由地跑那么多路。"}, {"t": "d", "speaker": "2ND REPORTER", "note": "", "text": "Why are you doing this?", "zh": "你为什么要这么做？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I just felt like running.", "zh": "我就是想跑。"}]}, {"index": 167, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "I just left like running.", "zh": "我就是想跑。"}]}, {"index": 168, "title": "EXT. SMALL EASTERN TOWN", "blocks": [{"t": "a", "text": "Forrest runs as a YOUNG MAN runs up to him.", "zh": "福雷斯跑着，一个年轻男人追上他。"}, {"t": "d", "speaker": "YOUNG MAN", "note": "", "text": "It's you. I can't believe it's really you.", "zh": "是你。真不敢相信真的是你。"}]}, {"index": 169, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "Now, for some reason what I was doing seemed to make sense to people.", "zh": "不知为什么，我做的事似乎让人们觉得有道理。"}]}, {"index": 170, "title": "EXT. SMALL EASTERN TOWN", "blocks": [{"t": "a", "text": "The young man jobs behind Forrest.", "zh": "年轻人跟在福雷斯身后慢跑。"}, {"t": "d", "speaker": "YOUNG MAN", "note": "", "text": "I mean, it was like an alarm went off in my head, you know. I said, here's a guy that's got his act together. Here's somebody who's got it, all figured out. Here's somebody who has the answer. I'll follow you anywhere, Mr. Gump.", "zh": "我是说，就像我脑子里突然响起一声警报。我说，这个人把自己的生活安排得明明白白，这个人什么都想通了，这个人有答案。甘先生，我愿意追随你到任何地方。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So, I got company.", "zh": "于是，我有了同伴。"}, {"t": "a", "text": "Forrest runs up a slope on a high mountain road. A group of people are jogging behind him.", "zh": "福雷斯跑上高山公路的斜坡，一群人跟在他身后慢跑。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And after that I got more company. And then...", "zh": "之后我的同伴越来越多。再后来……"}, {"t": "a", "text": "A large group jogs behind Forrest across the desert road.", "zh": "一大群人跟着福雷斯跑过沙漠公路。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...even more people joined in. Somebody later told me...", "zh": "……更多的人加入进来。后来有人告诉我……"}]}, {"index": 171, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "...it gave people hope. Now... Now, I don't know anything about that, but...", "zh": "……这给了人们希望。这个嘛……这些我可不懂，不过……"}, {"t": "a", "text": "Forrest and his followers job through a small town. A man runs up and talks to Forrest.", "zh": "福雷斯和追随者们慢跑穿过一个小镇。一个男人跑上来跟他说话。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Some of those people asked me if I could help them out.", "zh": "有些人问我能不能帮他们一把。"}, {"t": "d", "speaker": "AGING HIPPIE", "note": "", "text": "Hey, man, hey, listen. I was wondering if you might help me, huh? Listen, I'm in the bumper sticker business and I've been trying to think up a good slogan. And since you have been such a big inspiration to the people around here, I thought you might be able to help me jump into... Whoa! Man, you just ran through a big pile of dogshit!", "zh": "嘿，伙计，听着。我想请你帮个忙，啊？我是做保险杠贴纸生意的，一直想不出好标语。既然你给这一带的人这么大的鼓舞，我想你也许能帮我想出……哇！伙计，你刚踩过一大堆狗屎！"}, {"t": "a", "text": "The hippie jumps over the \"dogshit\" as he runs along Forrest.", "zh": "嬉皮士边跟着福雷斯跑边跳过那堆“狗屎”。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It happens.", "zh": "这种事难免。"}, {"t": "d", "speaker": "AGING HIPPIE", "note": "", "text": "What, shit?", "zh": "什么？狗屎？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Sometimes.", "zh": "有时候难免。"}, {"t": "a", "text": "The hippie stops to ponder this profound thought.", "zh": "嬉皮士停下脚步，琢磨这句深刻的话。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And some years later I heard that fella did come up with a bumper sticker slogan...", "zh": "几年后，我听说那家伙真的想出了一条保险杠贴纸标语……"}, {"t": "a", "text": "A bumper sticker reads \"Shit Happens.\"", "zh": "贴纸上写着：“Shit Happens（人生总难免踩狗屎）”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...and he make a lot of money off of it.", "zh": "……还靠它赚了一大笔钱。"}, {"t": "a", "text": "The truck with the bumper sticker drives into an intersection.", "zh": "贴着那条贴纸的卡车开进十字路口。"}, {"t": "a", "text": "It collides with a car.", "zh": "它和一辆汽车相撞。"}]}, {"index": 172, "title": "EXT. TRUCK STOP", "blocks": [{"t": "a", "text": "Forrest runs, followed by his group, as a man runs up to him.", "zh": "福雷斯跑着，身后跟着人群，一个男人跑上前来。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Another time I was running along, somebody who had lost all his money in the T-shirt business, and he wanted to put my face on a T-shirt, but he couldn't draw that well and he didn't have a camera.", "zh": "还有一次我正跑着，有个做 T 恤生意赔光了钱的人，想把我的脸印在 T 恤上，可他画得不好，也没带相机。"}, {"t": "d", "speaker": "WILD-EYED MAN", "note": "", "text": "I think it would be really fortunate for me if I could get your name on these, oh, your face and name on these T-shirts. It would be wonderful.", "zh": "我想要是能把你的名字，哦，你的脸和名字印在这些 T 恤上，我就太走运了。那一定棒极了。"}, {"t": "a", "text": "A truck splashes mud onto Forrest as it goes by. The man hands Forrest a yellow T-shirt to use as a rag to wipe the mud off.", "zh": "一辆卡车驶过，溅了福雷斯一身泥。男人递给他一件黄色 T 恤当抹布擦泥。"}, {"t": "d", "speaker": "WILD-EYED MAN", "note": "", "text": "Here, use this one. Nobody likes that color anyway.", "zh": "给，用这件吧。反正也没人喜欢这颜色。"}, {"t": "a", "text": "Forrest wipes his face on the towel and hands it back to the man.", "zh": "福雷斯用它擦了脸，还给那个男人。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Have a nice day.", "zh": "祝你今天愉快。"}, {"t": "a", "text": "The man looks at the T-shirt. He holds it up displaying the \"Happy Face.\"", "zh": "男人看着 T 恤，把它举起来——上面是一个“笑脸”图案。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And some years later I found out that that man did come up with a idea for a T-shirt and he made a lot of money off of it.", "zh": "几年后我才知道，那家伙真的想出了一个 T 恤图案，还靠它赚了一大笔钱。"}]}, {"index": 173, "title": "EXT. MONUMENT VALLEY", "blocks": [{"t": "a", "text": "Forrest runs with a group that follows behind him.", "zh": "福雷斯和跟在身后的人群一起跑。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Anyway, like I was saying, I had a lot of company. My Momma always said you got to put the past behind you before you can move on. And I think that's what my running was all about. I had run for three years, two months, fourteen days, and sixteen hours.", "zh": "总之，就像我说的，我有很多同伴。妈妈总说，你得把过去抛在身后，才能继续往前走。我想我跑步的意义就在于此。我一共跑了三年两个月十四天零十六个小时。"}, {"t": "a", "text": "Forrest stops running. The group stops behind him. Forrest stands and looks as the group waits expectantly. Forrest turns and look.", "zh": "福雷斯停下脚步，人群在他身后停下。他站在那里张望，人群期待地等着。福雷斯转过身。"}, {"t": "d", "speaker": "YOUNG MAN", "note": "", "text": "Quiet. Quiet, he's gonna say something.", "zh": "安静。安静，他要说话了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm pretty tired. I think I'll go home now.", "zh": "我很累了。我想我该回家了。"}, {"t": "a", "text": "Forrest walks toward the group. The group parts for Forrest as he walks down the middle of the road.", "zh": "福雷斯朝人群走去。人们让开一条路，他沿马路中央走去。"}, {"t": "d", "speaker": "YOUNG MAN", "note": "", "text": "Now what are we supposed to do?", "zh": "那我们现在该怎么办？"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And just like that, my running days was over. So, I went home to Alabama.", "zh": "就这样，我的跑步岁月结束了。于是我回到了亚拉巴马的家。"}, {"t": "a", "text": "A television shows President Reagan and his staff as they react to gunshots in front of a limo.", "zh": "电视上是里根总统和他的幕僚在一辆豪华轿车前遭遇枪声时的反应。"}, {"t": "d", "speaker": "NEWSCASTER", "note": "over television", "text": "Moments ago, at two twenty-five p.m., as President Reagan was leaving the Washington Hilton Hotel...", "zh": "不久前，下午两点二十五分，里根总统正离开华盛顿希尔顿酒店……"}]}, {"index": 174, "title": "INT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Forrest sits eating a sandwich, watching the news of the assassination attempt.", "zh": "福雷斯坐着吃三明治，看着这起暗杀企图的新闻。"}, {"t": "d", "speaker": "NEWSCASTER", "note": "", "text": "...five or six gunshots were fired by an unknown would-be assassin. The President was shot in the chest and the assailant was immediately tackled by a half a dozen lawmen. As the Presidential...", "zh": "……一名身份不明的潜在刺客开了五六枪。总统胸部中弹，行凶者立刻被六名执法人员扑倒。随着总统……"}, {"t": "d", "speaker": "LOUISE", "note": "", "text": "I picked up the mail.", "zh": "我去取了邮件。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Oh, thank you, Miss, Miss Louise.", "zh": "哦，谢谢你，露……露易丝小姐。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "One day, out of the blue clear sky, I got a letter from Jenny...", "zh": "有一天，毫无预兆地，我收到珍妮的一封来信……"}]}, {"index": 175, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "a", "text": "Forrest takes the letter out of his pocket.", "zh": "福雷斯从口袋里掏出信。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...wondering if I could come down to Savannah to see her, and that's what I'm doing here. She saw me on TV, running, I'm supposed to go on the Number Nine bus to Richmond Street and get off and go one block left to 1-9-4-7 Henry Street, Apartment 4.", "zh": "……问我能不能来萨凡纳看她，所以我才在这儿。她在电视上看到我跑步。我应该坐九路车到里士满街下车，往左走一个街区，到亨利街1947号4号公寓。"}, {"t": "a", "text": "The elderly woman looks at the letter.", "zh": "老妇人看着那封信。"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "Why, you don't need to take a bus. Henry Street is just five or six blocks down that way.", "zh": "哎呀，你不用坐车。亨利街往那边走五六个街区就到了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Down that way?", "zh": "往那边？"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "Down that way.", "zh": "往那边。"}, {"t": "a", "text": "Forrest hastily grabs his suitcase and letter as he stands.", "zh": "福雷斯赶紧抓起箱子和信站起身。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It was nice talking' to you.", "zh": "和您聊天很开心。"}, {"t": "a", "text": "Forrest runs, the elderly woman shouts from the bus stop bench. A truck honks its horn as Forrest runs across the street past the truck.", "zh": "福雷斯跑过马路，老妇人在公交长椅旁喊他。一辆卡车朝他按起喇叭。"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "I hope everything works out for you.", "zh": "希望你一切顺利。"}]}, {"index": 176, "title": "INT. JENNY'S APARTMENT - DAY", "blocks": [{"t": "a", "text": "Jenny opens the door.", "zh": "珍妮打开门。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey! Forrest! How you doing?", "zh": "嘿！福雷斯！你好吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hi.", "zh": "嗨。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Come in. Come in.", "zh": "进来。进来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I got your letter.", "zh": "我收到你的信了。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Oh, I was wondering about that.", "zh": "哦，我还担心呢。"}, {"t": "a", "text": "Jenny shuts the door. Forrest looks around.", "zh": "珍妮关上门。福雷斯四下打量。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Is this your house?", "zh": "这是你的房子？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Yeah, it's messy right now. I just got off work.", "zh": "是啊，现在有点乱，我刚下班。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It's nice. You got air conditioning.", "zh": "不错。有空调。"}, {"t": "a", "text": "Forrest hands Jenny the box of chocolates.", "zh": "福雷斯把那盒巧克力递给珍妮。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Ah...", "zh": "啊……"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Thank you.", "zh": "谢谢你。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I ate some.", "zh": "我吃了几块。"}, {"t": "a", "text": "Jenny picks up a scrapbook and turns the pages.", "zh": "珍妮拿起一本剪贴簿翻页。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey, I kept, I kept a scrapbook of your, of your clippings and everything. There you are. This, I got your running.", "zh": "嘿，我一直……一直保存着一本剪贴簿，贴满了关于你的剪报什么的。看，这是你。这张是你跑步的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I ran a long way. For a long time.", "zh": "我跑了很远，跑了很久。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "There. Listen, Forrest. I don't know how to say this. Um, I just... I want to apologize for anything that I ever did to you, 'cause I was messed up for a long time, and...", "zh": "给。听着，福雷斯。我不知道该怎么说。呃，我只是……我想为我以前对你做过的所有事道歉，因为我有很长一段时间都过得一团糟，而且……"}, {"t": "a", "text": "There is a knock at the door. LYNN MARIE enters as she opens the door.", "zh": "有人敲门。琳·玛丽开门进来。"}, {"t": "d", "speaker": "LYNN MARIE", "note": "", "text": "Yoo-hoo.", "zh": "哟——嗬。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey.", "zh": "嘿。"}, {"t": "d", "speaker": "LYNN MARIE", "note": "", "text": "Hi.", "zh": "嗨。"}, {"t": "a", "text": "Jenny grabs a young boy.", "zh": "珍妮拉过一个小男孩。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey, you. This is an old friend from Alabama.", "zh": "嘿，宝贝。这是一位从亚拉巴马来的老朋友。"}, {"t": "d", "speaker": "LYNN MARIE", "note": "", "text": "Oh, how do you do?", "zh": "哦，您好。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Ah, listen, next week my schedule changes, so I'll be able to... but thanks for picking up.", "zh": "啊，听着，下周我的排班就变了，到时我就能……不过谢谢你接孩子。"}, {"t": "d", "speaker": "LYNN MARIE", "note": "", "text": "No problem. Got to go, Jen. I'm double parked.", "zh": "不客气。我得走了，珍。我车双排停着挡路呢。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "a", "text": "Lynn Marie closes the door and waves bye to Forrest.", "zh": "琳·玛丽关上门，朝福雷斯挥手道别。"}, {"t": "d", "speaker": "LYNN MARIE", "note": "", "text": "Bye.", "zh": "再见。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Thanks. This is very good friend, Mr. Gump. Can you say hi to him?", "zh": "谢谢。这位是很好的朋友，甘先生。你能跟他打个招呼吗？"}, {"t": "d", "speaker": "LITTLE BOY", "note": "", "text": "Hello, Mr. Gump.", "zh": "您好，甘先生。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hello.", "zh": "你好。"}, {"t": "d", "speaker": "LITTLE BOY", "note": "", "text": "Now, can I go watch TV now?", "zh": "现在我可以去看电视了吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Yes, you can. Just keep it low.", "zh": "可以，声音开小一点。"}, {"t": "a", "text": "The little boy runs into other room and picks up TV remote control.", "zh": "小男孩跑进另一个房间，拿起电视遥控器。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You're a momma, Jenny.", "zh": "你当妈妈了，珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'm a momma. His name is Forrest.", "zh": "我当妈妈了。他叫福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Like me.", "zh": "和我一样。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I named him after his Daddy.", "zh": "我用他爸爸的名字给他取的名。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "He got a daddy named Forrest, too?", "zh": "他也有个叫福雷斯的爸爸？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You're his daddy, Forrest.", "zh": "你就是他爸爸，福雷斯。"}, {"t": "a", "text": "Forrest continues to stare at Forrest Jr. Forrest then looks frightened and starts to back away.", "zh": "福雷斯一直盯着小福雷斯看，随即面露惧色，开始往后退。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey, Forrest, look at me. Look at me, Forrest. There's nothing you need to do, okay? You didn't do anything wrong. Okay?", "zh": "嘿，福雷斯，看着我。看着我，福雷斯。你什么都不用做，好吗？你没有做错什么。好吗？"}, {"t": "a", "text": "Jenny turns and looks at Forrest Jr. in the other room.", "zh": "珍妮转头看着另一个房间里的小福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Isn't he beautiful?", "zh": "他是不是很漂亮？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "He's the most beautiful thing I've ever seen. But... is, is he smart, or is he...", "zh": "他是我见过最漂亮的。可是……他，他聪明吗，还是说他……"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "He's very smart. He's one of the smartest in his class.", "zh": "他非常聪明。是班上最聪明的孩子之一。"}, {"t": "a", "text": "Forrest breathes deep. He looks at Jenny, then at Forrest Jr.", "zh": "福雷斯深吸一口气，看看珍妮，又看看小福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Yeah, it's okay. Go talk to him.", "zh": "好了，没事的。去跟他说说话吧。"}, {"t": "a", "text": "Forrest walks into the room and sits down next to Forrest Jr. \"Sesame Street\" is on the TV.", "zh": "福雷斯走进房间，在小福雷斯身边坐下。电视里在播《芝麻街》。"}, {"t": "d", "speaker": "BERT", "note": "", "text": "Oh, great.", "zh": "哦，太好了。"}, {"t": "d", "speaker": "ERNIE", "note": "", "text": "Hey, Bert, can you give me a hand?", "zh": "嘿，伯特，能帮我个忙吗？"}, {"t": "d", "speaker": "BERT", "note": "", "text": "A hand? Well, yeah, what do you want, Ernie?", "zh": "帮忙？嗯，行啊，你要什么，厄尼？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What are you watching.", "zh": "你在看什么？"}, {"t": "d", "speaker": "FORREST JR.", "note": "", "text": "Bert and Ernie.", "zh": "伯特和厄尼。"}, {"t": "d", "speaker": "ERNIE", "note": "", "text": "Well, it's the first stage. Bert. It's planning to write a story, Bert. I have pencils right here to write with, Bert. Now, we got, uh, paper. I'll take that paper, Bert. See, we have the paper to write on.", "zh": "嗯，这是第一阶段，伯特。我打算写个故事，伯特。我这儿有写字用的铅笔，伯特。我们还有，呃，纸。那张纸给我，伯特。瞧，我们有可以写字的纸了。"}]}, {"index": 177, "title": "EXT. PARK - DAY", "blocks": [{"t": "a", "text": "Forrest and Jenny sit on a bench. Forrest Jr. swings behind them.", "zh": "福雷斯和珍妮坐在长椅上，小福雷斯在他们身后荡秋千。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, I'm sick.", "zh": "福雷斯，我病了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What, do you have a cough due to cold?", "zh": "怎么，是感冒引起的咳嗽吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I have some kind virus. And the doctors don't, they don't know what it is. And there isn't anything they can do about it.", "zh": "我感染了某种病毒。医生们不知道那是什么，他们束手无策。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You could come home with me. Jenny, you and little Forrest could come stay at my house in Greenbow. I'll take care of you if you're sick.", "zh": "你可以跟我回家。珍妮，你和小福雷斯可以住到我在绿弓的家里。你病了，我会照顾你们。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Would you marry me, Forrest?", "zh": "你愿意娶我吗，福雷斯？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}]}, {"index": 178, "title": "EXT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "A group has gathered on the lawn for the wedding. Louise walks up to Forrest.", "zh": "一群人聚在草坪上参加婚礼。露易丝走到福雷斯面前。"}, {"t": "d", "speaker": "MINISTER", "note": "", "text": "Please take your seats.", "zh": "请大家就座。"}, {"t": "d", "speaker": "LOUISE", "note": "", "text": "Forrest, it's time to start.", "zh": "福雷斯，该开始了。"}, {"t": "a", "text": "Jenny walks out of the house. Forrest walks over to greet her. She wears a white dress. She walks up to Forrest and adjusts his necktie.", "zh": "珍妮走出屋子，福雷斯迎上去。她穿着白色礼服，走到他面前替他整理领带。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hi. Your tie.", "zh": "嗨。你的领带歪了。"}, {"t": "a", "text": "Lt. Dan is walking across the lawn. He uses a cane. A WOMAN is walking next to him.", "zh": "丹中尉拄着手杖走过草坪，身边有一位女子陪着。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan? Lieutenant Dan!", "zh": "丹中尉？丹中尉！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Hello, Forrest.", "zh": "你好，福雷斯。"}, {"t": "a", "text": "Jenny walks over to Forrest and Lt. Dan.", "zh": "珍妮走向福雷斯和丹中尉。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You got new legs. New legs!", "zh": "你有新腿了。新腿！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Yeah, I got new legs.", "zh": "是啊，我有新腿了。"}, {"t": "a", "text": "Lt. Dan lifts his pant leg to display his metal leg.", "zh": "丹中尉撩起裤腿，露出金属假肢。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Custom-made titanium alloy. It's what they use on the space shuttle.", "zh": "定制的钛合金，航天飞机上用的就是这种材料。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Magic legs.", "zh": "魔法腿。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "This is my fiancee, Susan.", "zh": "这是我的未婚妻，苏珊。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan!", "zh": "丹中尉！"}, {"t": "a", "text": "Susan shakes Forrest's hand.", "zh": "苏珊和福雷斯握手。"}, {"t": "d", "speaker": "SUSAN", "note": "", "text": "Hi, Forrest.", "zh": "嗨，福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan, this is my Jenny.", "zh": "丹中尉，这是我的珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey, it's nice to meet you, finally.", "zh": "嘿，终于见到你，真高兴。"}, {"t": "a", "text": "Jenny steps forward and kisses Lt. Dan's cheek. The group is seated as they watch Forrest and Jenny take vows on the front lawn. Forrest Jr. stands next to Jenny.", "zh": "珍妮上前亲了亲丹中尉的脸颊。众人入座，看着福雷斯和珍妮在门前草坪上宣誓。小福雷斯站在珍妮身旁。"}, {"t": "d", "speaker": "MINISTER", "note": "", "text": "Do you, Forrest, take Jenny to be your wife? Do you, Jenny, take Forrest to be your husband? If so, I pronounce you man and wife.", "zh": "福雷斯，你愿意娶珍妮为妻吗？珍妮，你愿意嫁给福雷斯吗？既然如此，我宣布你们结为夫妻。"}, {"t": "a", "text": "The wind blows fallen leaves across the ground. Jenny, Forrest, and Forrest Jr. walk toward the house. They all hold hands as they walk.", "zh": "风吹着落叶掠过地面。珍妮、福雷斯和小福雷斯朝屋子走去，三人手牵着手。"}]}, {"index": 179, "title": "INT. GUMP HOUSE - MORNING", "blocks": [{"t": "a", "text": "Forrest steps into Jenny's bedroom. He carries a tray with breakfast on it. Forrest looks at Jenny as she sleeps.", "zh": "福雷斯端着早餐托盘走进珍妮的卧室，看着熟睡的珍妮。"}, {"t": "a", "text": "Slowly she wakes up and looks at Forrest.", "zh": "她慢慢醒来，看着福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey.", "zh": "嘿。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey.", "zh": "嘿。"}, {"t": "a", "text": "Forrest sets the tray down next to Jenny as she sits up in bed. Forrest opens a window, then sits down next to the bed.", "zh": "珍妮在床上坐起，福雷斯把托盘放在她身旁，又打开一扇窗，在床边坐下。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey, Forrest, were you scared in Vietnam?", "zh": "嘿，福雷斯，你在越南的时候害怕过吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes. Well, I, I don't know.", "zh": "害怕过。嗯，我，我不知道。"}]}, {"index": 180, "title": "EXT. VIETNAM - FLASHBACK - NIGHT", "blocks": [{"t": "a", "text": "Forrest looks up into the sky as the rain stops. Forrest removes his helmet. The stars emerge from behind the clouds.", "zh": "雨停了，福雷斯仰望天空，摘下头盔，星星从云层后露出来。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometimes it would stop raining long enough for the stars to come out. And then it was nice. It was like just before the sun goes to bed down on the bayou...", "zh": "有时候雨会停得够久，让星星出来。那时候真美，就像太阳在河湾上落下之前……"}]}, {"index": 181, "title": "EXT. BAYOU - FLASHBACK - SUNSET", "blocks": [{"t": "a", "text": "Forrest stands on his boat and looks at a deep orange and red sunset.", "zh": "福雷斯站在船上，望着深红与橘红色的落日。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "There was over a million sparkles on the water. Like that mountain lake.", "zh": "水面上闪烁着上百万点光芒。就像那座山间湖泊。"}]}, {"index": 182, "title": "EXT. MOUNTAIN LAKE - FLASHBACK - DAY", "blocks": [{"t": "a", "text": "Forrest runs along a highway. A lake reflects the mountains and the sky.", "zh": "福雷斯沿公路跑着，湖面倒映着群山和天空。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It was so clear, Jenny. It looks like there were two skies, one on top of the other. And then in the desert, when the sun comes up...", "zh": "那里清澈极了，珍妮。看起来就像有两片天空，上下叠在一起。还有在沙漠里，太阳升起的时候……"}]}, {"index": 183, "title": "EXT. DESERT - FLASHBACK - SUNRISE", "blocks": [{"t": "a", "text": "Forrest runs along a desert highway. The morning light casts an orange glow over the desert.", "zh": "福雷斯沿沙漠公路跑着，晨光给沙漠镀上一层橘红。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I couldn't tell where heavens stopped and the earth began. It was so beautiful.", "zh": "我分不清天从哪里开始、地从哪里结束。太美了。"}]}, {"index": 184, "title": "INT. GUMP HOUSE - MORNING", "blocks": [{"t": "a", "text": "Forrest looks at Jenny. Jenny looks out the window.", "zh": "福雷斯看着珍妮。珍妮望向窗外。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I wish I could have been there with you.", "zh": "真希望那时候我能和你在一起。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You were.", "zh": "你在的。"}, {"t": "a", "text": "Jenny reaches over and takes Forrest's hand.", "zh": "珍妮伸手握住福雷斯的手。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I love you.", "zh": "我爱你。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "You died on a Saturday morning.", "zh": "你在一个星期六的早上去世了。"}]}, {"index": 185, "title": "EXT. JENNY'S GRAVE AT OLD OAK TREE - DAY", "blocks": [{"t": "a", "text": "Forrest stands under the old oak tree where Jenny has been buried.", "zh": "福雷斯站在那棵老橡树下，珍妮就安葬在这里。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And I had you placed here under our tree.", "zh": "我把你安葬在了我们的树下。"}, {"t": "a", "text": "Jenny's grave marker. Forrest tries to hold back his tears.", "zh": "珍妮的墓碑。福雷斯强忍着泪水。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And I had that house of your father's bulldozed to the ground.", "zh": "我还让人把你爸爸那栋房子用推土机推平了。"}]}, {"index": 186, "title": "EXT. JENNY'S OLD HOUSE - DAY", "blocks": [{"t": "a", "text": "Forrest watches as Jenny's dad's house is knocked down by a bulldozer.", "zh": "福雷斯看着珍妮父亲的房子被推土机推倒。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma...", "zh": "妈妈……"}]}, {"index": 187, "title": "EXT. JENNY'S GRAVE", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "...always said dyin' was a part of life.", "zh": "……总说死亡是生命的一部分。"}, {"t": "a", "text": "Jenny's grave marker reads: JENNY GUMP July 16, 1945 -- March 22, 1982 Beloved Mother, Wife and Friend", "zh": "珍妮的墓碑上写着：珍妮·甘，1945年7月16日——1982年3月22日，深爱的母亲、妻子与朋友。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I sure wish it wasn't. Little Forrest, he's doing just fine.", "zh": "我真希望它不是。小福雷斯一切都好。"}]}, {"index": 188, "title": "INT. GUMP HOUSE - NIGHT", "blocks": [{"t": "a", "text": "Forrest Jr. reads a book to Forrest sitting next to him.", "zh": "小福雷斯挨着福雷斯坐下，给他读书。"}, {"t": "d", "speaker": "FORREST JR.", "note": "reading", "text": "\"But he wasn't quite sure. Everywhere they went, the new guests...", "zh": "“可他不太确定。他们每到一处，新来的客人……”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "About to start school again soon. I make his breakfast, lunch, and dinner...", "zh": "很快又要开学了。我每天给他做早饭、午饭和晚饭……"}]}, {"index": 189, "title": "EXT. JENNY'S GRAVE", "blocks": [{"t": "a", "text": "Forrest looks down as he sobs.", "zh": "福雷斯低头抽泣。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...every day. I make sure he combs his hair and brushes his teeth every day. Teaching him how to play ping pong.", "zh": "……每天。我确保他每天梳头、刷牙。我教他打乒乓球。"}]}, {"index": 190, "title": "EXT. GUMP HOUSE - NIGHT", "blocks": [{"t": "a", "text": "Forrest tries to teach Forrest Jr. how to play ping-pong.", "zh": "福雷斯试着教小福雷斯打乒乓球。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay...", "zh": "好……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "He's really good.", "zh": "他打得可好了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Forrest, you go.", "zh": "福雷斯，该你了。"}, {"t": "a", "text": "Forrest Jr. serves the ball, causing Forrest dive and miss it.", "zh": "小福雷斯发球，福雷斯扑过去却没接住。"}]}, {"index": 191, "title": "EXT. GUMP HOUSE/RIVER - DAY", "blocks": [{"t": "a", "text": "Forrest and Forrest Jr. sit on a log by the river and fish.", "zh": "福雷斯和小福雷斯坐在河边的圆木上钓鱼。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "We fish a lot.", "zh": "我们常去钓鱼。"}]}, {"index": 192, "title": "EXT. JENNY'S GRAVE", "blocks": [{"t": "a", "text": "Forrest looks down at the grave marker.", "zh": "福雷斯低头看着墓碑。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And every night, we read a book. He's so smart, Jenny. You'd be so proud of him. I am. He, uh, wrote a letter, and he says I can't read it. I'm not supposed to, so I'll just leave it here for you.", "zh": "每天晚上我们都读书。他可聪明了，珍妮。你一定会为他骄傲的。我就很骄傲。他，呃，写了一封信，还说不许我看。既然不让我看，我就把它留在这儿给你。"}, {"t": "a", "text": "Forrest places the letter down at the grave marker, next to fresh flowers. The name on the envelope reads: \"Mom.\" Forrest steps back and looks down at the grave.", "zh": "福雷斯把信放在墓碑旁的鲜花边。信封上写着：“妈妈”。他退后一步，低头看着墓。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Jenny, I don't know if Momma was right or if, if it's Lieutenant Dan. I don't know if we each have a destiny, or if we're all just floating around accidental-like on a breeze, but I, I think maybe it's both. Maybe both is happening at the same time. I miss you, Jenny. If there's anything you need, I won't be far away.", "zh": "珍妮，我不知道妈妈是对的，还是丹中尉是对的。我不知道我们每个人是否都有自己的命运，还是说我们都只是随风偶然飘荡。但我，我想也许两者都有，也许它们在同时发生。我想你，珍妮。如果你需要什么，我就在不远处。"}, {"t": "a", "text": "As Forrest walks away, a flock of birds flies overhead and lands in the tree. Forrest turns and watches.", "zh": "福雷斯走开时，一群鸟从头顶飞过，落在树上。他驻足回头张望。"}]}, {"index": 193, "title": "EXT. ROAD - MORNING", "blocks": [{"t": "a", "text": "Forrest walks with Forrest Jr. for the bus. The bus drives toward them.", "zh": "福雷斯陪小福雷斯等校车，车朝他们驶来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Here's your bus. Okay.", "zh": "你的车来了。好。"}, {"t": "a", "text": "Forrest pulls \"Curious George\" out of Forrest Jr.'s backpack.", "zh": "福雷斯从小福雷斯的背包里抽出《好奇的乔治》。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey, I know this.", "zh": "嘿，这本书我知道。"}, {"t": "d", "speaker": "FORREST JR.", "note": "", "text": "I'm gonna show that for show-and- tell because grandma used to read it to you.", "zh": "我要带它去做展示讲述，因为奶奶以前常读给你听。"}, {"t": "a", "text": "Forrest looks at the book. The feather from the beginning of the movie drops out of the book, unnoticed.", "zh": "福雷斯看着书，影片开头的那根羽毛从书里飘落，他没有察觉。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My favorite book.", "zh": "我最喜欢的书。"}, {"t": "a", "text": "The bus comes to a stop. The door opens.", "zh": "公交车停稳，车门打开。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well...", "zh": "嗯……"}, {"t": "a", "text": "Forrest puts the book back into Forrest Jr.'s backpack and hands it to him.", "zh": "福雷斯把书放回小福雷斯的背包，递给他。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...okay. Hey, there you go.", "zh": "……好了。嘿，拿好。"}, {"t": "a", "text": "Forrest Jr. walks toward the bus. Forrest stands up.", "zh": "小福雷斯朝校车走去。福雷斯站起身。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey, Forrest. Don't... I wanted to tell you I love you.", "zh": "嘿，福雷斯。别……我想告诉你，我爱你。"}, {"t": "d", "speaker": "FORREST JR.", "note": "", "text": "I love you too, Daddy.", "zh": "我也爱你，爸爸。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'll be right here when you get back.", "zh": "你回来的时候，我就在这儿。"}, {"t": "a", "text": "Forrest Jr. looks into the bus and at the bus driver. It is the same bus driver, only older now, who drove Forrest to school when he was a young boy.", "zh": "小福雷斯看着车门和司机——还是当年送小福雷斯上学的那位司机，只是上了年纪。"}, {"t": "d", "speaker": "SCHOOLD BUS DRIVER", "note": "", "text": "You understand this is the bus to school now, don't you?", "zh": "你知道这是去学校的车，对吧？"}, {"t": "d", "speaker": "FORREST JR.", "note": "", "text": "Of course, and you're Dorothy Harris and I'm Forrest Gump.", "zh": "当然，您是多萝西·哈里斯，我是福雷斯·甘。"}, {"t": "a", "text": "Forrest Jr. looks over and waves to his father. Forrest nods approvingly.", "zh": "小福雷斯回头朝父亲挥手。福雷斯赞许地点点头。"}, {"t": "a", "text": "Forrest Jr. gets on the bus. The bus pulls away. Forrest stands next to the mailbox.", "zh": "小福雷斯上了车，车驶离。福雷斯站在邮箱旁。"}, {"t": "a", "text": "Forrest sits down. The camera cranes down, revealing the feather as it lies at Forrest's feet.", "zh": "福雷斯坐下。镜头摇下，露出落在他脚边的羽毛。"}, {"t": "a", "text": "A gust of wind picks the feather up. The feather floats up into the air.", "zh": "一阵风把羽毛卷起，羽毛飘向空中。"}, {"t": "a", "text": "Forrest sits at the side of the road. The feather floats higher into the air.", "zh": "福雷斯坐在路边，羽毛越飞越高。"}, {"t": "a", "text": "The feather soars up into the sky and travels up and down, then covers the camera lens.", "zh": "羽毛飞向天空，上下飘舞，最后遮住了镜头。"}]}];
const META = {"scenes": 193, "dialogue": 1077};

const SPEAKER_COLORS = {
  "FORREST": "#2f6fb3", "JENNY": "#c2456f", "MRS. GUMP": "#8e5bb0",
  "LT. DAN": "#d07a2c", "BUBBA": "#3e9c5f", "ELVIS": "#b8860b",
  "PRINCIPAL": "#6b7a8f", "PRESIDENT KENNEDY": "#3d7aaf",
  "PRESIDENT JOHNSON": "#7a8b3d", "PRESIDENT NIXON": "#8a5a44",
  "DRILL SERGEANT": "#a83e3e", "ABBIE HOFFMAN": "#c05621"
};
function speakerColor(name) {
  if (SPEAKER_COLORS[name]) return SPEAKER_COLORS[name];
  let hash = 0;
  for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = hash % 360;
  return `hsl(${hue} 42% 48%)`;
}
function esc(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

      · 阅读进度、设置与收藏会自动保存在本浏览器中
    </div>`;
  article.appendChild(cover);
}

function renderScenes() {
  const fragment = document.createDocumentFragment();
  const navFragment = document.createDocumentFragment();
  SCREENPLAY_DATA.forEach((scene) => {
    const section = document.createElement("section");
    section.className = "scene";
    section.id = "scene-" + scene.index;
    section.dataset.index = scene.index;
    const head = document.createElement("div");
    head.className = "scene-head";
    head.innerHTML = `<span class="scene-no">#${scene.index}</span><span>${esc(scene.title)}</span>`;
    section.appendChild(head);

    scene.blocks.forEach((block, blockIndex) => {
      const el = document.createElement("div");
      el.className = "block " + (block.t === "d" ? "dialogue" : "action");
      el.dataset.scene = scene.index;
      el.dataset.id = `${scene.index}-${blockIndex}`;
      let inner = `<button class="star-btn" title="收藏这句">★</button>`;
      if (block.t === "d") {
        const color = speakerColor(block.speaker);
        inner += `<div class="speaker"><span class="dot" style="background:${color}"></span>
          <span style="color:${color}">${esc(block.speaker)}</span>
          ${block.note ? `<span class="note">(${esc(block.note)})</span>` : ""}</div>`;
      }
      inner += `<div class="line">${esc(block.text)}</div>`;
      inner += `
        <div class="zh-translation" lang="zh-CN">${esc(block.zh || "")}</div>
        <button class="zh-toggle" type="button" aria-expanded="false" title="显示这句的中文翻译">译</button>
      `;
      el.innerHTML = inner;
      section.appendChild(el);
    });
    fragment.appendChild(section);

    const item = document.createElement("button");
    item.className = "scene-item";
    item.dataset.target = scene.index;
    item.innerHTML = `<span class="num">#${String(scene.index).padStart(3, "0")}</span>${esc(scene.title)}`;
    navFragment.appendChild(item);
  });
  article.appendChild(fragment);
  sceneList.appendChild(navFragment);
}
renderCover();
renderScenes();

function isTranslationVisible(blockElement) {
  if (blockElement.classList.contains("show-zh")) return true;
  if (blockElement.classList.contains("hide-zh")) return false;
  return settings.showTranslations;
}

function updateTranslationControls() {
  const globalButton = document.getElementById("translationToggle");
  const globalLabel = document.getElementById("translationToggleLabel");
  globalButton.classList.toggle("active", settings.showTranslations);
  globalButton.setAttribute("aria-pressed", String(settings.showTranslations));
  globalLabel.textContent = settings.showTranslations ? "隐藏译文" : "显示译文";

  document.querySelectorAll(".block").forEach(blockElement => {
    const toggleButton = blockElement.querySelector(".zh-toggle");
    const translationElement = blockElement.querySelector(".zh-translation");
    const visible = isTranslationVisible(blockElement);
    toggleButton.textContent = visible ? "隐藏" : "译";
    toggleButton.classList.toggle("on", visible);
    toggleButton.setAttribute("aria-expanded", String(visible));
    toggleButton.title = visible ? "隐藏这句的中文翻译" : "显示这句的中文翻译";
    translationElement.setAttribute("aria-hidden", String(!visible));
  });
}

/* ---------------- Word lookup popover ---------------- */
const popover = document.getElementById("popover");
let currentWord = "";
let popoverAnchor = null;

const WORD_RE = /[A-Za-z]+(?:['’][A-Za-z]+)?/g;
function wordAtPoint(clientX, clientY) {
  let caret = null;
  if (document.caretRangeFromPoint) {
    caret = document.caretRangeFromPoint(clientX, clientY);
  } else if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(clientX, clientY);
    if (pos) caret = { startContainer: pos.offsetNode, startOffset: pos.offset };
  }
  if (!caret || !caret.startContainer || caret.startContainer.nodeType !== Node.TEXT_NODE) return null;
  const node = caret.startContainer;
  if (!node.parentElement.closest(".line")) return null;
  const text = node.textContent;
  const offset = caret.startOffset;
  let left = offset, right = offset;
  const isWordChar = ch => /[A-Za-z'’]/.test(ch);
  while (left > 0 && isWordChar(text[left - 1])) left--;
  while (right < text.length && isWordChar(text[right])) right++;
  const raw = text.slice(left, right).replace(/['’]/g, m => m);
  if (!/[A-Za-z]/.test(raw)) return null;
  const range = document.createRange();
  range.setStart(node, left);
  range.setEnd(node, right);
  return { word: raw.toLowerCase(), range };
}

async function lookupWord(word, anchor) {
  popoverAnchor = anchor;
  currentWord = word;
  const saved = favWords.some(item => item.word === word);
  popover.innerHTML = `
    <div><span class="word">${esc(word)}</span></div>
    <div class="loading">正在查询词典…</div>
    <div class="links">
      <a href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(word)}" target="_blank">剑桥词典 ↗</a>
      <a href="https://www.youdao.com/result?word=${encodeURIComponent(word)}&lang=en" target="_blank">有道词典 ↗</a>
      <button id="saveWordBtn" class="${saved ? "saved" : ""}">${saved ? "✓ 已在生词本" : "加入生词本"}</button>
    </div>`;
  positionPopover(anchor);
  popover.classList.add("open");

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) throw new Error("not found");
    const data = await res.json();
    const entry = data[0];
    const phonetic = entry.phonetic || (entry.phonetics || []).map(p => p.text).find(Boolean) || "";
    const audio = (entry.phonetics || []).map(p => p.audio).find(Boolean) || "";
    const meanings = (entry.meanings || []).slice(0, 4).map(m => {
      const defs = m.definitions.slice(0, 2).map(d =>
        `<li><span class="pos">${esc(m.partOfSpeech)}</span>${esc(d.definition)}` +
        (d.example ? `<span class="example">“${esc(d.example)}”</span>` : "") + `</li>`).join("");
      return defs;
    }).join("");
    popover.querySelector(".loading")?.remove();
    popover.querySelector(".word").insertAdjacentHTML("afterend",
      `<span class="phonetic">${esc(phonetic)}</span>` +
      (audio ? `<button class="audio-btn" id="audioBtn">🔊</button>` : ""));
    const list = document.createElement("ol");
    list.className = "meaning";
    list.innerHTML = meanings || "<li>暂无释义</li>";
    popover.querySelector(".links").before(list);
    if (audio) document.getElementById("audioBtn").onclick = () => new Audio(audio).play();
  } catch (err) {
    const loading = popover.querySelector(".loading");
    if (loading) { loading.textContent = "未找到该词的在线释义，可尝试外部词典链接。"; }
  }
  document.getElementById("saveWordBtn").onclick = () => {
    const btn = document.getElementById("saveWordBtn");
    const existing = favWords.find(item => item.word === word);
    if (existing) {
      favWords = favWords.filter(item => item.word !== word);
      btn.textContent = "加入生词本"; btn.classList.remove("saved");
      toast("已从生词本移除");
    } else {
      const def = popover.querySelector(".meaning li")?.textContent?.trim()?.slice(0, 120) || "";
      const phonetic = popover.querySelector(".phonetic")?.textContent || "";
      favWords.push({ word, phonetic, def });
      btn.textContent = "✓ 已在生词本"; btn.classList.add("saved");
      toast("已加入生词本 📌");
    }
    saveFavWords();
  };
}

function positionPopover(anchor) {
  const rect = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
  const top = window.scrollY + rect.bottom + 10;
  let left = window.scrollX + rect.left;
  const maxLeft = document.documentElement.scrollWidth - 340;
  left = Math.max(12 + window.scrollX, Math.min(left, maxLeft));
  popover.style.top = top + "px";
  popover.style.left = left + "px";
}
function showPopoverFor(word, anchorRect, anchorEl) {
  const fakeAnchor = anchorEl ? anchorEl : { getBoundingClientRect: () => anchorRect };
  lookupWord(word, fakeAnchor);
}

document.addEventListener("click", (e) => {
  if (e.target.closest(".popover") || e.target.closest(".star-btn") || e.target.closest(".saved-item") || e.target.closest(".zh-toggle")) return;
  if (e.target.closest(".drawer") || e.target.closest(".topbar")) { popover.classList.remove("open"); return; }
  const found = wordAtPoint(e.clientX, e.clientY);
  if (found) {
    e.preventDefault();
    lookupWord(found.word, found.range);
  } else {
    popover.classList.remove("open");
  }
});
window.addEventListener("scroll", () => popover.classList.remove("open"), { passive: true });

/* ---------------- Search ---------------- */
const searchInput = document.getElementById("searchInput");
const searchCount = document.getElementById("searchCount");
let hits = [];
let hitIndex = -1;

function runSearch() {
  const query = searchInput.value.trim();
  document.querySelectorAll("mark").forEach(mark => {
    const parent = mark.parentNode;
    parent.replaceChild(document.createTextNode(mark.textContent), mark);
    parent.normalize();
  });
  document.querySelectorAll(".block.hit").forEach(b => b.classList.remove("hit"));
  document.body.classList.toggle("is-searching", query.length > 0);
  hits = []; hitIndex = -1; searchCount.textContent = "";
  if (!query) return;

  const matcher = new RegExp("(" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  document.querySelectorAll(".block .line").forEach(line => {
    const block = line.closest(".block");
    if (matcher.test(line.textContent)) {
      block.classList.add("hit");
      hits.push(block);
      const walk = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walk.nextNode()) textNodes.push(walk.currentNode);
      textNodes.forEach(node => {
        if (!matcher.test(node.textContent)) return;
        matcher.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0;
        node.nodeValue.replace(matcher, (match, _g, offset) => {
          frag.appendChild(document.createTextNode(node.nodeValue.slice(last, offset)));
          const mark = document.createElement("mark");
          mark.textContent = match;
          frag.appendChild(mark);
          last = offset + match.length;
        });
        frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
        node.parentNode.replaceChild(frag, node);
      });
    }
  });
  searchCount.textContent = hits.length ? `${hits.length} 处` : "0";
  if (hits.length) gotoHit(0);
}
function gotoHit(i) {
  if (!hits.length) return;
  hitIndex = (i + hits.length) % hits.length;
  hits[hitIndex].scrollIntoView({ block: "center", behavior: "smooth" });
  searchCount.textContent = `${hitIndex + 1}/${hits.length}`;
}
let searchTimer;
searchInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); });
searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); gotoHit(hitIndex + (e.shiftKey ? -1 : 1)); }
  if (e.key === "Escape") { searchInput.value = ""; runSearch(); }
});
document.getElementById("searchNext").addEventListener("click", () => gotoHit(hitIndex + 1));
document.getElementById("searchPrev").addEventListener("click", () => gotoHit(hitIndex - 1));

/* ---------------- Scene navigation & scrollspy ---------------- */
sceneList.addEventListener("click", e => {
  const item = e.target.closest(".scene-item");
  if (!item) return;
  document.getElementById("scene-" + item.dataset.target).scrollIntoView();
  if (window.innerWidth <= 860) {
    document.body.classList.remove("nav-open");
    overlay.classList.remove("show");
  }
});
const sceneObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const index = entry.target.dataset.index;
    document.querySelectorAll(".scene-item").forEach(item =>
      item.classList.toggle("active", item.dataset.target === index));
    const active = document.querySelector(".scene-item.active");
    active?.scrollIntoView({ block: "nearest" });
  });
}, { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll(".scene").forEach(s => sceneObserver.observe(s));

/* ---------------- Progress & restore ---------------- */
const progressBar = document.getElementById("progressBar");
window.addEventListener("scroll", () => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + "%";
  localStorage.setItem("fg.scroll", String(window.scrollY));
}, { passive: true });
const savedScroll = +localStorage.getItem("fg.scroll");
if (savedScroll > 100) {
  window.scrollTo(0, savedScroll);
  setTimeout(() => window.scrollTo(0, savedScroll), 300);
}

/* ---------------- Keyboard shortcuts & toast ---------------- */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "f") {
    e.preventDefault(); searchInput.focus();
  }
  if (e.key === "Escape") {
    popover.classList.remove("open");
    document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
    overlay.classList.remove("show");
  }
});
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
</script>
