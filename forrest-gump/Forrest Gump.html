three men in the barber shop look up in disbelief. Mrs. Gump looks up in shock.", "zh": "约翰逊总统低头笑了。理发店里三个男人难以置信地抬头看。甘太太震惊地抬起头。"}, {"t": "d", "speaker": "PRESIDENT JOHNSON", "note": "", "text": "Goddamn, son.", "zh": "该死的，孩子。"}]}, {"index": 82, "title": "EXT. LINCOLN MEMORIAL - DAY", "blocks": [{"t": "a", "text": "Forrest walks by the Lincoln Memorial. A fence surrounds the Memorial, as well as armed military guards.", "zh": "福雷斯走过林肯纪念堂。纪念堂周围围着栅栏，还有武装卫兵。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "After that, Momma went to the hotel to lay down, so I went out for a walk to see our national capital.", "zh": "之后，妈妈回旅馆休息了，我就出去散步，看看我们国家的首都。"}, {"t": "d", "speaker": "ISABEL", "note": "", "text": "Hilary, all right, I've got the vets, what do you want me to do with them?", "zh": "希拉里，好了，退伍兵我都带来了，你要我把他们怎么安排？"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "What are you doing here so late?", "zh": "你怎么这么晚才来？"}, {"t": "a", "text": "Forrest takes a photo of the memorial as a woman named Hilary gathers together some veterans against the Vietnam War.", "zh": "福雷斯给纪念堂拍照，一个叫希拉里的女人正在集合一些反战退伍军人。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "We've been waiting for you for half an hour, so just get them in a line, will you. Hey, hey, come on, pictures later. You look great. Oh come on, get in this line, come on, come on right in line. Come on, let him here, let him in here.", "zh": "我们等了你半个小时了，让他们排好队。嘿，嘿，快点，照片待会儿再拍。你看起来真棒。快，站到队伍里来，快来，进来排好。让他进来，让他到这儿来。"}, {"t": "a", "text": "Hilary grabs Forrest and puts him in the line with the other vets against the war.", "zh": "希拉里一把拉过福雷斯，把他塞进反战退伍兵的队伍里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It's a good thing Momma was resting, 'cause the street was awful crowded with people looking at all the statues and monuments. And some of them people were loud and pushy.", "zh": "好在妈妈在休息，因为街上挤满了看雕像和纪念碑的人，吵吵嚷嚷的。有些人又吵又爱推搡。"}, {"t": "a", "text": "Hilary leads the line of vets toward the large anti-Vietnam War rally.", "zh": "希拉里领着退伍兵队伍走向大型反战集会。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Okay, follow me! Come on.", "zh": "好了，跟我来！快。"}, {"t": "a", "text": "The group of vets walk as Forrest tries to take another picture. A vet behind him pushes him along.", "zh": "队伍走着，福雷斯还想再拍张照，身后一个退伍兵推了他一把。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Let's move it out.", "zh": "快走了。"}, {"t": "d", "speaker": "VET", "note": "", "text": "Hey, buddy, come on. We could use your help.", "zh": "嘿，伙计，快来。我们需要你帮忙。"}, {"t": "a", "text": "Forrest walks in the line. A banner reads \"Veterans against the War in Vietnam.\"", "zh": "福雷斯走在队伍里。一条横幅上写着：“退伍军人反对越南战争”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Everywhere I went, I had to stand in line.", "zh": "不管去哪儿，我都得排队。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Follow me, let's go!", "zh": "跟我来，走了！"}, {"t": "a", "text": "Hilary leads the vets through a crowd of people outside the rally. Another woman, named Isabel, leads the vets toward the back of a stage.", "zh": "希拉里领着退伍兵穿过集会外的人群。另一个叫伊莎贝尔的女人把他们带到舞台后方。"}, {"t": "d", "speaker": "ISABEL", "note": "", "text": "All right, come on, guys.", "zh": "好了，快，伙计们。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Stand here.", "zh": "站在这儿。"}, {"t": "d", "speaker": "VET", "note": "", "text": "Hey, you're a good man for doin' this. Good!", "zh": "嘿，你能来真是好样的。好！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "a", "text": "A man, wearing an American flag shirt, stands on the stage.", "zh": "一个穿着美国国旗衬衫的男人站在台上。"}, {"t": "a", "text": "He is anti-war activist ABBIE HOFFMAN.", "zh": "他是反战活动人士阿比·霍夫曼。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "We must declare to that fucking impostor in the White House -- Johnson. We ain't going to work on your farm no more! Yeah!", "zh": "我们必须向白宫那个冒牌货——约翰逊——宣告：我们再也不会替你的农场卖命了！耶！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "There was this man, giving a little talk. And for some reason, he was wearing an American flag for a shirt...", "zh": "有个人在演讲。不知为什么，他穿着一件美国国旗做的衬衫……"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "Now, I'm going to bring up some soldiers that are going to talk about the war, man...", "zh": "现在，我要请几位士兵上来，让他们说说这场战争，伙计……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...and he liked to say the \"F\" word. A lot. \"F\" this and \"F\" that. And every time...", "zh": "……而且他特别爱说“操”字。张口闭口都是“操”。每次……"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "...that war has come home, and we have to stop these politicians...", "zh": "……战争已经打到了家门口，我们必须阻止这些政客……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...he said \"F\" word, people, for some reason, well, they'd cheer.", "zh": "……他一说“操”字，不知为什么，大家就欢呼。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "...these guys just told Lyndon Johnson where to stick this fucking war! Yeah!", "zh": "……这些弟兄刚刚告诉林登·约翰逊这场该死的战争该塞到哪儿去！耶！"}, {"t": "a", "text": "Forrest looks up at the cheering crowd. Abbie turns and motions for Forrest to come up on the stage.", "zh": "福雷斯抬头看着欢呼的人群。阿比转身示意福雷斯上台。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "Come on, man. Come up here, man.", "zh": "来吧，伙计。上来，伙计。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Come on. Come on. Yeah, you!", "zh": "快来。快来。对，就是你！"}, {"t": "a", "text": "Hilary pulls Forrest up onto the stage.", "zh": "希拉里把福雷斯拉上台。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "Come on, get up there. Come on. Move, move. Let's go! Let's go.", "zh": "快，上去。快。动起来，动起来。走！走。"}, {"t": "a", "text": "The other vets follow Forrest pushes onto the stage and push him toward the microphones.", "zh": "其他退伍兵跟着福雷斯挤上台，把他推向麦克风。"}, {"t": "d", "speaker": "VET", "note": "", "text": "Come on, go. You can do it. Just get up there. Go on. That's it.", "zh": "快，去吧。你能行的。上去吧。去吧。对了。"}, {"t": "a", "text": "Thousands of cheering protesters stand around the Washington Monument. Forrest looks at the crowd. Abbie Hoffmann steps up to Forrest.", "zh": "成千上万名欢呼的抗议者围在华盛顿纪念碑四周。福雷斯看着人群。阿比·霍夫曼走到他面前。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "Tell us a little bit about the war, man.", "zh": "跟我们说说战争吧，伙计。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "The war in Vietnam?", "zh": "越南的战争吗？"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "The war in Viet-fucking-nam!", "zh": "越他妈的南战争！"}, {"t": "a", "text": "Abbie raises his fist as the crowd cheers wildly.", "zh": "阿比举起拳头，人群疯狂欢呼。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well...", "zh": "这个嘛……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "There was only one thing I could say about the war in Vietnam.", "zh": "关于越南战争，我只有一句话可说。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...there was only one thing I could say about the war in Vietnam.", "zh": "……关于越南战争，我只有一句话可说。"}, {"t": "a", "text": "Forrest looks at the crowd as he speaks. A policeman looks around as he sneaks over to the audio circuit board.", "zh": "福雷斯对着人群讲话。一个警察四下张望，悄悄溜到音响控制台前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "In Vietnam war...", "zh": "在越南战争中……"}, {"t": "a", "text": "The policeman pulls the patch cords out of the audio board.", "zh": "警察拔掉了控制台上的接线。"}, {"t": "a", "text": "Forrest's amplified voice becomes inaudible. Forrest continues to speak into the microphone, even though no one can hear what he is saying. Hilary looks over and notices the policeman. Hilary rushes over toward the audio board, pushes the policeman away and grabs his night stick. Another protester grabs the policeman and pulls him away.", "zh": "福雷斯放大的声音变得听不见了。他继续对着麦克风说话，尽管没人听得见。希拉里发现了警察，冲到控制台前推开他，夺下他的警棍。另一个抗议者抓住警察把他拖走。"}, {"t": "d", "speaker": "POLICEMAN", "note": "", "text": "Hey, what the hell are you doing?", "zh": "嘿，你他妈干什么？"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "I'll beat your head in, you goddamned oinker!", "zh": "我打爆你的头，你这该死的猪猡！"}, {"t": "a", "text": "Isabel, Hilary and another protester try to plug the tangled mess of wires back into the audio board.", "zh": "伊莎贝尔、希拉里和另一个抗议者想把一团乱麻似的电线重新插回控制台。"}, {"t": "d", "speaker": "ISABEL", "note": "", "text": "Christ, what'd they do with this?", "zh": "老天，他们把这玩意儿弄成什么样了？"}, {"t": "a", "text": "Forrest continues to speak into the microphone. The crowd grows restless.", "zh": "福雷斯继续对着麦克风讲话，人群开始不耐烦。"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "We can't hear you! We can't hear anything!", "zh": "我们听不见！我们什么都听不见！"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "This one! This one! Give me that!", "zh": "这根！这根！把那根给我！"}, {"t": "a", "text": "Hilary plugs in the right patch cord.", "zh": "希拉里插对了接线。"}, {"t": "d", "speaker": "HILARY", "note": "", "text": "That's it.", "zh": "好了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...and that's all I have to say about that.", "zh": "……关于这件事，我要说的就这么多。"}, {"t": "a", "text": "Forrest looks at the massive crowd. They are silent. Abbie Hoffman steps over to Forrest and pats him on the shoulder.", "zh": "福雷斯看着庞大的人群，一片寂静。阿比·霍夫曼走过来拍了拍他的肩。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "That's so right on, man. You said it all. What's your name, man?", "zh": "说得太到位了，伙计。你把话说尽了。你叫什么名字，伙计？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My name is Forrest Gump. Forrest Gump.", "zh": "我叫福雷斯·甘。福雷斯·甘。"}, {"t": "d", "speaker": "ABBIE HOFFMAN", "note": "", "text": "Forrest Gump!", "zh": "福雷斯·甘！"}, {"t": "a", "text": "Abbie raises his fist into the air. Abbie steps away from Forrest. The crowd cheers.", "zh": "阿比高举拳头，从福雷斯身边走开。人群欢呼。"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "Forrest Gump!", "zh": "福雷斯·甘！"}, {"t": "d", "speaker": "JENNY", "note": "screaming", "text": "Forrest! Forrest!", "zh": "福雷斯！福雷斯！"}, {"t": "a", "text": "Jenny wades out into the reflection pool and waves her hand into the air. Forrest recognizes her.", "zh": "珍妮涉水走进倒影池，朝空中挥手。福雷斯认出了她。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Jenny!", "zh": "珍妮！"}, {"t": "a", "text": "Forrest rushes off the stage as Jenny makes her way out into the pool.", "zh": "福雷斯冲下台，珍妮也走进水池。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest!", "zh": "福雷斯！"}, {"t": "a", "text": "Forrest jumps down into the crowd and runs. Jenny smiles as she tries to run through the water. The crowd parts as Forrest runs into the pool. Jenny rushes toward him.", "zh": "福雷斯跳下台穿过人群奔跑。珍妮笑着想蹚水跑过来。人群让开一条路，福雷斯跑进池中，珍妮朝他奔来。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey! Hey!", "zh": "嘿！嘿！"}, {"t": "a", "text": "The massive crowd cheers for the embracing couple in the pool.", "zh": "庞大的人群为水池中拥抱的两人欢呼。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It was the happiest moment of my life.", "zh": "那是我一生中最幸福的时刻。"}]}, {"index": 83, "title": "EXT. WASHINGTON MONUMENT/PROTESTER'S ENCAMPMENT - NIGHT", "blocks": [{"t": "a", "text": "Forrest and Jenny walk past the protesters who are camping out on the lawn.", "zh": "福雷斯和珍妮走过在草坪上扎营的抗议者。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Jenny and me were just peas and carrots again. She showed me around, and even introduced me...", "zh": "我和珍妮又好得像豌豆和胡萝卜了。她带我四处看，还把我介绍给……"}]}, {"index": 84, "title": "INT. BLACK PANTHER HEADQUARTERS/STOREFRONT, D.C. - NIGHT", "blocks": [{"t": "a", "text": "Forrest stands at an open window and looks at the White House.", "zh": "福雷斯站在敞开的窗前看着白宫。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...to some of her new friends.", "zh": "……她的一些新朋友。"}, {"t": "a", "text": "A Black Panther, named RUBEN, steps over and pulls the shades down.", "zh": "一个叫鲁本的黑豹党人走过来把百叶窗拉下。"}, {"t": "d", "speaker": "RUBEN", "note": "", "text": "Shut that blind, man. And get your white ass away from that window. Don't you know we in war here?", "zh": "把窗帘关上，伙计。把你的白屁股从窗边挪开。你不知道我们正在交战吗？"}, {"t": "a", "text": "Another Black Panther named MASAI grabs Forrest and pats him down.", "zh": "另一个叫马萨伊的黑豹党人抓住福雷斯搜身。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey man, he's cool. He's cool. He's one of us. He's one of us.", "zh": "嘿，伙计，他没事，自己人。他是我们这边的。自己人。"}, {"t": "d", "speaker": "MASAI", "note": "", "text": "Let me tell you about us.", "zh": "让我给你讲讲我们。"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "Where the hell have you been?", "zh": "你到底死哪儿去了？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I ran into a friend.", "zh": "我遇到一个朋友。"}, {"t": "d", "speaker": "MASAI", "note": "", "text": "Our purpose here is to protect our black leaders from the racial onslaught of the pig who wishes to brutalize our black leaders, rape our women, and destroy our black communists.", "zh": "我们的目的，是保护我们的黑人领袖，免受猪猡的种族迫害——他们想残害我们的黑人领袖、强奸我们的妇女、摧毁我们的黑人社区。"}, {"t": "d", "speaker": "BLACK PANTHER", "note": "", "text": "Masai, phone. Talk to these guys.", "zh": "马萨伊，电话。你去跟他们说。"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "Who's the baby killer?", "zh": "那个杀婴犯是谁？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "This is my good friend I told you about. This is Forrest Gump. Forrest, this is Wesley. Wesley and I live together in Berkeley, and he's the president of the Berkeley chapter of S.D.S.", "zh": "这就是我跟你提过的好朋友。他叫福雷斯·甘。福雷斯，这是韦斯利。我和韦斯利一起住在伯克利，他是学生争取民主社会运动伯克利分会的主席。"}, {"t": "d", "speaker": "MASAI", "note": "", "text": "Let me tell you something else.", "zh": "我再告诉你一件事。"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "I want to talk to you.", "zh": "我有话跟你说。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Okay, but...", "zh": "好的，可是……"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "No. Now! Goddammit!", "zh": "不行。就现在！该死的！"}, {"t": "d", "speaker": "MASAI", "note": "", "text": "We are here to offer protection and help for all of those who need our help, because we, the Black Panthers, are against the war in Vietnam. Yes, we are against any war where black soldiers are sent to the front line to die for a country that hates them. Yes, we are against any war where black soldiers go to fight and come to be brutalized and killed in their own communities as they sleep in their beds at night. Yes, we are against all these racists and imperial dog acts.", "zh": "我们在这里为所有需要帮助的人提供保护和援助，因为我们黑豹党反对越南战争。是的，我们反对任何把黑人士兵派往前线、让他们为一个仇视他们的国家送死的战争。是的，我们反对任何黑人士兵在外打仗，回来却在自己社区的床上夜里惨遭残害和杀害的战争。是的，我们反对所有这些种族主义和帝国主义的走狗行径。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You are a fucking asshole!", "zh": "你就是个该死的混蛋！"}, {"t": "a", "text": "Wesley hits Jenny across the face. Slow motion -- Jenny falls back. Slow motion -- Forrest steps forward with rage.", "zh": "韦斯利一巴掌打在珍妮脸上。慢镜头——珍妮向后倒去。慢镜头——福雷斯怒上心头，跨上一步。"}, {"t": "a", "text": "Slow motion -- Wesley turns and looks at Forrest. Forrest tackles Wesley and slams him onto a table. Jenny turns and looks as Masai pulls out a gun.", "zh": "慢镜头——韦斯利转头看福雷斯。福雷斯把他扑倒，掼在一张桌子上。珍妮转头看时，马萨伊拔出了枪。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest! Quit it! Quit it! Forrest! Stop it!", "zh": "福雷斯！住手！住手！福雷斯！停下！"}, {"t": "a", "text": "Jenny rushes over to Forrest and pulls Forrest off Wesley.", "zh": "珍妮冲过去把福雷斯从韦斯利身上拉开。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Stop it!", "zh": "住手！"}, {"t": "a", "text": "Jenny tries to help Wesley as he moans on the floor. Wesley knocks Jenny's hand away. He gets up, holding his bloody lip.", "zh": "珍妮想去扶在地上呻吟的韦斯利，他一把打开她的手，捂着流血的嘴唇站起来。"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "Oh, God. I shouldn't have brought you here. I should have known it was just gonna be some bullshit hassle.", "zh": "哦，上帝。我真不该带你来。我早该知道只会惹出一堆破事。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "He should not be hitting you, Jenny.", "zh": "他不该打你的，珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Come on, Forrest.", "zh": "走吧，福雷斯。"}, {"t": "a", "text": "Jenny steps out the door as Forrest picks up his hat.", "zh": "珍妮走出门，福雷斯捡起自己的帽子。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Sorry I had a fight in the middle of your Black Panther party.", "zh": "抱歉，在你们黑豹党集会中间打了一架。"}, {"t": "a", "text": "The group of Black Panthers glare at Forrest. Forrest turns and walks out the room.", "zh": "一群黑豹党人瞪着福雷斯。他转身走出房间。"}]}, {"index": 85, "title": "EXT. WASHINGTON D.C. - NIGHT", "blocks": [{"t": "a", "text": "Forrest and Jenny walk past the White House. Protesters hold a candlelight vigil behind them.", "zh": "福雷斯和珍妮走过白宫，身后抗议者在举行烛光守夜。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "He doesn't mean it when he does things like this. He doesn't.", "zh": "他那样做不是存心的。他不是故意的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I would never hurt you, Jenny.", "zh": "我永远不会伤害你，珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I know you wouldn't, Forrest.", "zh": "我知道你不会，福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I wanted to be your boyfriend.", "zh": "我想做你的男朋友。"}, {"t": "a", "text": "They walk in silence. Jenny touches Forrest's uniform.", "zh": "两人沉默地走着。珍妮摸了摸福雷斯的军装。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "That uniform is a trip, Forrest. You look handsome in it. You do.", "zh": "这身军装真带感，福雷斯。你穿着很英俊。真的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You know what?", "zh": "你知道吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "What?", "zh": "什么？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm glad we were here together in our national capitol.", "zh": "我很高兴我们能一起在首都。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Me too, Forrest. I have so much to tell you, you won't believe what's been going on...", "zh": "我也是，福雷斯。我有好多话要跟你说，你不会相信发生了多少事……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "We walked around all night, Jenny and me, just talkin'.", "zh": "我和珍妮走了一整夜，就那么说着话。"}]}, {"index": 86, "title": "EXT. ROUTE 66 - FLASHBACK - DAY", "blocks": [{"t": "a", "text": "Jenny stands in the rain, hitchhiking. A car pulls over to pick her up. Jenny and other other girls get into the car.", "zh": "珍妮站在雨中搭便车。一辆车停下接她，她和另几个女孩上了车。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She told me about all the travellin' she's done.", "zh": "她跟我讲了她去过的所有地方。"}]}, {"index": 87, "title": "EXT. COMMUNE IN NEW MEXICO - NIGHT", "blocks": [{"t": "a", "text": "A hippie gives Jenny a sugar cube of acid as they sit in front of a roaring fire.", "zh": "一个嬉皮士在熊熊篝火前递给珍妮一块迷幻药方糖。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And how she'd discovered ways to expand her mind and learn how to live in harmony...", "zh": "讲她如何找到了拓展心智、学会和谐生活的方法……"}]}, {"index": 88, "title": "EXT. HOLLYWOOD/WALK OF FAME - DAY", "blocks": [{"t": "a", "text": "A star with the name \"Jean Harlow\" on the sidewalk. Jenny and two other girls sing on the sidewalk and collect change from the passersby. Jenny plays the guitar.", "zh": "人行道上有颗写着“珍·哈露”的星。珍妮和两个女孩在路边唱歌弹吉他，向路人收零钱。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...which must be out west somewhere, 'cause she made it all the way to California.", "zh": "……那个地方肯定在西部，因为她一路走到了加利福尼亚。"}, {"t": "d", "speaker": "JENNY", "note": "sings", "text": "\"Smile on your brother, everybody get together, try to love on another right now\"", "zh": "“对你的兄弟微笑吧，大家走到一起，试着此刻就彼此相爱。”"}, {"t": "a", "text": "A young hippie looks over his faded Volkswagen at the girls.", "zh": "一个年轻嬉皮士从他褪色的大众车那边看着女孩们。"}, {"t": "d", "speaker": "YOUNG HIPPIE", "note": "", "text": "Hey, anybody want to go to San Francisco?", "zh": "嘿，有人想去旧金山吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'll go.", "zh": "我去。"}, {"t": "d", "speaker": "YOUNG HIPPIE", "note": "", "text": "Far out!", "zh": "太妙了！"}]}, {"index": 89, "title": "EXT. WASHINGTON D.C. - DAWN", "blocks": [{"t": "a", "text": "Forrest and Jenny walk through the park.", "zh": "福雷斯和珍妮穿过公园。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I was a very special night for the two of us. I didn't want it to end.", "zh": "那是对我们俩都很特别的一夜。我不想让它结束。"}]}, {"index": 90, "title": "EXT. PARKING LOT - EARLY MORNING", "blocks": [{"t": "a", "text": "Jenny carries a backpack as she prepares to board a bus back to Berkeley.", "zh": "珍妮背着背包，准备登上回伯克利的大巴。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I wish you wouldn't go, Jenny.", "zh": "真希望你别走，珍妮。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I have to, Forrest.", "zh": "我必须走，福雷斯。"}, {"t": "d", "speaker": "WESLEY", "note": "", "text": "Jenny? Things got a little out of hand. It's just this war and that, that lyin' son-of-a-bitch Johnson. I would never hurt you. You know that.", "zh": "珍妮？事情有点失控了。都怪这场战争，还有那个撒谎的狗娘养的约翰逊。我永远不会伤害你。你知道的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You know what I think? I think you should go home to Greenbow. Alabama!", "zh": "你知道我怎么想吗？我觉得你应该回绿弓的家去。回亚拉巴马！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, we have very different lives, you know.", "zh": "福雷斯，我们的人生太不一样了，你知道的。"}, {"t": "a", "text": "Forrest looks down at Jenny. He pulls his Medal of Honor from around his neck.", "zh": "福雷斯低头看着珍妮，从脖子上取下荣誉勋章。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I want you to have this.", "zh": "我想把这个给你。"}, {"t": "a", "text": "Forrest places the Medal of Honor in Jenny's hand. Jenny looks up at him.", "zh": "福雷斯把勋章放在珍妮手心。珍妮抬头看他。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, I can't keep this.", "zh": "福雷斯，我不能收。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I got it just by doing what you told me to do.", "zh": "我得到它，只不过是照你说的话做了。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Why're you so good to me?", "zh": "你为什么对我这么好？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You're my girl.", "zh": "你是我的姑娘。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'll always be your girl.", "zh": "我永远是你的姑娘。"}, {"t": "a", "text": "Jenny and Forrest hug each other. Wesley waits for Jenny.", "zh": "珍妮和福雷斯拥抱。韦斯利在等珍妮。"}, {"t": "a", "text": "Jenny turns and walks up to Wesley. They walk toward the entrance of the bus. Forrest smiles as Jenny looks at her.", "zh": "珍妮转身走向韦斯利，两人朝大巴车门走去。珍妮看着福雷斯，福雷斯微笑着。"}, {"t": "a", "text": "Jenny climbs up into the bus. Wesley glares at Forrest.", "zh": "珍妮登上大巴。韦斯利瞪了福雷斯一眼。"}, {"t": "a", "text": "Forrest gives Wesley the \"evil eye.\" Jenny through the near window of the bus, knocks on the window. Forrest turns and looks. Jenny waves to Forrest. Forrest looks up and smiles sadly. Jenny gives Forrest the peace sign as the bus pulls away. The sign on the back of the bus reads \"Berkeley to D.C.\" Forrest gives Jenny the peace sign.", "zh": "福雷斯回了他一个“凶狠的眼神”。珍妮在车窗旁敲玻璃，福雷斯转头看，珍妮朝他挥手。他抬头苦笑。大巴驶离，珍妮比出和平手势，车后写着“伯克利至华盛顿”。福雷斯也朝她比了个和平手势。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And just like that, she was gone out of my life again.", "zh": "就这样，她又一次从我的生命里消失了。"}]}, {"index": 91, "title": "INT. VETERANS ADMINISTRATION HOSPITAL/REC ROOM - DAY", "blocks": [{"t": "a", "text": "A footage of Neil Armstrong's first step on the moon on television.", "zh": "电视播放尼尔·阿姆斯特朗首次踏上月球的影像。"}, {"t": "d", "speaker": "NEIL ARMSTRONG", "note": "", "text": "That's one small step for man, one giant leap for mankind. The, uh, the surface is fine and powdery. I can, I can pick it up loosely.", "zh": "这是个人的一小步，却是人类的一大步。呃，月面很细，像粉末一样。我可以……我可以松松地把它捡起来。"}, {"t": "a", "text": "Forrest demonstrates a ping-pong to some wounded vets.", "zh": "福雷斯给一些受伤的退伍军人演示乒乓球。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I thought I was going back to Vietnam, but instead, they decided the best way for me to fight communists was to play ping-pong. So I was in the Special Services, traveling around the country cheering up all them wounded veterans and showing them how to play...", "zh": "我以为我要回越南，可他们决定，让我跟共产党作战的最好方式是打乒乓球。于是我加入了特种勤务部队，在全国各地巡回表演，慰问受伤的退伍军人，教他们打……"}, {"t": "a", "text": "BUS STOP - PRESENT - DAY", "zh": "公交站——现在——白天。"}, {"t": "a", "text": "Forrest looks at a man.", "zh": "福雷斯看着一个男人。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...ping-pong. I was so good that some years later...", "zh": "……乒乓球。我打得太好了，几年后……"}]}, {"index": 92, "title": "EXT. CHINA/PING-PONG TOURNAMENT - FLASHBACK - DAY", "blocks": [{"t": "a", "text": "Forrest plays ping-pong against a Chinese player. A large mural of Mao Tse-tung hangs on the wall. A crowd of communist leaders sit and watch.", "zh": "福雷斯和一名中国球员对打。墙上挂着大幅毛泽东画像，一群共产党领导人坐着观看。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...the Army decided I should be on the All-American Ping-Pong Team. We were the first Americans to visit the land of China in like a million years or something like that, and somebody said that world peace was in our hands. But all I did was play ping-pong. When I got home...", "zh": "……军队决定让我加入全美乒乓球队。我们是大概一百万年来第一批访问中国的美国人，有人说世界和平就掌握在我们手里。可我做的只是打乒乓球。等我回到国内……"}, {"t": "a", "text": "BUS STOP - PRESENT - DAY", "zh": "公交站——现在——白天。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...I was national celebrity. Famouser even than Captain Kangaroo.", "zh": "……我成了全国名人，比袋鼠船长还出名。"}, {"t": "a", "text": "Color footage of the DICK CAVETT Show. Dick Cavett stands up as he introduces Forrest.", "zh": "《迪克·卡维特秀》的彩色画面。迪克·卡维特起身介绍福雷斯。"}, {"t": "d", "speaker": "DICK CAVETT", "note": "", "text": "Here he is, Forrest Gump, right here.", "zh": "他来了，福雷斯·甘，就在这里。"}, {"t": "a", "text": "Forrest makes his way onto the stage, shakes hands with Dick Cavett.", "zh": "福雷斯走上台，和迪克·卡维特握手。"}, {"t": "d", "speaker": "DICK CAVETT", "note": "", "text": "Mr. Gump, have a seat.", "zh": "甘先生，请坐。"}, {"t": "a", "text": "Forrest sits down between JOHN LENNON and Dick Cavett.", "zh": "福雷斯在约翰·列侬和迪克·卡维特中间坐下。"}, {"t": "d", "speaker": "DICK CAVETT", "note": "", "text": "Forrest Gump, John Lennon.", "zh": "福雷斯·甘，这位是约翰·列侬。"}, {"t": "d", "speaker": "JOHN LENNON", "note": "", "text": "Welcome home.", "zh": "欢迎回家。"}, {"t": "d", "speaker": "DICK CAVETT", "note": "", "text": "You had quite a trip. Can you, uh, tell us, uh, what was China like?", "zh": "你这趟旅行可不一般。你能不能，呃，给我们讲讲，呃，中国是什么样的？"}, {"t": "a", "text": "John Lennon lights a cigarette.", "zh": "约翰·列侬点上一支烟。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well, in the land of China, people hardly got nothing at all.", "zh": "嗯，在中国，人们几乎什么财产都没有。"}, {"t": "d", "speaker": "JOHN LENNON", "note": "", "text": "No possessions?", "zh": "没有财产？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And in China, they never go to church.", "zh": "而且在中国，他们从不去教堂。"}, {"t": "d", "speaker": "JOHN LENNON", "note": "", "text": "No religion, too?", "zh": "也没有宗教？"}, {"t": "d", "speaker": "DICK CAVETT", "note": "", "text": "Oh. Hard to imagine.", "zh": "哦。难以想象。"}, {"t": "d", "speaker": "JOHN LENNON", "note": "", "text": "Well, it's easy if you try, Dick.", "zh": "其实很简单，只要你去试，迪克。"}, {"t": "a", "text": "Forrest looks oddly at John Lennon.", "zh": "福雷斯奇怪地看了约翰·列侬一眼。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Some years later, that nice young man from England was on his way home to see his little boy and was signing some autographs. For no particular reason at all, somebody shot him.", "zh": "几年后，那个来自英国的好心年轻人正要回家看他的小儿子，正在给人签名。毫无来由地，有人开枪打死了他。"}]}, {"index": 93, "title": "EXT. STUDIO - LATER", "blocks": [{"t": "a", "text": "A guard lets Forrest out a side entrance door. Forrest steps, an then stops as he hears s man sitting in a wheelchair speak to him.", "zh": "一个门卫从侧门放福雷斯出来。他刚迈出步子，就听到一个坐轮椅的男人对他说话，停了下来。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "They gave you the Congressional Medal of Honor.", "zh": "他们把国会荣誉勋章发给了你。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Now that's Lieutenant Dan. Lieutenant Dan!", "zh": "那是丹中尉。丹中尉！"}, {"t": "a", "text": "Forrest looks at Lt. Dan. He is a dirty with long hair.", "zh": "福雷斯看着丹中尉，他一身脏污，留着长发。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "They gave you the Congressional Medal of Honor!", "zh": "他们居然把国会荣誉勋章发给了你！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes sir, they sure did.", "zh": "是的，长官，确实发给我了。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "They gave you an imbecile, a moron who goes on television and makes a fool out himself in front of the whole damn country, the Congressional Medal of Honor.", "zh": "他们把国会荣誉勋章发给了一个白痴、一个上电视在全国人面前出丑的蠢货。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir.", "zh": "是的，长官。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Well, then, that's just perfect! Yeah, well I just got one thing to say to that. Goddamn bless America.", "zh": "那可真是太完美了！好，对此我只有一句话要说。上帝他妈的保佑美国。"}, {"t": "a", "text": "Lt. Dan's wheelchair begins to slide down the ramp and spins around on the icy ground. Forrest looks down at Lt. Dan crashes at the bottom of the ramp.", "zh": "丹中尉的轮椅开始沿坡道下滑，在结冰的地面上打转。福雷斯看着他连人带椅摔在坡底。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan!", "zh": "丹中尉！"}]}, {"index": 94, "title": "EXT. NEW YORK CITY STREETS - NIGHT", "blocks": [{"t": "a", "text": "Taxi cabs crowd the street as Forrest pushes Lt. Dan along the sidewalk.", "zh": "街上挤满出租车，福雷斯推着丹中尉沿人行道走。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Lieutenant Dan said he was living in a hotel. And because he didn't have no legs, he spent most of his time exercising his arms.", "zh": "丹中尉说他住在一家旅馆里。因为没有腿，他大部分时间都在锻炼手臂。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Take a right, take a right.", "zh": "右转，右转。"}, {"t": "a", "text": "A taxi driver honks his horn as Forrest wheels Lt. Dan out in front of the taxi.", "zh": "福雷斯把丹中尉推到一辆出租车前，司机按起喇叭。"}, {"t": "d", "speaker": "TAXI DRIVER #1", "note": "", "text": "Hey! Come on already!", "zh": "嘿！倒是快点啊！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Ah!", "zh": "啊！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What are you doing here in New York, Lieutenant Dan?", "zh": "丹中尉，你在纽约干什么？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "I'm living off the government tit. Sucking it dry.", "zh": "我靠政府的奶头活着呢。要把它吸干。"}, {"t": "a", "text": "A taxi skids to a stop, almost hitting them as they cross the street. The taxi honks at Lt. Dan. Lt. Dan slaps the bumper of the taxi.", "zh": "他们过马路时，一辆出租车打滑着急停，差点撞上他们，朝丹中尉按喇叭。丹中尉拍了拍出租车的保险杠。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Hey! Hey! Hey! Are you blind? I'm walking here! Ah, get out...", "zh": "嘿！嘿！嘿！你瞎了吗？我在这儿走路呢！啊，滚开……"}, {"t": "d", "speaker": "TAXI DRIVER #2", "note": "", "text": "Why don't you go home before you kill yourself? Get out of the way!", "zh": "你怎么不在弄死自己之前回家去？让开！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Come on, go! Go! Go!", "zh": "快，走啊！走！走！"}]}, {"index": 95, "title": "EXT. LT. DAN'S HOTEL ROOM - LATER", "blocks": [{"t": "a", "text": "A Bob Hope Christmas special in Vietnam on television. Lt. Dan and Forrest watch the television.", "zh": "电视上播放鲍勃·霍普在越南的圣诞特别节目。丹中尉和福雷斯看着电视。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I stayed with Lieutenant Dan and celebrated the holidays.", "zh": "我陪丹中尉一起过了节。"}, {"t": "d", "speaker": "BOB HOPE", "note": "", "text": "You have a great year and hurry home. God bless you.", "zh": "祝你们新的一年顺利，早点回家。上帝保佑你们。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Have you found Jesus yet, Gump?", "zh": "甘，你找到耶稣了吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I didn't know I was supposed to be looking for him, sir.", "zh": "我不知道我还该去找他，长官。"}, {"t": "a", "text": "Lt. Dan chuckles, drinks the rest of a bottle of wine and tosses it down. He looks at Forrest. He wheels himself over to television and turns it off.", "zh": "丹中尉轻笑一声，喝干一瓶酒，把瓶子丢下。他看着福雷斯，摇着轮椅过去关掉电视。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "That's all these cripples, down at the V.A., that's all they ever talk about.", "zh": "退伍军人医院里那些残废，成天就谈这个。"}, {"t": "a", "text": "Lt. Dan picks up another bottle of port wine, but it is empty. He tosses it onto the floor.", "zh": "丹中尉又拿起一瓶波特酒，却是空的，他把瓶子扔到地上。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Jesus this and Jesus that. Have I found Jesus? They even had a priest come and talk to me. He said God is listening, but I have to help myself. Now, if I accept Jesus into my heart, I'll get to walk beside him in the Kingdom of Heaven.", "zh": "耶稣长耶稣短。我找到耶稣没有？他们还派了个牧师来跟我谈话。他说上帝在听，但我得自救。说什么只要我接受耶稣进入心中，将来就能在天国里走在他身旁。"}, {"t": "a", "text": "Lt. Dan tosses the empty liquor bottle down and picks another bottle. He becomes enraged as he throws the bottle and looks at Forrest.", "zh": "丹中尉扔下空酒瓶，又拿起一瓶。他勃然大怒，把瓶子摔出去，看着福雷斯。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Did you hear what I said? Walk beside him in the Kingdom of Heaven. Well, kiss my crippled ass. God is listening. What a crock of shit.", "zh": "你听见我说的了吗？在天国里走在他身旁。哼，去吻我这残废的屁股吧。上帝在听。全是狗屁。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm going to heaven, Lieutenant Dan.", "zh": "我会上天堂的，丹中尉。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Huh? Ah, well, before you go, why don't you get your ass down to the corner and get us another bottle of wine.", "zh": "嗯？啊，那在你走之前，不如先挪挪你的屁股，到街角再给我们买瓶酒回来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir.", "zh": "是，长官。"}]}, {"index": 96, "title": "INT. TIMES SQUARE BAR - NIGHT", "blocks": [{"t": "a", "text": "A television shows DICK CLARK as he emcees the Times Square New York Eve celebration.", "zh": "电视上，迪克·克拉克主持时代广场新年夜庆典。"}, {"t": "d", "speaker": "DICK CLARK", "note": "", "text": "We are at approximately 45th Street in New York City at One Astor Plaza. This is the site of the old Astor Hotel. Down below us, well over a hundred thousand people are milling about, cheering with horns and whistles and hats...", "zh": "我们现在位于纽约市第45街附近的阿斯特广场一号。这里是老阿斯特酒店的旧址。在我们下方，超过十万人正聚在一起，吹着号角、哨子，戴着帽子欢呼……"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "What the hell's in Bayou La Batre?", "zh": "拉巴特湾那鬼地方有什么？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Shrimpin' boats.", "zh": "捕虾船。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Shrimpin' boats? Who gives a shit about shrimpin' boats?", "zh": "捕虾船？谁他妈在乎捕虾船？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I gotta buy me one of them shrimpin' boats as soon as I have some money. I made me a promise to Bubba in Vietnam, that as soon as the war was over, we'd go in partners. He'd be the captain of the shrimpin' boat and I'd be his first mate. But now that he's dead, that means that I gotta be the captain.", "zh": "等我一有钱，就得给自己买一条捕虾船。我在越南答应过布巴，战争一结束我们就合伙干。他当捕虾船船长，我当大副。可现在他死了，那就意味着我得当船长。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "A shrimp boat captain.", "zh": "捕虾船船长。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir. A promise is a promise, Lieutenant Dan.", "zh": "是的，长官。答应了就是答应了，丹中尉。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Now hear this! Private Gump here is gonna be a shrimp boat captain. Well, I tell you what, Gilligan, the day that you are a shrimp boat captain, I will come and be your first mate.", "zh": "都听好了！列兵甘将来要当捕虾船船长。好，我告诉你，吉利根，等你当上捕虾船船长那天，我就来给你当大副。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "If you're ever a shrimp boat captain, that's the day I'm an astronaut.", "zh": "你要是能当上捕虾船船长，那天我就成宇航员了。"}, {"t": "a", "text": "Two sleazy women, named LENORE and CARLA, walk up to Lt. Dan.", "zh": "两个轻佻的女人——勒诺和卡拉——朝丹中尉走来。"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Danny, what are you complaining about?", "zh": "丹尼，你在抱怨什么呢？"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "What are you doing, huh?", "zh": "你在干什么啊，嗯？"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Mr. Hot Wheels. Who's your friend?", "zh": "风火轮先生。你朋友是谁啊？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My name is Forrest, Forrest Gump.", "zh": "我叫福雷斯，福雷斯·甘。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "This is Cunning Carla, and Long-Limbs Lenore.", "zh": "这是狡猾的卡拉，长腿勒诺。"}, {"t": "a", "text": "Carla puts a \"Happy New Year\" crown on Lt. Dan's head. Lenore fixes her makeup.", "zh": "卡拉把“新年快乐”纸冠戴在丹中尉头上，勒诺补着妆。"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "So where you been, baby-cakes, huh? Haven't seen you around lately. You know, you should have been here for Christmas 'cause Tommy bought a round on the house and gave everybody a turkey sandwich.", "zh": "宝贝儿，你最近死哪儿去了，嗯？好一阵没见你了。你圣诞节真该来，汤米请了一轮客，还给每个人发了火鸡三明治。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Well, well, I had, uh, company.", "zh": "这个，呃，我有伴。"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Hey, hey! We was, we was just there. That's at Times Square.", "zh": "嘿，嘿！我们刚……我们刚在那儿来着。就是时代广场。"}, {"t": "a", "text": "Lenore leans and speaks into Forrest's ear.", "zh": "勒诺凑到福雷斯耳边说话。"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Don't you just love New Year's? You get to start all over.", "zh": "你不喜欢新年吗？一切都可以重新开始。"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "Hey, Lenore.", "zh": "嘿，勒诺。"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Everybody gets a second chance.", "zh": "每个人都有第二次机会。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It's funny, but in the middle of all that fun, I began to think about Jenny.", "zh": "有意思的是，在那样的欢乐中，我开始想起珍妮。"}, {"t": "d", "speaker": "DICK CLARK", "note": "on television", "text": "...getting wild out there. It's beginning to...", "zh": "……那边气氛越来越热烈。开始……"}]}, {"index": 97, "title": "INT. APARTMENT/L.A. - NIGHT", "blocks": [{"t": "a", "text": "The New Year's Eve celebration over the T.V.", "zh": "电视上的新年夜庆典。"}, {"t": "d", "speaker": "DICK CLARK", "note": "over television", "text": "...pour here in Times Square. It's been off-and-on all night, but these people hang in there.", "zh": "……涌向时代广场。雨整晚下下停停，但这些人一直坚守在那儿。"}, {"t": "a", "text": "Jenny fills her bag with her belongings.", "zh": "珍妮把自己的东西塞进包里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Wondering how she was spending her New Year's night out in California.", "zh": "想着她在加利福尼亚会怎样度过新年夜。"}, {"t": "a", "text": "A man lies passed out on the bed. Jenny looks at her black eye in a mirror, then leaves the apartment. The TV shows the ball in Times Square.", "zh": "一个男人烂醉在床上。珍妮对着镜子看自己乌青的眼圈，然后离开了公寓。电视播着时代广场的落球仪式。"}, {"t": "a", "text": "[CROWD · over television]", "zh": "[人群 · 电视画外音]"}]}, {"index": 98, "title": "INT. TIMES SQUARE BAR - NIGHT", "blocks": [{"t": "a", "text": "The ball is lowered, lighting up a sign that reads \"1972.\"", "zh": "水晶球落下，点亮了“1972”的标语。"}, {"t": "d", "speaker": "CROWD", "note": "over television", "text": "...1! Happy New Year!", "zh": "……一！新年快乐！"}, {"t": "a", "text": "The people in the bar cheer and kiss each other. They blow horns and toss confetti into the air. Forrest looks around as Carla and Lenore lean over and kiss him.", "zh": "酒吧里的人们欢呼、亲吻，吹起号角，把彩纸撒向空中。福雷斯四下张望，卡拉和勒诺凑过来亲他。"}, {"t": "d", "speaker": "PATRONS", "note": "sing", "text": "\"Should auld acquaintance be forgot and never brought to mind...", "zh": "“怎能忘记旧日朋友，心中能不怀想……”"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Happy New Year, Lieutenant Dan!", "zh": "新年快乐，丹中尉！"}, {"t": "d", "speaker": "PATRONS", "note": "sing", "text": "Should auld acquaintance be forgot and days of auld lang syne.\"", "zh": "“旧日朋友岂能相忘，友谊地久天长。”"}]}, {"index": 99, "title": "INT. LT. DAN'S HOTEL ROOM - LATER", "blocks": [{"t": "a", "text": "Carla removes her top and sits on top of Dan in his wheelchair. They kiss and play around. Forrest sits in a chair. Lenore leaps on him and begins to kiss Forrest. She reaches down to Forrest's crotch. Forrest stands up nervously, causing Lenore to fall down on the floor. Lenore stands up, angry.", "zh": "卡拉脱掉上衣，坐到轮椅上丹的身上，两人亲吻嬉闹。福雷斯坐在椅子上，勒诺扑到他身上亲他，手伸到他两腿之间。福雷斯紧张地站起来，勒诺摔到地上，气冲冲地爬起来。"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "What are you, stupid or something? What's your problem? What's his problem? Did you lose your pecker in the war or something?", "zh": "你怎么回事，傻还是怎么的？你有毛病啊？他有什么毛病？你在战场上把鸡巴弄丢了还是怎么的？"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "What, is your friend stupid or something?", "zh": "怎么，你朋友是傻子还是怎么的？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "What did you say?", "zh": "你说什么？"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "I said, is your friend stupid or something?", "zh": "我说，你朋友是傻子还是怎么的？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Hey! Don't call him stupid!", "zh": "嘿！不许叫他傻子！"}, {"t": "a", "text": "Lt. Dan throws Carla back onto the bed.", "zh": "丹中尉把卡拉搡回床上。"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "Don't push me like that!", "zh": "别那样推我！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "Hey, don't you push her!", "zh": "嘿，你别推她！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You shut up! Don't you ever call him stupid!", "zh": "你闭嘴！永远不许你叫他傻子！"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "What's the matter, baby? Why you treating me like shit?", "zh": "怎么了嘛，宝贝？你为什么这样对我？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get the hell out of here!", "zh": "都给我滚出去！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "You stupid gimp. You belong in \"Ripley's Believe It Or Not.\"", "zh": "你这愚蠢的瘸子。你该上《里普利信不信由你》。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get the hell out of here! Go on!", "zh": "滚出去！滚！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "You should be in a side show!", "zh": "你该去马戏团杂耍！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Go on! Get out of here! Get out of here!", "zh": "滚！滚出去！滚出去！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "You big loser!", "zh": "你这个大废物！"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "Come on, Lenore. We don't need this shit!", "zh": "走吧，勒诺。我们才不稀罕这破事！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "You're so pathetic.", "zh": "你真可悲。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get out of here!", "zh": "滚出去！"}, {"t": "a", "text": "Lt. Dan falls out of his wheelchair and lands down on the floor. Carla and Lenore laugh as they leave the apartment.", "zh": "丹中尉从轮椅上摔到地上。卡拉和勒诺大笑着离开公寓。"}, {"t": "d", "speaker": "CARLA", "note": "", "text": "You retard!", "zh": "你这弱智！"}, {"t": "d", "speaker": "LENORE", "note": "", "text": "You loser! You freak!", "zh": "你这废物！你这怪物！"}, {"t": "a", "text": "Forrest tries to help Lt. Dan. Lt. Dan pushes Forrest away.", "zh": "福雷斯想去扶丹中尉，丹中尉把他推开。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "No!", "zh": "别碰我！"}, {"t": "a", "text": "Forrest steps back as Lt. Dan flips back over, then pulls himself back up onto his wheelchair. He breathes heavily.", "zh": "福雷斯退后。丹中尉翻身撑着，把自己拖回轮椅，喘着粗气。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm sorry I ruined your New Year's Eve party, Lieutenant Dan. She tastes like cigarettes.", "zh": "抱歉毁了你的新年夜派对，丹中尉。她尝起来像香烟的味道。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I guess Lieutenant Dan figured there's some things you just can't change. He didn't want to be called crippled, just like I didn't want to be called stupid.", "zh": "我想丹中尉明白了，有些事情你就是无法改变。他不想被叫成瘸子，就像我不想被叫成傻子一样。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Happy New Year.", "zh": "新年快乐。"}]}, {"index": 100, "title": "EXT. WHITE HOUSE - NIGHT", "blocks": [{"t": "a", "text": "An ANCHORMAN reports in front of the White House.", "zh": "一位新闻主播在白宫前报道。"}, {"t": "d", "speaker": "ANCHORMAN", "note": "", "text": "The U.S. Ping-Pong Team met with President Nixon today at an Oval Office ceremony...", "zh": "美国乒乓球队今天在椭圆形办公室的仪式上受到尼克松总统接见……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And wouldn't you know it...", "zh": "你说巧不巧……"}, {"t": "a", "text": "PRESENT - BUS STOP", "zh": "现在——公交站。"}, {"t": "a", "text": "Forrest looks at the fat man on the bus bench.", "zh": "福雷斯看着长椅上的胖男人。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...a few months later they invited me and the ping-pong team to visit the White House. So I went again. And I met the President of the United States again.", "zh": "……几个月后，他们邀请我和乒乓球队访问白宫。于是我又去了，又一次见到了美国总统。"}]}, {"index": 101, "title": "INT. WHITE HOUSE - DAY", "blocks": [{"t": "a", "text": "A plaque, presented to Forrest, reads \"Presented to Forrest Gump, member of the United States table tennis team as player of the year for 1971. President NIXON holds the plaque.", "zh": "一块颁给福雷斯的奖牌，上面写着：“颁给美国乒乓球队1971年度最佳球员福雷斯·甘”。尼克松总统手持奖牌。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Only this time they didn't get us rooms in a real fancy hotel.", "zh": "只不过这次，他们没把我们安排在什么豪华酒店。"}, {"t": "d", "speaker": "PRESIDENT NIXON", "note": "", "text": "So are you enjoying yourself in our national capital, young man?", "zh": "年轻人，在首都过得愉快吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir.", "zh": "是的，长官。"}, {"t": "d", "speaker": "PRESIDENT NIXON", "note": "", "text": "Well, where are you staying?", "zh": "嗯，你住在哪儿？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It's called the Hotel Ebbott.", "zh": "一家叫埃博特的酒店。"}, {"t": "d", "speaker": "PRESIDENT NIXON", "note": "", "text": "Oh, no, no, no, no. I know of a much nicer hotel. It's brand-new. Very modern. I'll have my people take care of it for you.", "zh": "哦，不不不不。我知道一家好得多的酒店，全新的，非常现代化。我让我的人替你安排。"}]}, {"index": 102, "title": "INT. WATERGATE HOTEL ROOM - NIGHT", "blocks": [{"t": "a", "text": "Forrest speaks on the phone.", "zh": "福雷斯在打电话。"}, {"t": "d", "speaker": "SECURITY GUARD", "note": "", "text": "Security, Frank Wills.", "zh": "保安部，弗兰克·威尔斯。"}, {"t": "a", "text": "Forrest steps over to a window. Flashlights are moving around in an office across from Forrest's room.", "zh": "福雷斯走到窗边，对面办公室里有手电筒的光在晃动。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yeah, sir, you might want to send a maintenance man over to that office across the way. The lights are off, and they must be looking for the fuse box or something, 'cause them flashlights they're, they're keeping me awake.", "zh": "是这样，先生，您可能该派个维修工到对面那间办公室看看。灯都灭着，他们肯定在找保险丝盒什么的，那些手电的光晃得我睡不着。"}, {"t": "d", "speaker": "SECURITY GUARD", "note": "", "text": "Okay, sir. I'll check it out.", "zh": "好的，先生。我去看看。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Thank you.", "zh": "谢谢您。"}, {"t": "d", "speaker": "SECURITY GUARD", "note": "", "text": "No problem.", "zh": "不客气。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Good night.", "zh": "晚安。"}, {"t": "d", "speaker": "SECURITY GUARD", "note": "", "text": "Good night.", "zh": "晚安。"}, {"t": "a", "text": "Forrest hangs up the phone. The camera tilts down, revealing the hotel stationary, which reads \"The Watergate Hotel.\"", "zh": "福雷斯挂了电话。镜头下移，露出酒店信笺抬头：“水门酒店”。"}]}, {"index": 103, "title": "INT. GYMNASIUM - DAY", "blocks": [{"t": "a", "text": "President Nixon makes a resignation speech on TV.", "zh": "电视上尼克松总统发表辞职演说。"}, {"t": "d", "speaker": "PRESIDENT NIXON", "note": "over television", "text": "Therefore, I shall resign the Presidency effective at noon tomorrow.", "zh": "因此，我将辞去总统职务，明天中午生效。"}, {"t": "a", "text": "The television cuts to a shot of President Nixon standing outside Air Force One with his hands in the peace sign.", "zh": "画面切到尼克松总统站在空军一号外比出和平手势。"}, {"t": "d", "speaker": "PRESIDENT NIXON", "note": "over television", "text": "Vice President Ford will be sworn in as President at that hour in this office. As I recall the high hopes for America with which we began this second term, I feel a great sadness that I will not be here in this office...", "zh": "届时福特副总统将在这间办公室宣誓就任总统。回想我们开始第二任期时对美国寄予的厚望，不能继续留在这间办公室里，我感到万分难过……"}, {"t": "a", "text": "Forrest is playing ping-pong by himself at the gymnasium. An officer steps up to him.", "zh": "福雷斯在体育馆里独自打乒乓球，一名军官走过来。"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "Sergeant Gump!", "zh": "甘中士！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir!", "zh": "是，长官！"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "As you were. I have your discharge papers. Your service is up, son.", "zh": "稍息。这是你的退伍文件。你的役期结束了，孩子。"}, {"t": "a", "text": "The officer hands Forrest an envelope, then walks away.", "zh": "军官递给福雷斯一个信封，走开了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Does this mean I can't play ping pong no more?", "zh": "这是不是说我不能再打乒乓球了？"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "For the Army it does.", "zh": "在军队里是不能了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And just like that, my service in the United States Army was over. So I went home.", "zh": "就这样，我在美国陆军的服役结束了。于是我回了家。"}, {"t": "a", "text": "Forrest takes his paddle and runs out of the gymnasium.", "zh": "福雷斯拿起球拍跑出体育馆。"}]}, {"index": 104, "title": "EXT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Mrs. Gump walks out of the house and smiles. Forrest walks up to the house, wearing his uniform.", "zh": "甘太太笑着走出屋子。福雷斯穿着军装走到屋前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm home, Momma.", "zh": "我回来了，妈妈。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "I know, I know.", "zh": "我知道，我知道。"}]}, {"index": 105, "title": "INT. GUMP HOUSE", "blocks": [{"t": "a", "text": "Mrs. Gump and Forrest walk into the house.", "zh": "甘太太和福雷斯走进屋子。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Louise, he's here. He's here, everybody.", "zh": "露易丝，他回来了。各位，他回来了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, when I got home, I had no idea that Momma had had all sorts of visitors.", "zh": "回家时我并不知道，妈妈接待了各种各样的访客。"}, {"t": "a", "text": "In the house are stacks of ping-pong paddles and life-sized cardboard cutouts of Forrest playing ping-pong. The name on the ping-pong paddles boxes reads: \"Gump-Mao table tennis.\"", "zh": "屋里堆着一摞摞乒乓球拍，还有福雷斯打球的真人大小纸板立牌。球拍盒上印着：“甘毛乒乓球拍”。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "We've had all sorts of visitors, Forrest. Everybody wants you to use their ping-pong stuff. One man even left a check for twenty-five thousand dollars if you'd be agreeable to saying you like using their paddle.", "zh": "来了各种各样的客人，福雷斯。人人都想让你用他们的乒乓球器材。有个人甚至留下了一张两万五千美元的支票，只要你愿意说你喜欢用他们的球拍。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Oh, Momma. I only like using my own paddle. Hi, Miss Louise.", "zh": "哦，妈妈。我只喜欢用我自己的球拍。你好，露易丝小姐。"}, {"t": "d", "speaker": "LOUISE", "note": "", "text": "Hey, Forrest.", "zh": "嘿，福雷斯。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "I know that. I know that. But it's twenty-five thousand dollars, Forrest. I thought maybe you could hold it for a while, see if it grows on you. Oh, you look good, Forrest. You look real good.", "zh": "我知道，我知道。可那是两万五千美元啊，福雷斯。我想你也许可以先拿一阵子，看会不会慢慢喜欢上。哦，你气色真好，福雷斯。看着真精神。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "That Momma, she sure was right. It's funny how things work out.", "zh": "妈妈说得可真对。事情的结局总是很有意思。"}]}, {"index": 106, "title": "EXT. BAYOU LA BATRE/BUBBA'S MOM'S HOUSE - DAY", "blocks": [{"t": "a", "text": "Forrest walks up to a shack on the edge of the Bayou. A group of black kids play in the front yard.", "zh": "福雷斯走到河口边的一间棚屋前，几个黑人孩子在前院玩耍。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I didn't stay home for long, because I'd made a promise to Bubba. And I always try to keep my promise. So I went on down to Bayou La Batre to meet Bubba's family and make their introduction.", "zh": "我没在家里待多久，因为我答应过布巴。我总是努力遵守诺言。于是我去了拉巴特湾，拜访布巴一家，做个自我介绍。"}, {"t": "a", "text": "Bubba's mother named MRS. BLUE and her other children look at Forrest.", "zh": "布巴的母亲布鲁太太和她的其他孩子看着福雷斯。"}, {"t": "d", "speaker": "MRS. BLUE", "note": "", "text": "Are you crazy, or just plain stupid?", "zh": "你是疯了，还是纯粹的傻？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Stupid is as stupid does, Mrs. Blue.", "zh": "傻人做傻事，布鲁太太。"}, {"t": "d", "speaker": "MRS. BLUE", "note": "", "text": "I guess.", "zh": "也许吧。"}]}, {"index": 107, "title": "EXT. BUBBA'S GRAVE - DAY", "blocks": [{"t": "a", "text": "Forrest steps over to Bubba's tombstone.", "zh": "福雷斯走到布巴的墓碑前。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And of course, I paid my respect to Bubba himself.", "zh": "当然，我也去向布巴本人致了意。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey, Bubba, it's me, Forrest Gump. I remember everything you said, and I got it all figured out.", "zh": "嘿，布巴，是我，福雷斯·甘。你说的每句话我都记得，我都盘算好了。"}, {"t": "a", "text": "Forrest pulls out notes from his pocket.", "zh": "福雷斯从口袋里掏出几张纸条。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm taking the twenty-four thousand, five hundred and six-two dollars and forty-seven cents that I got...", "zh": "我打算把我拿到的两万四千五百六十二美元四十七美分……"}]}, {"index": 108, "title": "EXT. BAYOU - DAY", "blocks": [{"t": "a", "text": "Forrest walks across a yard where men are cleaning shrimp.", "zh": "福雷斯走过一个院子，人们正在清理虾。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...well, that's left after a new hair cut and a new suit and I took Momma out to real fancy dinner and I bought a bus ticket and three Doctor Peppers.", "zh": "……就是理了发、买了新西装、带妈妈吃了一顿真正的大餐、买了车票和三瓶胡椒博士之后剩下的钱……"}, {"t": "a", "text": "Forrest walks along a wooden pier. Forrest pays an old black shrimper a large wad of cash.", "zh": "福雷斯走在木码头上，把一大笔现金付给一个年老的黑人捕虾人。"}, {"t": "d", "speaker": "OLD SHRIMPER", "note": "", "text": "Tell me something. Are you stupid or something?", "zh": "告诉我，你是傻还是怎么的？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Stupid is as stupid does, sir.", "zh": "傻人做傻事，先生。"}]}, {"index": 109, "title": "EXT. BUBBA'S GRAVE", "blocks": [{"t": "a", "text": "Forrest stands at the grave.", "zh": "福雷斯站在墓前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well, that's what's left after me saying, \"When I was in China on the All-America Ping-Pong Team, I just loved playing ping-pong with my Flex- O-Ping-Pong Paddle.\" Which everybody knows it isn't true, but Momma says it's just a little white lie so it wouldn't hurt nobody. So, anyway, I'm putting all that on gas, ropes and new nets and a brand-new shrimpin' boat.", "zh": "嗯，剩下的就是这些。我还说了一句：“我随全美乒乓球队在中国的时候，最爱用弗莱克斯牌乒乓球拍打乒乓球。”谁都知道这不是真的，可妈妈说这只是个无伤大雅的善意谎言。总之，我要把所有的钱都花在汽油、绳索、新渔网和一条崭新的捕虾船上。"}]}, {"index": 110, "title": "EXT. BAYOU - DAY", "blocks": [{"t": "a", "text": "Forrest steers his shrimping boat. The boat is old and rusty.", "zh": "福雷斯驾驶着捕虾船。船又旧又锈。"}, {"t": "a", "text": "Forrest unleashes his nets as his catch of the day drops to the deck. It is a bunch of garbage and shells. Forrest picks up one shrimp.", "zh": "福雷斯撒下网，一天的收获倒在甲板上——一堆垃圾和贝壳。他捡起一只虾。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, Bubba had told me everything he knows about shrimpin', but you know what I found out? Shrimpin' is tough.", "zh": "布巴把他知道的捕虾知识都教给了我，可你知道我发现了什么吗？捕虾真不容易。"}]}, {"index": 111, "title": "EXT. DOCKS", "blocks": [{"t": "a", "text": "Forrest pulls a couple of shrimp out of a bucket.", "zh": "福雷斯从桶里拎出几只虾。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I only caught five.", "zh": "我只捕到五只。"}, {"t": "d", "speaker": "OLD SHRIMPER", "note": "", "text": "A couple of more, you can have yourself a cocktail.", "zh": "再多两只，你就能给自己调杯鸡尾酒了。"}, {"t": "a", "text": "The old shrimper begins to walk away, then stops and looks at Forrest.", "zh": "老捕虾人刚要走开，又停下看着福雷斯。"}, {"t": "d", "speaker": "OLD SHRIMPER", "note": "", "text": "Hey, you ever think about namin' this old boat?", "zh": "嘿，你想过给这条旧船起个名字吗？"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I'd never named a boat before, but there was only one I could think of.", "zh": "我从没给船起过名字，但我只想得到一个名字。"}, {"t": "a", "text": "Forrest paints a name on the side of his boat. The name is \"Jenny.\"", "zh": "福雷斯在船舷上漆上名字：“珍妮”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "The most beautiful name in the wide world.", "zh": "世界上最美的名字。"}]}, {"index": 112, "title": "INT. DISCO", "blocks": [{"t": "a", "text": "Disco lights flash and people dance. A guy asks a girl to dance.", "zh": "迪斯科灯光闪烁，人们跳着舞。一个男人邀请女孩跳舞。"}, {"t": "d", "speaker": "GIRL", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "a", "text": "Jenny sits at a table with some other people. She is snorting cocaine.", "zh": "珍妮和几个人坐在桌旁，正在吸可卡因。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, I hadn't heard from Jenny in a long while. But...", "zh": "我已经很久没有珍妮的消息了。但是……"}]}, {"index": 113, "title": "EXT. BAYOU LA BATRE - DAY", "blocks": [{"t": "a", "text": "Forrest stands at the helm as the boat glides across the water.", "zh": "福雷斯站在舵轮前，船在水面滑行。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But I thought about her a lot. And I hoped that whatever she was doing made her happy.", "zh": "……但我常常想她。我希望她做的事情能让她快乐。"}]}, {"index": 114, "title": "INT. APARTMENT - NIGHT", "blocks": [{"t": "a", "text": "Drug paraphernalia and a large wad of cash are spread out on a table. A man drops a syringe on the table. He reaches over and touches Jenny. She is pale with dark lines under her eyes.", "zh": "桌上摆着吸毒器具和一大笔现金。一个男人把注射器丢在桌上，伸手去摸珍妮。她面色苍白，眼圈发黑。"}]}, {"index": 115, "title": "INT. BATHROOM", "blocks": [{"t": "a", "text": "Jenny smears some lines of cocaine on a mirror. She looks at herself in the mirror.", "zh": "珍妮在镜子上抹出几行可卡因。她看着镜中的自己。"}]}, {"index": 116, "title": "EXT. BALCONY", "blocks": [{"t": "a", "text": "Jenny steps out onto the high-rise balcony. She steps up on a table and stands on the edge of the balcony. A busy street lies many stories below. Jenny looks down to the intersection below.", "zh": "珍妮走到高层阳台上，踏上一张桌子，站到阳台边缘。脚下很多层是繁忙的街道。她低头看着下面的十字路口。"}, {"t": "a", "text": "She slips over the edge, regains her balance, turns and looks back at the intersection below, and begins to get down from the edge.", "zh": "她脚下一滑险些越过边沿，重新站稳，回头看了一眼下面的路口，开始从边沿往下退。"}, {"t": "a", "text": "Jenny grabs a hold of the ledge and carefully climbs down.", "zh": "珍妮抓住窗台沿，小心地爬下来。"}, {"t": "a", "text": "She sits down on a chair. Jenny rocks back and forth as she cries. She looks up at the sky.", "zh": "她坐在椅子上，前后摇晃着哭起来，抬头望向天空。"}]}, {"index": 117, "title": "EXT. BAYOU LA BATRE/FORREST'S BOAT - NIGHT", "blocks": [{"t": "a", "text": "The moon shines above in the sky. Forrest lies in a hammock on his boat.", "zh": "月亮挂在天上。福雷斯躺在船上的吊床里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I thought about Jenny all the time.", "zh": "我无时无刻不在想珍妮。"}]}, {"index": 118, "title": "EXT. FORREST'S BOAT/BAYOU DOCK - DAY", "blocks": [{"t": "a", "text": "Forrest stands at the helm of his boat and slowly glides by the docks. Forrest looks around and notices something and bends down to get a clear view. Lt. Dan sits in his wheelchair on the deck. Forrest looks at Lt. Dan. He smiles, surprised.", "zh": "福雷斯站在舵轮前，船缓缓滑过码头。他四处张望，注意到什么，俯身看清——丹中尉坐在甲板的轮椅上。福雷斯又惊又喜。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hi!", "zh": "嗨！"}, {"t": "a", "text": "Forrest leaps off of his moving boat and into the water. The boat continues as Forrest clumsily swims. Lt. Dan sits in his wheelchair at the edge of the dock. Forrest flails his arms as he swims up to the dock. Lt. Dan waits for Forrest, smoking a cigar. Forrest climbs up a ladder onto the dock.", "zh": "福雷斯从行驶中的船跳进水里，船继续前行，他笨拙地游着。丹中尉坐在码头边的轮椅里。福雷斯挥着手臂游到码头边，丹中尉抽着雪茄等他。福雷斯顺着梯子爬上码头。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan, what are you doing here?", "zh": "丹中尉，你怎么在这儿？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Well, I thought I'd try out my sea legs.", "zh": "嗯，我想试试我的“海腿”（不晕船的本事）。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well, you ain't got no legs, Lieutenant Dan.", "zh": "可你没有腿啊，丹中尉。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Well, well, Captain Forrest Gump. I had to see this for myself. And I told you if you were ever a shrimp boat captain, that I'd be your first mate. Well, here I am. I am a man of my word.", "zh": "哎呀，福雷斯·甘船长。我得亲眼来看看。我说过，你要是当上捕虾船船长，我就来当你的大副。瞧，我来了。我是个说话算数的人。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "a", "text": "Forrest shakes Lt. Dan's hand.", "zh": "福雷斯和丹中尉握手。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Yeah, but don't you be thinking that I'm gonna be calling you sir.", "zh": "好，但你别以为我会叫你长官。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "No, sir.", "zh": "好的，长官。"}, {"t": "a", "text": "Forrest's boat glides, crushing a dock. Forrest and Lt. Dan look at it.", "zh": "福雷斯的船滑行着撞坏了一个码头。两人看着。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "That's my boat.", "zh": "那是我的船。"}]}, {"index": 119, "title": "EXT. BAYOU LA BATRE WATERS - DAY", "blocks": [{"t": "a", "text": "Forrest's shrimping boat is alone on the gulf waters.", "zh": "福雷斯的捕虾船独自行驶在海湾上。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "I have a feeling if we head the east, we'll find some shrimp. So, take a left. Take a left.", "zh": "我有种感觉，往东走能找到虾。来，左转。左转。"}, {"t": "a", "text": "Forrest looks up. Lt. Dan is sitting in the rigging.", "zh": "福雷斯抬头，丹中尉坐在索具上。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Which way?", "zh": "哪边？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Over there! They're over there! Get, get on the wheel and take a left!", "zh": "那边！它们在那边！快，去掌舵，左转！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Gump, what are you doing? Take a left! Left! That's where we're gonna find those shrimp, my boy! That's where we'll find 'em.", "zh": "甘，你干什么？左转！左！那边才找得到虾，孩子！虾就在那边。"}, {"t": "a", "text": "Forrest empties the net. Their \"catch\" is debris that falls to the deck.", "zh": "福雷斯倒空渔网，“收获”是一堆倒在甲板上的杂物。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Still no shrimp, Lieutenant Dan.", "zh": "还是没有虾，丹中尉。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Okay, so I was wrong.", "zh": "好吧，是我判断错了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well, how we gonna find them?", "zh": "那我们怎么才能找到它们？"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Well, maybe you should just pray for shrimp.", "zh": "也许你该干脆向虾祈祷。"}]}, {"index": 120, "title": "INT. SMALL CHURCH - DAY", "blocks": [{"t": "a", "text": "The all-black gospel choir sings and claps their hands.", "zh": "全黑人福音唱诗班拍手歌唱。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So I went to church every Sunday...", "zh": "于是我每个星期天都去教堂……"}, {"t": "a", "text": "Lt. Dan is sitting in his chair at the back of the church. He takes swigs from a liquor bottle.", "zh": "丹中尉坐在教堂后排的椅子上，对着酒瓶大口喝酒。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometimes Lieutenant Dan came, too. Though I think he left the praying up to me.", "zh": "有时候丹中尉也来。不过我觉得他把祈祷的事都交给我了。"}]}, {"index": 121, "title": "EXT. BOAT - ANOTHER DAY", "blocks": [{"t": "a", "text": "A catch of junk is dumped onto the deck. Lt. Dan lowers himself from the rigging.", "zh": "一网废品倒在甲板上。丹中尉从索具上下来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "No shrimp.", "zh": "没有虾。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Where the hell's this God of yours?", "zh": "你那位上帝到底在哪儿？"}, {"t": "a", "text": "The wind begins to blow strong.", "zh": "风开始猛刮。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It's funny Lieutenant Dan said that, 'cause right then, God showed up.", "zh": "丹中尉说这话真有意思，因为就在那时，上帝显灵了。"}]}, {"index": 122, "title": "EXT. BOAT - NIGHT", "blocks": [{"t": "a", "text": "Water sprays on deck during a hurricane. Lt. Dan on the rigging, shouts and shakes his fist as he is pelted by wind and rain.", "zh": "飓风里，海水冲上甲板。丹中尉爬上索具，在风雨抽打中挥拳怒吼。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You'll never sink this boat!", "zh": "你永远弄不沉这条船！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now me, I was scared. But Lieutenant Dan, he was mad.", "zh": "我吓得要命，可丹中尉却狂怒不已。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Come on! You call this a storm?", "zh": "来吧！这也配叫风暴？"}, {"t": "a", "text": "Forrest slides back and forth as he attempts to steer the boat.", "zh": "福雷斯在掌舵时被甩得前后滑动。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Blow, you son-of-a-bitch! Blow! It's time for a showdown! You and me. I'm right here. Come and get me! You'll never sink this boat!", "zh": "刮吧，你这狗娘养的！刮啊！是时候一决胜负了！你和我。我就在这儿。来抓我啊！你永远弄不沉这条船！"}]}, {"index": 123, "title": "INT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "An ANCHORMAN over TV, is standing in front of a pier.", "zh": "一位新闻主播站在一个码头前报道。"}, {"t": "d", "speaker": "ANCHORMAN", "note": "over television", "text": "Hurricane Carmen came through here yesterday...", "zh": "飓风“卡门”昨天席卷了这里……"}]}, {"index": 124, "title": "EXT. BAYOU DOCKS - DAY", "blocks": [{"t": "a", "text": "The anchorman is standing in front of the ruined pier and boats.", "zh": "主播站在被摧毁的码头和船只前。"}, {"t": "d", "speaker": "ANCHORMAN", "note": "", "text": "...destroying nearly everything in its path. And as in other towns up and down the coast, Bayou La Batre's entire shrimping industry...", "zh": "……所经之处几乎摧毁一切。和沿海其他城镇一样，拉巴特湾整个捕虾业……"}]}, {"index": 125, "title": "INT. GUMP HOUSE", "blocks": [{"t": "d", "speaker": "ANCHORMAN", "note": "", "text": "...has fallen victim to Carmen and has been left in utter ruin. Speaking with local officials, this reporter has learned, in fact, only one shrimping boat actually survived the storm.", "zh": "……都成了“卡门”的牺牲品，彻底毁于一旦。本记者从当地官员处获悉，事实上只有一条捕虾船在风暴中幸存。"}, {"t": "a", "text": "Forrest's boat comes down the river.", "zh": "福雷斯的船沿河驶来。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Louise. Louise, there's Forrest!", "zh": "露易丝。露易丝，福雷斯回来了！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "After that, shrimpin' was easy.", "zh": "从那以后，捕虾就容易了。"}, {"t": "a", "text": "FORREST'S BOAT - DAY", "zh": "福雷斯的船——白天。"}, {"t": "a", "text": "Lt. Dan and Forrest empty their net. A huge catch of shrimp falls onto the deck. Lt. Dan opens another big catch.", "zh": "丹中尉和福雷斯倒空渔网，一大堆虾落在甲板上。丹中尉又打开满满一网。"}, {"t": "a", "text": "Another catch drops open on top of yet another huge catch.", "zh": "一网又一网的大虾堆在甲板上。"}, {"t": "a", "text": "Forrest and Lt. Dan smile.", "zh": "福雷斯和丹中尉笑了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And since people still needed them shrimps for shrimp cocktails and barbecues and all...", "zh": "既然人们做虾仁鸡尾酒、烧烤什么的还是需要虾……"}]}, {"index": 126, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "a", "text": "The man sitting on the bench listens to Forrest. An ELDERLY WOMAN sits next to the man.", "zh": "坐在长椅上的男人听福雷斯说话，一位老妇人在男人身旁坐下。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...and we were the only boat left standing \"Bubba-Gump\" shrimp's what they got. We got a whole bunch of boats. Twelve Jenny's, a big ol' warehouse, we even have hats that says \"Bubba-Gump\" on 'em. \"Bubba- Gump Shrimp.\" It's a household name.", "zh": "……而我们又是唯一幸存的船，他们能买到的就只有“布巴-甘”虾了。我们有了一整支船队，十二条“珍妮号”，一个老大的仓库，我们还有印着“布巴-甘”字样的帽子。“布巴-甘捕虾公司”，成了家喻户晓的名字。"}, {"t": "d", "speaker": "MAN", "note": "", "text": "Hold on there, boy. Are you telling me you're the owner of the Bubba- Gump Shrimp Corporation?", "zh": "等等，孩子。你是说你就是布巴-甘捕虾公司的老板？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir. We've got more money than Davy Crocket.", "zh": "是的，先生。我们的钱比戴维·克罗克特还多。"}, {"t": "d", "speaker": "MAN", "note": "", "text": "Boy, I've heard some whoppers in my time, but that tops them all. We was sitting next to a millionaire!", "zh": "孩子，我这辈子听过不少大话，你这句最离谱。我们刚才竟然坐在一位百万富翁旁边！"}, {"t": "a", "text": "The man laughs as he walks away.", "zh": "男人笑着走开了。"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "Well, I thought it was a very lovely story. And you tell it so well. With such enthusiasm.", "zh": "嗯，我觉得这个故事非常动人。你讲得这么好，这么有热情。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Would you like to see what Lieutenant Dan looks like?", "zh": "您想看看丹中尉长什么样吗？"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "Well, yes, I would!", "zh": "哦，当然想！"}, {"t": "a", "text": "Forrest shows her the cover of a \"Fortune\" magazine with Forrest and Lt. Dan on the cover.", "zh": "福雷斯给她看一本《财富》杂志的封面，上面是他和丹中尉。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "That's him right there.", "zh": "就是他。"}, {"t": "a", "text": "The elderly woman looks at the magazine and at Forrest with surprise.", "zh": "老妇人惊讶地看看杂志，又看看福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And let me tell you something about Lieutenant Dan.", "zh": "让我再跟您说说丹中尉的事。"}]}, {"index": 127, "title": "EXT. BOAT/DECK - DAY", "blocks": [{"t": "a", "text": "Forrest and Lt. Dan are working on the boat.", "zh": "福雷斯和丹中尉在船上干活。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Forrest, I never thanked you for saving my life.", "zh": "福雷斯，我从没谢过你救了我的命。"}, {"t": "a", "text": "Forrest looks a little surprised. Lt. Dan smiles, then looks away. Lt. Dan pulls himself out of his chair to the railing and jumps into the water.", "zh": "福雷斯有点意外。丹中尉笑了笑，移开视线，撑着椅子挪到栏杆边，跳进水里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "He never actually said so, but I think he made his peace with God.", "zh": "他从没亲口说过，但我想他已经和上帝和解了。"}]}, {"index": 128, "title": "EXT. BOAT", "blocks": [{"t": "a", "text": "Forrest and Lt. Dan have dinner on the deck. The television shows an assassination attempt on President Gerald Ford.", "zh": "福雷斯和丹中尉在甲板上吃晚饭。电视里正在播放针对杰拉尔德·福特总统的暗杀企图。"}, {"t": "d", "speaker": "ANCHORMAN", "note": "over television", "text": "For the second time in seventeen days, President Ford escaped possible assassination today when a woman, Sarah Jane Moore, fired on him as he stepped out of a hotel in San Francisco.", "zh": "十七天内第二次，福特总统今天躲过了一场可能的暗杀：一个名叫萨拉·简·穆尔的女人在他走出旧金山一家酒店时朝他开枪。"}, {"t": "d", "speaker": "MARGO", "note": "over radio", "text": "Base to Jenny One. Base to Jenny One.", "zh": "基地呼叫珍妮一号。基地呼叫珍妮一号。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Jenny One, go Margo.", "zh": "珍妮一号，玛戈请讲。"}, {"t": "d", "speaker": "MARGO", "note": "over radio", "text": "Forrest has a phone call.", "zh": "有福雷斯的电话。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Yeah, well you'll have to tell them to call him back. He is indisposed at the moment.", "zh": "嗯，你让他们待会儿再打来吧。他现在不太方便接。"}, {"t": "d", "speaker": "MARGO", "note": "over radio", "text": "His momma's sick.", "zh": "他妈妈病了。"}, {"t": "d", "speaker": "ANCHORMAN", "note": "over television", "text": "Lynett Alice Fromme, a follower of Charles Manson better known as \"Squeaky,\" attempted to assassinate the President as he was...", "zh": "琳内特·艾丽斯·弗罗姆，查尔斯·曼森的追随者，外号“吱吱”，企图在总统……"}, {"t": "a", "text": "Forrest dives into the water as he reacts.", "zh": "福雷斯一听，纵身跳进水里。"}]}, {"index": 129, "title": "EXT. ROAD/GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Forrest carries a suitcase as he runs down the road. Forrest runs past the row of mailboxes and turns into the drive.", "zh": "福雷斯提着箱子沿路奔跑，跑过那排邮箱，拐进车道。"}, {"t": "a", "text": "Louise and others are on the front porch.", "zh": "露易丝和其他人坐在前门廊上。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Where's Momma?", "zh": "妈妈呢？"}, {"t": "d", "speaker": "LOUISE", "note": "", "text": "She's upstairs.", "zh": "在楼上。"}]}, {"index": 130, "title": "INT. GUMP HOUSE - WOMAN'S BED ROOM", "blocks": [{"t": "a", "text": "Forrest opens the door, the doctor stands next to Mrs. Gump in bed.", "zh": "福雷斯推开门，医生站在卧床的甘太太身旁。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Hi, Forrest.", "zh": "嗨，福雷斯。"}, {"t": "d", "speaker": "DOCTOR", "note": "", "text": "I'll see you tomorrow.", "zh": "明天见。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Oh, all right.", "zh": "哦，好的。"}, {"t": "a", "text": "The doctor looks down at Forrest's legs.", "zh": "医生低头看福雷斯的腿。"}, {"t": "d", "speaker": "DOCTOR", "note": "", "text": "We sure got you straightened out, didn't we, boy?", "zh": "我们可真把你给矫正过来了，是吧，孩子？"}, {"t": "a", "text": "The doctor leaves and closes the door. Forrest takes off his hat and steps over to her.", "zh": "医生带上门离开。福雷斯摘下帽子走到她面前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What's the matter, Momma?", "zh": "怎么了，妈妈？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "I'm dyin', Forrest. Come on in, sit down over here.", "zh": "我要死了，福雷斯。来，过来，坐这儿。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Why are you dyin', Momma?", "zh": "你为什么要死呢，妈妈？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "It's my time. It's just my time. Oh, now, don't you be afraid, sweetheart. Death is just a part of life. It's something we're all destined to do. I didn't know it, but I was destined to be your momma. I did the best I could.", "zh": "我的时候到了。只是我的时候到了。哦，别害怕，亲爱的。死亡只是生命的一部分，是我们注定要走的一程。我以前不知道，但我注定要做你的妈妈。我尽力做到了最好。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You did good, Momma.", "zh": "你做得很好，妈妈。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Well, I happened to believe you make your own destiny. You have to do the best with what God gave you.", "zh": "嗯，我相信命运是自己创造的。你要用上帝给你的一切，尽力做到最好。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What's my destiny, Momma?", "zh": "我的命运是什么，妈妈？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "You're gonna have to figure that out for yourself. Life is a box of chocolates, Forrest. You never know what you're gonna get.", "zh": "那要你自己去弄明白。人生就像一盒巧克力，福雷斯，你永远不知道下一块是什么味道。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma always had a way of explaining things so I could understand them.", "zh": "妈妈总有办法把事情解释得让我听得懂。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "I will miss you, Forrest.", "zh": "我会想你的，福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She had got the cancer and died on a Tuesday. I bought her a new hat with little flowers on it.", "zh": "她得了癌症，在一个星期二去世了。我给她买了一顶带小花的新帽子。"}]}, {"index": 131, "title": "EXT. BUS STOP - PRESENT", "blocks": [{"t": "a", "text": "The elderly woman and Forrest sit. The woman is crying and wipes her eyes with a hankie.", "zh": "老妇人和福雷斯坐着。女人哭了，用手帕擦眼泪。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And that's all I have to say about that.", "zh": "关于这件事，我要说的就这么多。"}, {"t": "a", "text": "A bus stops. Forrest looks at the elderly woman.", "zh": "一辆公交车靠站。福雷斯看着老妇人。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Didn't you say you were waiting for the Number Seven bus?", "zh": "您不是说在等七路车吗？"}, {"t": "d", "speaker": "ELDERLY WOMAN", "note": "", "text": "There'll be another one along shortly.", "zh": "下一班很快就来了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Now, because I had been a football star, and a war hero, and a national celebrity, and a shrimpin' boat captain, and a college graduate, the city of fathers of Greenbow, Alabama, decided to get together and offered me a fine job.", "zh": "因为我当过橄榄球明星、战争英雄、全国名人、捕虾船船长，还是大学毕业生，亚拉巴马州绿弓镇的父老们决定凑在一起，给我提供了一份好工作。"}]}, {"index": 132, "title": "EXT. FOOTBALL FIELD - DAY", "blocks": [{"t": "a", "text": "Forrest rides a lawn tractor as he moves the football field lawn.", "zh": "福雷斯开着草坪拖拉机修剪橄榄球场的草。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So, I never went back to work for Lieutenant Dan.", "zh": "所以我再也没回丹中尉那里工作。"}]}, {"index": 133, "title": "EXT. GUMP HOUSE MAILBOXES", "blocks": [{"t": "a", "text": "Forrest takes out a letter and opens it.", "zh": "福雷斯拿出一封信拆开。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Though he did take care of my Bubba- Gump money. He got me invested in some kind of fruit company. And so then I got a call from him saying we don't have to worry about money no more.", "zh": "不过他确实帮我打理着“布巴-甘”的钱。他让我投资了一家什么水果公司。后来他打电话给我，说我们再也不用为钱发愁了。"}]}, {"index": 134, "title": "EXT. BUS STOP", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "And I said, \"That's good. One less thing.\"", "zh": "我说：“那太好了，少操一份心。”"}]}, {"index": 135, "title": "INT. CHURCH - DAY The choir and members are singing.", "blocks": [{"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, Momma said there's only so much fortune a man really needs...", "zh": "妈妈说过，一个人真正需要的钱就那么多……"}]}, {"index": 136, "title": "EXT. CHURCH", "blocks": [{"t": "a", "text": "The sign reads: \"Four Square Baptist Church.\" A new cross is placed on the steeple. New furniture is taken inside.", "zh": "牌子上写着：“四方浸信会教堂”。尖塔上装了新十字架，新家具正被搬进去。"}, {"t": "d", "speaker": "REVEREND", "note": "", "text": "Praise the Lord.", "zh": "赞美主。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...and the rest is just for showing off. So, I gave a whole bunch of it to the Four Square Gospel Church.", "zh": "……剩下的不过是用来炫耀的。所以我捐了一大笔给四方福音教会。"}]}, {"index": 137, "title": "EXT. HOSPITAL - DAY", "blocks": [{"t": "a", "text": "The sign reads: \"Gump Medical Center Bayou La Batre, Alabama.\"", "zh": "牌子上写着：“亚拉巴马州拉巴特湾甘氏医疗中心”。"}, {"t": "a", "text": "The ribbon-cutting ceremony.", "zh": "剪彩仪式。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And I gave a whole bunch to the Bayou La Batre Fishing Hospital.", "zh": "我还捐了一大笔给拉巴特湾渔业医院。"}]}, {"index": 138, "title": "EXT. BUBBA'S MOM'S HOUSE", "blocks": [{"t": "a", "text": "A postman delivers a letter to Bubba's mom. She opens the letter.", "zh": "邮差给布巴的妈妈送来一封信。她拆开信。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And even though Bubba was dead, and Lieutenant Dan said I was nuts. I gave Bubba's mommy Bubba's share.", "zh": "尽管布巴已经死了，丹中尉还说我疯了，我还是把布巴那份给了他妈妈。"}, {"t": "a", "text": "She is surrounded by her many children. She looks at the check and faints.", "zh": "她被自己众多的孩子围着，看到支票，当场晕了过去。"}]}, {"index": 139, "title": "EXT. BUS STOP", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "And you know what...", "zh": "你知道吗……"}]}, {"index": 140, "title": "INT. FLORIDA CONDO", "blocks": [{"t": "a", "text": "A door opens as a white woman serves Bubba's mom some shrimp.", "zh": "门开了，一个白人女佣给布巴的妈妈端上虾。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She didn't have to work in nobody's kitchen no more.", "zh": "她再也不用去谁家的厨房里干活了。"}, {"t": "d", "speaker": "MRS. BLUE", "note": "", "text": "Smells wonderful!", "zh": "闻起来真香！"}]}, {"index": 141, "title": "EXT. FOOTBALL FIELD", "blocks": [{"t": "a", "text": "Forrest rides the mower.", "zh": "福雷斯开着割草机。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And 'cause I was godzillionaire and I liked doing it so much. I cut that grass for free.", "zh": "因为我成了亿万富翁，又那么喜欢割草，那片草我免费割。"}]}, {"index": 142, "title": "EXT. GUMP HOUSE BALCONY - NIGHT", "blocks": [{"t": "a", "text": "Forrest looks down the road as he steps onto the porch.", "zh": "福雷斯走上门廊时朝路尽头望去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But at nighttime, when there was nothing to do and the house was all empty, I'd always think of Jenny.", "zh": "可到了晚上，无事可做、屋子空荡荡的时候，我总会想起珍妮。"}, {"t": "a", "text": "Jenny's image walks, then vanishes. Forrest looks away. He turns and walks into the house.", "zh": "珍妮的身影走过，随即消失。福雷斯移开视线，转身走进屋子。"}]}, {"index": 143, "title": "EXT. GUMP HOUSE - DAY", "blocks": [{"t": "a", "text": "Jenny walks across the lawn to Forrest.", "zh": "珍妮穿过草坪走向福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And then, she was there.", "zh": "然后，她就出现了。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hello, Forrest.", "zh": "你好，福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hello, Jenny.", "zh": "你好，珍妮。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Jenny came back and stayed with me.", "zh": "珍妮回来和我住在一起了。"}]}, {"index": 144, "title": "INT. GUMP HOUSE", "blocks": [{"t": "a", "text": "Jenny lies asleep in bed.", "zh": "珍妮躺在床上熟睡。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Maybe it was because she had nowhere else to go. Or maybe it was because she was so tired, because she went to bed and slept and slept like she hadn't slept in years. It was wonderful having her home.", "zh": "也许因为她无处可去，也许因为她太累了——她上床后睡啊睡，好像好几年没睡过觉。有她在家里真好。"}]}, {"index": 145, "title": "EXT. COUNTRYSIDE - DAY", "blocks": [{"t": "a", "text": "Forrest and Jenny walking.", "zh": "福雷斯和珍妮散步。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Every day we'd take a walk, and I'd jabber on like a monkey in a tree. And she'd listen about ping-pong and shrimpin' boats and Momma makin' a trip to heaven. I did all the talkin'. Jenny most of the time was real qui
