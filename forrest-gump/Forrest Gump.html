ut of the car angrily.", "zh": "珍妮的约会对象名叫比利，怒气冲冲地下了车。"}, {"t": "d", "speaker": "BILLY", "note": "", "text": "What the hell is going on here?", "zh": "这到底他妈是怎么回事？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "No, he's not!", "zh": "不，他没有！"}, {"t": "d", "speaker": "BILLY", "note": "", "text": "Who is that? Who is that?", "zh": "那是谁？那是谁啊？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Get over there!", "zh": "你给我过去！"}, {"t": "a", "text": "Jenny turns and looks at Billy. He shoves Jenny's hands away from him.", "zh": "珍妮回头看比利。他一把甩开珍妮的手。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Billy, I'm sorry.", "zh": "比利，对不起。"}, {"t": "d", "speaker": "BILLY", "note": "", "text": "What in the hell, git, would you git away from me!", "zh": "搞什么鬼，滚开，离我远点！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Don't... Wait a second!", "zh": "别……等一下！"}, {"t": "d", "speaker": "BILLY", "note": "", "text": "Git, just git away from me!", "zh": "滚开，离我远点！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Don't go! Billy, wait a second!", "zh": "别走！比利，等一下！"}, {"t": "a", "text": "Billy gets back into the car.", "zh": "比利回到车上。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "He doesn't know any better!", "zh": "他不懂事！"}, {"t": "a", "text": "Billy pulls away as Jenny steps toward Forrest.", "zh": "比利开车离去，珍妮走向福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, why'd you do that?", "zh": "福雷斯，你为什么要那样做？"}, {"t": "a", "text": "Forrest holds out the box of chocolates.", "zh": "福雷斯递出那盒巧克力。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I brought you some chocolates. I'm sorry. I'll go back to my college now.", "zh": "我给你带了巧克力。对不起。我现在回我的学校去了。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, look at you! Come on. Come on.", "zh": "福雷斯，瞧你淋的！来。快来。"}, {"t": "a", "text": "Jenny grabs Forrest hand and leads him toward the dorm.", "zh": "珍妮拉起福雷斯的手，带他往宿舍走。"}]}, {"index": 48, "title": "INT. JENNY'S DORM/HALLWAY", "blocks": [{"t": "a", "text": "Jenny and Forrest sneak to Jenny's door.", "zh": "珍妮和福雷斯悄悄走到她的房门口。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Is this your room?", "zh": "这是你的房间吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Shh!", "zh": "嘘！"}, {"t": "a", "text": "Jenny unlocks the door and they step inside.", "zh": "珍妮打开门锁，两人走了进去。"}]}, {"index": 49, "title": "INT. JENNY'S DORM ROOM", "blocks": [{"t": "a", "text": "Jenny pulls a robe off of her sleeping roommate's bed. Jenny hands the robe to Forrest, sitting on Jenny's bed.", "zh": "珍妮从熟睡的室友床上扯下一件睡袍，递给坐在她床上的福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Do you ever dream, Forrest, about who you're gonna be?", "zh": "福雷斯，你有没有梦想过自己将来会成为什么样的人？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Who I'm gonna be?", "zh": "我将来会成为什么样的人？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Yeah.", "zh": "对呀。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Aren't I going to be me?", "zh": "我将来不能做我自己吗？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Well, you'll always be you, just another kind of you. You know? I want to be famous.", "zh": "嗯，你永远是你，只是另一个版本的你。懂吗？我想成名。"}, {"t": "a", "text": "Jenny picks up a towel, then walks back toward Forrest. Jenny dries the water from her hair.", "zh": "珍妮拿起一条毛巾，走回福雷斯身边擦头发上的水。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I want to be a singer like Joan Baez. I just want to be an empty stage with my guitar, my voice... just me.", "zh": "我想成为琼·贝兹那样的歌手。我只想站在空旷的舞台上，抱着我的吉他，用我的歌声……就我一个人。"}, {"t": "a", "text": "Jenny takes off her slip and sits on the bed next to him.", "zh": "珍妮脱下衬裙，在他身旁的床上坐下。"}, {"t": "a", "text": "She is only wearing her bra and panties. Forrest looks at Jenny like he's never seen a woman in her underwear before.", "zh": "她只穿着内衣。福雷斯看着珍妮，好像从没见过穿内衣的女人似的。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "And I want to reach people on a personal level. I want to be able to say things, just one-to-one.", "zh": "我想触动每个人的内心。我想能够和人面对面地、一对一地倾诉。"}, {"t": "a", "text": "Forrest looks down at Jenny's breasts. Jenny realizes that he is looking at her.", "zh": "福雷斯低头看珍妮的胸部。珍妮察觉到他在看。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Have you ever been with a girl, Forrest?", "zh": "福雷斯，你和女孩子在一起过吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I sit next to them in my home economics class all the time.", "zh": "我上家政课的时候一直坐在她们旁边。"}, {"t": "d", "speaker": "DJ", "note": "over radio", "text": "You're listening to WHHY in Birmingham, the clear A.M. voice of Northern Alabama. I'm Joel Dorn...", "zh": "您正在收听的是伯明翰 WHHY 电台，北亚拉巴马清澈的调幅之声。我是乔尔·多恩……"}, {"t": "a", "text": "Forrest looks at Jenny as she removes her bra. Forrest looks away, a bit shamed. Jenny takes his hand and guides it up to her breast.", "zh": "福雷斯看着珍妮解开胸罩，又不好意思地移开视线。珍妮拉起他的手，放到自己的胸上。"}, {"t": "d", "speaker": "DJ", "note": "over radio", "text": "...coming to you on a night that is anything but clear. The weatherman says that rain's gonna fall all night long so stay with us, get warm, get cozy, get under the covers to the cool sounds of WHHY.", "zh": "……在这个一点也不“清澈”的雨夜陪伴您。天气预报说雨会下一整夜，那就留在我们身边，暖暖和和、舒舒服服地钻进被窝，聆听 WHHY 的清凉乐声。"}, {"t": "a", "text": "Forrest looks over at Jenny's breasts, the shudder as he has an orgasm.", "zh": "福雷斯看着珍妮的胸，身体一颤，达到了高潮。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Ohh... Oh... I'm sorry. Sorry.", "zh": "哦……哦……对不起。对不起。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "It's okay.", "zh": "没关系。"}, {"t": "d", "speaker": "DJ", "note": "over radio", "text": "...444-6789, with ya till sunrise, playing the music you want to hear when you want to hear it. If you have a request or dedication, give us a call. We guarantee you'll hear your requests within one hour.", "zh": "……电话 444-6789，陪您直到日出，播放您想听的音乐。如果您想点歌或献歌，给我们打电话。我们保证您点的歌在一小时内播出。"}, {"t": "a", "text": "Forrest breathes heavily. Jenny puts her bra back on.", "zh": "福雷斯喘着粗气，珍妮重新穿上胸罩。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "It's all right.", "zh": "没事的。"}, {"t": "a", "text": "Jenny leans over and puts her head on Forrest's shoulder.", "zh": "珍妮侧过身，把头靠在福雷斯肩上。"}, {"t": "d", "speaker": "DJ", "note": "over radio", "text": "Candy is on the line tonight. Candy's answering the phones, give Candy your request, your dedication, and ask her why she won't go out with me, would you? Here's more music.", "zh": "今晚坎迪在电话线那头值班。坎迪会接听电话，把你的点歌、你的祝福告诉她，再顺便替我问问她为什么不肯和我约会，好吗？继续听歌。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "It's okay.", "zh": "没关系的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Oh, I'm dizzy.", "zh": "哦，我头晕。"}, {"t": "a", "text": "A song is coming over the radio. Jenny hugs Forrest.", "zh": "收音机里传来一首歌。珍妮抱着福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I bet that never happened in home ec.", "zh": "我敢打赌，家政课上可从没发生过这种事。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "No.", "zh": "没有。"}, {"t": "a", "text": "Jenny laughs and kisses Forrest on the cheek. Forrest and Jenny hug on the bed as Jenny's roommate pretends to be asleep, but is listening, horrified, with her eyes open.", "zh": "珍妮笑着亲了亲福雷斯的脸颊。两人正抱在床上，珍妮的室友……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I think I ruined your roommate's bathrobe.", "zh": "我想我把你室友的睡袍弄坏了。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I don't care. I don't like her, anyway.", "zh": "我不在乎，反正我也不喜欢她。"}]}, {"index": 50, "title": "EXT. UNIVERSITY OF ALABAMA/FOOTBALL STADIUM - DAY (1963)", "blocks": [{"t": "a", "text": "Forrest runs across the field as the defending team chases him. The crowd yells for Forrest. They flip a sign that reads: \"Go Forrest.\"", "zh": "福雷斯冲过球场，防守队员在后面追。观众为他高喊。他们翻出牌面：“冲啊，福雷斯”。"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "Run! Run! Run!", "zh": "跑！跑！跑！"}, {"t": "a", "text": "Forrest runs along the field. The crowd cheers.", "zh": "福雷斯沿球场飞奔，观众欢呼。"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "Run! Run! Run!", "zh": "跑！跑！跑！"}, {"t": "a", "text": "Forrest runs into the end zone. The band members rush toward Forrest with their hands up, signaling him to stop. The crowd flips over cards, creating a sign that reads \"STOP.\"", "zh": "福雷斯冲进端区。乐队队员举手跑过来示意他停下。观众翻出牌面拼出“停”。"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "Stop!", "zh": "停！"}, {"t": "a", "text": "Forrest stops in the end zone as he hears the crowd yells.", "zh": "听到观众的喊声，福雷斯在端区停了下来。"}, {"t": "a", "text": "The band motions for Forrest to stop and stay in the end", "zh": "乐队比划着让福雷斯停下、待在端区。"}, {"t": "a", "text": "zone. A group of defending players fall over each other in the end zone. Forrest looks as the crowd cheers wildly.", "zh": "一群防守队员在端区里撞作一团。福雷斯看着疯狂欢呼的观众。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "College ran by real fast 'cause I played so much football.", "zh": "大学时光一晃而过，因为我打了那么多橄榄球。"}, {"t": "a", "text": "BLACK AND WHITE PARAMOUNT NEWSREEL - DAY (1963)", "zh": "黑白派拉蒙新闻纪录片——白天（1963年）"}, {"t": "a", "text": "The White House with the words \"The eyes and ears of the world Paramount News\" superimposed.", "zh": "白宫画面，叠加字幕：“世界的眼睛与耳朵——派拉蒙新闻”。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "They even put me on a thing called the All-America Team where you get to meet the President of the United States.", "zh": "他们甚至把我选进了一个叫“全美最佳阵容”的东西，入选的人可以去见美国总统。"}, {"t": "a", "text": "BLACK AND WHITE NEWSREEL", "zh": "黑白新闻纪录片。"}, {"t": "a", "text": "PRESIDENT KENNEDY holds an autographed football as the All- American Team stands behind him. Forrest is among the players in suits.", "zh": "肯尼迪总统手持一只签名橄榄球，全美阵容队员站在他身后。福雷斯也在那群穿西装的球员之中。"}, {"t": "d", "speaker": "ANNOUNCER", "note": "over newsreel", "text": "President Kennedy met with the Collegiate All-American Football Team at the Oval Office today.", "zh": "肯尼迪总统今天在椭圆形办公室接见了大学全美橄榄球队。"}]}, {"index": 51, "title": "INT. WHITE HOUSE RECEPTION AREA - DAY (1963)", "blocks": [{"t": "a", "text": "The All-American players mingle around the food table. Forrest steps up to the table. A large spread of food and soda is on the table.", "zh": "全美队球员在餐台周围转来转去。福雷斯走到餐台前，台上摆满了食物和汽水。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, the real good thing about meeting the President of the United States is the food.", "zh": "要说见美国总统真正的好处，那就是吃的。"}, {"t": "a", "text": "Forrest takes a bottle of Dr. Pepper from the buffet table.", "zh": "福雷斯从自助餐台上拿了一瓶胡椒博士汽水。"}, {"t": "a", "text": "Numerous bottle of Dr. Pepper are displayed on the table. A servant opens the bottle for him.", "zh": "桌上摆着好多瓶胡椒博士。一名侍从帮他打开瓶子。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "They put you in this little room with just about anything you'd want to eat or drink. And since number one, I wasn't hungry, but thirsty...", "zh": "他们把你领进一个小房间，想吃的想喝的差不多应有尽有。第一，我不饿，就是渴……"}, {"t": "a", "text": "Forrest begins to guzzle the Dr. Pepper.", "zh": "福雷斯开始猛灌胡椒博士。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...and number two, they was free, I musta drank me about fifteen Dr. Peppers.", "zh": "……第二，这些都免费，我大概喝了有十五瓶胡椒博士。"}, {"t": "a", "text": "Forrest sets down an empty Dr. Pepper bottle next to a large number of other empty bottles. Forrest holds his stomach and burps.", "zh": "福雷斯把一个空瓶放在一大堆空瓶旁，捂着肚子打了个嗝。"}, {"t": "a", "text": "BLACK AND WHITE FOOTAGE - President Kennedy shakes hands with the All-American football players.", "zh": "黑白影像——肯尼迪总统与全美队球员一一握手。"}, {"t": "d", "speaker": "PRESIDENT KENNEDY", "note": "", "text": "Congratulations. How does it feel to be an All-American?", "zh": "祝贺你。入选全美队感觉如何？"}, {"t": "d", "speaker": "1ST PLAYER", "note": "", "text": "It's an honor, Sir.", "zh": "很荣幸，先生。"}, {"t": "a", "text": "Another player steps up to the President and shakes the President's hand.", "zh": "又一名球员走上前与总统握手。"}, {"t": "d", "speaker": "PRESIDENT KENNEDY", "note": "", "text": "Congratulations. How does it feel to be an All-American?", "zh": "祝贺你。入选全美队感觉如何？"}, {"t": "d", "speaker": "2ND PLAYER", "note": "", "text": "Very good, Sir.", "zh": "非常好，先生。"}, {"t": "d", "speaker": "PRESIDENT KENNEDY", "note": "", "text": "Congratulations. How does it feel to be an All-American?", "zh": "祝贺你。入选全美队感觉如何？"}, {"t": "d", "speaker": "3RD PLAYER", "note": "", "text": "Very good, Sir.", "zh": "非常好，先生。"}, {"t": "a", "text": "The player walks away. Forrest steps up to the President.", "zh": "那名球员走开。福雷斯走到总统面前。"}, {"t": "a", "text": "The President shakes his hand.", "zh": "总统和他握手。"}, {"t": "d", "speaker": "PRESIDENT KENNEDY", "note": "", "text": "Congratulations. How do you feel?", "zh": "祝贺你。你感觉怎么样？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I gotta pee.", "zh": "我想撒尿。"}, {"t": "a", "text": "President Kennedy turns and smiles.", "zh": "肯尼迪总统转过头笑了。"}, {"t": "d", "speaker": "PRESIDENT KENNEDY", "note": "", "text": "I believe he said he had to go pee.", "zh": "我想他是说他要去撒尿。"}]}, {"index": 52, "title": "INT. WHITE HOUSE/BATHROOM", "blocks": [{"t": "a", "text": "Forrest urinates in the bathroom, then lowers the lid and flashes. Forrest washes his hands, then notices an autographed photo from Marilyn Monroe and a photo of John with his brother Bobby.", "zh": "福雷斯在卫生间小便，然后放下马桶盖冲水。他洗着手，注意到一张玛丽莲·梦露的签名照，还有一张约翰和哥哥博比的合影。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometime later, for no particular reason, somebody shot that nice young President when he was ridin' in his car.", "zh": "过了些时候，没什么特别的原因，有人朝那位好心的年轻总统开了枪，当时他正坐在车里。"}, {"t": "a", "text": "ARCHIVAL FOOTAGE - DAY SLOW MOTION - President Kennedy rises in a convertible and smiles.", "zh": "档案影像——白天，慢镜头：肯尼迪总统在敞篷车里起身微笑。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "And a few years after that...", "zh": "又过了几年……"}, {"t": "a", "text": "ARCHIVAL FOOTAGE - Robert Kennedy stands at a podium as people around him applaud.", "zh": "档案影像：罗伯特·肯尼迪站在讲台前，周围的人为他鼓掌。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...somebody shot his little brother, too, only he was in a hotel kitchen.", "zh": "……有人把他弟弟也枪杀了，只是那次是在一家酒店的厨房里。"}]}, {"index": 53, "title": "EXT. SAVANNHA/BUS BENCH - DAY (1981)", "blocks": [{"t": "a", "text": "Forrest sits on the bench and shakes his head.", "zh": "福雷斯坐在长椅上摇了摇头。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It must be hard being brothers. I wouldn't know.", "zh": "当兄弟肯定不容易。我是不会懂的。"}]}, {"index": 54, "title": "EXT. UNIVERSITY OF ALABAMA - DAY - GRADUATION DAY (1966)", "blocks": [{"t": "a", "text": "Students in their caps and gowns step forward the podium to receive their diplomas. Forrest's name is called. He steps up and accepts his diploma.", "zh": "学生们戴着学位帽、穿着礼服走上讲台领取毕业证书。念到福雷斯的名字，他上前接过文凭。"}, {"t": "d", "speaker": "DEAN", "note": "", "text": "Forrest Gump.", "zh": "福雷斯·甘。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now can you believe it? After only five years of playing football, I got a college degree.", "zh": "你信吗？只打了五年橄榄球，我就拿到了大学学位。"}, {"t": "a", "text": "The dean shakes Forrest's hand vigorously. Forrest looks out into the crowd.", "zh": "院长用力地和福雷斯握手。福雷斯望向人群。"}, {"t": "d", "speaker": "DEAN", "note": "", "text": "Congratulations, son.", "zh": "祝贺你，孩子。"}, {"t": "a", "text": "Mrs. Gump, sitting in the audience, cries.", "zh": "坐在观众席里的甘太太哭了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma was proud.", "zh": "妈妈很骄傲。"}, {"t": "a", "text": "Forrest and Mrs. Gump have their picure taken in front of a large statue. A military recruiter spots Forrest and steps up to him.", "zh": "福雷斯和甘太太在一座大雕像前合影。一个征兵军官注意到福雷斯，朝他走来。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Forrest, I'm so proud of you. Here, I'll hold this for you.", "zh": "福雷斯，我真为你骄傲。来，文凭我帮你拿着。"}, {"t": "a", "text": "Mrs. Gump takes the diploma from Forrest. The recruiter slaps Forrest on the shoulder and hands him some military literature.", "zh": "甘太太接过文凭。征兵军官拍了拍福雷斯的肩膀，递给他一些军队宣传材料。"}, {"t": "d", "speaker": "MILITARY RECRUITER", "note": "", "text": "Congratulations, son. Have you given any thought to your future?", "zh": "祝贺你，孩子。有没有想过你的未来？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Thought?", "zh": "想？"}, {"t": "a", "text": "Forrest looks at a pamphlet with a photo of \"Uncle Sam\" and the caption \"EXCELLENT CAREERS FOR EXCELLENT YOUNG MAN. Apply now at your local U.S. Army Recruiting Center.\"", "zh": "福雷斯看着一本小册子，上面是“山姆大叔”的画像，写着：“优秀青年的绝佳职业。请即刻前往当地美国陆军征兵中心报名。”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Hello, I'm Forrest...", "zh": "你好，我叫福雷斯……"}]}, {"index": 55, "title": "INT. ARMY BUS - DAY (1966)", "blocks": [{"t": "a", "text": "Forrest steps onto the army bus. Rain pours outside as the army bus driver yells at Forrest.", "zh": "福雷斯踏上军车。外面大雨倾盆，军车司机冲他大吼。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "...Forrest Gump.", "zh": "……福雷斯·甘。"}, {"t": "d", "speaker": "ARMY BUS DRIVER", "note": "", "text": "Nobody gives a hunk of shit who you are, fuzzball! You're not even a lowlife scum sucking maggot! Get your faggoty ass on the bus. You're in the Army now!", "zh": "没人他妈管你是谁，毛球！你连个下贱的、吃屎的蛆虫都不如！把你那同性恋屁股给我挪上车来。你现在参军了！"}, {"t": "a", "text": "Forrest is about to sit on the first available seat, but the recruit sitting there refuses Forrest.", "zh": "福雷斯正要在第一个空位坐下，坐在那儿的新兵却不让他坐。"}, {"t": "d", "speaker": "RECRUIT #1", "note": "", "text": "This seat's taken.", "zh": "这位子有人了。"}, {"t": "a", "text": "Forrest tries to sit on the next seat, but the 2nd recruit slides over, blocking him.", "zh": "福雷斯想坐旁边的位子，第二个新兵往里一挪，挡住了他。"}, {"t": "d", "speaker": "RECRUIT #2", "note": "", "text": "It's taken.", "zh": "有人了。"}, {"t": "a", "text": "Forrest steps forward, looking much like he did on his first bus ride to school years ago.", "zh": "福雷斯往前走去，样子和多年前第一次坐校车上学时一模一样。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "At first, it seemed like I made a mistake.", "zh": "一开始，我觉得自己好像犯了个错。"}, {"t": "a", "text": "A large black recruit with a strange look on his face, much like Forrest's, looks up from his seat. His name is BUBBA.", "zh": "一个大块头黑人新兵从座位上抬头看他，神情怪怪的，和福雷斯差不多。他叫布巴。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...seeing how it was my induction day and I was already gettin' yelled at.", "zh": "……毕竟那天是我入伍的日子，却已经挨了一顿吼。"}, {"t": "a", "text": "Bubba moves his case over, making room for Forrest to sit down.", "zh": "布巴把自己的箱子挪开，给福雷斯腾出座位。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "You can sit down... if you want to.", "zh": "你可以坐这儿……如果你想的话。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I didn't know who I might meet or what they might ask.", "zh": "我不知道会遇到什么人，也不知道他们会问什么。"}, {"t": "a", "text": "Bubba hands Forrest a handkerchief.", "zh": "布巴递给福雷斯一块手帕。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "You ever been on a real shrimp boat?", "zh": "你上过真正的捕虾船吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "No, but I been on a real big boat.", "zh": "没有，但我上过真正的大船。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I'm talkin' about a shrimp catchin' boat. I've been workin' on shrimp boats all my life. I started out my uncle's boat, that's my mother's brother, when I was about maybe nine. I was just lookin' into buyin' a boat of my own and got drafted. My given name is Benjamin Buford Blue.", "zh": "我说的是捕虾的船。我一辈子都在捕虾船上干活。大概九岁起，我就在我舅舅——就是我妈妈的哥哥——的船上干活。我正打算自己买条船，结果就被征兵了。我的全名是本杰明·布福德·布鲁。"}, {"t": "a", "text": "Bubba and Forrest shake hands.", "zh": "布巴和福雷斯握手。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "People call me Bubba. Just like one of them redneck boys. Can you believe that?", "zh": "大家都叫我布巴，就跟那些南方乡巴佬小子的叫法一样。你信吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My name's Forrest Gump. People call me Forrest Gump.", "zh": "我叫福雷斯·甘。大家都叫我福雷斯·甘。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So Bubba was from Bayou La Batre, Alabama, and his momma cooked shrimp.", "zh": "布巴来自亚拉巴马州的拉巴特湾，他妈妈是做虾的。"}]}, {"index": 56, "title": "INT. LOUISIANA/KITCHEN - DAY (1966)", "blocks": [{"t": "a", "text": "Bubba's mother, a robust woman in a cook's uniform, carries a bowl of shrimp into a dining room. She sets it down on a table in front of a wealthy white man.", "zh": "布巴的母亲是个壮实的女人，穿着厨师制服，端着一碗虾走进餐厅，放在一个有钱白人桌前。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And her momma before her cooked shrimp.", "zh": "再往上，她妈妈也是做虾的。"}]}, {"index": 57, "title": "INT. SOMEWHERE IN THE SOUTH/KITCHEN - DAY (EARLY DAYS OF SLAVERY)", "blocks": [{"t": "a", "text": "Bubba's grandmother carries a bowl of shrimp into a dining room. She sets it down on a table in front of a wealthy white man.", "zh": "布巴的祖母端着一碗虾走进餐厅，放在一个有钱白人桌前。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And her momma before her momma cooked shrimp, too. Bubba's family knew everything...", "zh": "再往上，她妈妈的妈妈也是做虾的。布巴家的人懂所有的事……"}]}, {"index": 58, "title": "INT. ARMY BUS - DAY (1966)", "blocks": [{"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...there was to know about the shrimpin' business.", "zh": "……一切和捕虾这行有关的事，他们都懂。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I know everything there is to know about the shrimpin' business. Matter of fact, I'm goin' into the shrimpin' business for myself after I get out the Army.", "zh": "捕虾这行的事我没有不懂的。说真的，等我退伍了，我要自己干捕虾这一行。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好。"}]}, {"index": 59, "title": "INT. BARRACKS - DAY", "blocks": [{"t": "a", "text": "A DRILL SERGEANT is in Forrest's face as Forrest stands in line with the other recruits.", "zh": "福雷斯和其他新兵列队站着，一名操练教官对着他的脸吼。"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Gump! What's your sole purpose in this Army?", "zh": "甘！你在这支军队里的唯一目的是什么？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "To do whatever you tell me, Drill Sergeant!", "zh": "服从您的任何命令，教官！"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Godamnit, Gump! You're a goddamned genius! That's the most outstanding answer I've ever heard. You must have a godamned I.Q. of a hundred and sixty! You are godamned gifted, Private Gump!", "zh": "该死的，甘！你真是个该死的天才！这是我听过最出色的回答。你的智商肯定有他妈的一百六！列兵甘，你他妈真是个天才！"}, {"t": "a", "text": "The Drill Sergeant moves down the line to the next man.", "zh": "操练教官沿队伍走到下一个人面前。"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Listen up, people...", "zh": "都给我听好了……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, for some reason, I fit in the Army like one of them round pegs. It's not really hard. You just make your bed real neat and remember to stand up straight.", "zh": "不知为什么，我在军队里如鱼得水。这其实不难，你只要把床铺得整整齐齐，记住站直就行。"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "That is one very intelligent individual! You lock your scuzzy bodies up behind that private and do exactly what he does and you will go far in this man's army!", "zh": "那可是个非常聪明的家伙！你们这群邋遢鬼都给我跟在那个列兵后面，他怎么做你们就怎么做，在这支军队里你们就能有出息！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And always answer every question with \"Yes, Drill Sergeant!\"", "zh": "任何问题都要回答“是，教官！”"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Is that clear?", "zh": "听清楚了吗？"}, {"t": "d", "speaker": "FORREST & RECRUITS", "note": "", "text": "Yes, Drill Sergeant!", "zh": "是，教官！"}, {"t": "a", "text": "ANOTHER DAY", "zh": "又一天。"}, {"t": "a", "text": "The recruits are sitting at the base of their bunks assembling their rifles. Bubba speaks to Forrest.", "zh": "新兵们坐在床脚组装步枪。布巴对福雷斯说话。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "What you do is you just drag your nets across the bottom. On a good day, you can catch over a hundred pounds of shrimp. If everything goes all right, two men shrimpin' ten hours, less what you spends on gas, you can...", "zh": "你要做的就是把拖网贴着海底拖。运气好的时候，一天能捕一百多磅虾。一切顺利的话，两个人捕十个小时，扣掉油钱，你能……"}, {"t": "a", "text": "Forrest finishes assembling his rifle as the other recruits are still working on theirs.", "zh": "别人还在忙活着，福雷斯已经把枪组装好了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Done, Drill Sergeant!", "zh": "报告教官，完成了！"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Gump!", "zh": "甘！"}, {"t": "a", "text": "The Drill Sergeant rushes up to Forrest.", "zh": "操练教官冲到福雷斯面前。"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Why did you put that weapon together so quickly, Gump?", "zh": "甘，你为什么这么快就把武器组装好了？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You told me to, Drill Sergeant.", "zh": "是您命令我的，教官。"}, {"t": "a", "text": "The Drill Sergeant looks at his stop watch.", "zh": "操练教官看了看秒表。"}, {"t": "d", "speaker": "DRILL SERGEANT", "note": "", "text": "Jesus Christ! This is a new company record. If it wouldn't be a waste of such a damn fine enlisted man, I'd recommended you for O.C.S., Private Gump. You are gonna be a General some day, Gump! Now, disassemble your weapon and continue!", "zh": "耶稣基督！这是连队的新纪录。列兵甘，要不是浪费这么好的一个士兵太可惜，我都想推荐你去军官预备学校了。甘，你将来能当将军！现在，把你的武器拆开，继续练！"}, {"t": "a", "text": "The Drill Sergeant walks away as Forrest begins to disassemble his rifle. After the Drill Sergeant walks past Bubba, Bubba looks up at Forrest. Bubba continues talking about shrimp in his slow southern drawl.", "zh": "教官走开，福雷斯开始拆枪。教官走过布巴身边后，布巴抬头看福雷斯，用慢悠悠的南方长腔继续讲他的虾。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Anyway, like I was sayin', shrimp is the fruit of the sea. You can barbecue it, boil it, broil it, bake it, saute it. There, uh, shrimp kabobs, shrimp creole...", "zh": "总之，我刚说到，虾是海里的水果。可以烤着吃、煮着吃、烘着吃、焙着吃、炒着吃。有虾肉烤串、克里奥尔烩虾……"}, {"t": "a", "text": "ANOTHER DAY", "zh": "又一天。"}, {"t": "a", "text": "Bubba and Forrest shine their boots.", "zh": "布巴和福雷斯在擦皮鞋。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "...shrimp gumbo, panfried, deep fried, stir fried. There's pineapple shrimp, lemon shrimp, coconut shrimp, pepper shrimp...", "zh": "……秋葵虾汤、煎虾、炸虾、爆炒虾。还有菠萝虾、柠檬虾、椰子虾、胡椒虾……"}, {"t": "a", "text": "ANOTHER DAY", "zh": "又一天。"}, {"t": "a", "text": "Bubba and Forrest are on their hands and knees as they scrub the floor with toothbrushes.", "zh": "布巴和福雷斯趴在地上，用牙刷刷地板。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "...shrimp soup, shrimp stew, shrimp salad, shrimp and potatoes, shrimp burger, shrimp sandwich... that's, that's about it.", "zh": "……虾汤、炖虾、虾沙拉、土豆烧虾、虾肉汉堡、虾肉三明治……大概，大概就这些了。"}, {"t": "a", "text": "NIGHT", "zh": "夜晚。"}, {"t": "a", "text": "Bubba lies in his bunk and looks up quietly.", "zh": "布巴躺在铺上，静静地望着上方。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Nighttime in the Army is a lovely time.", "zh": "军队里的夜晚是段美好的时光。"}, {"t": "a", "text": "Forrest lies in his bunk and looks up.", "zh": "福雷斯躺在铺上望着上方。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "We'd lay there in our bunks, and I'd miss my momma. And I'd miss Jenny.", "zh": "我们躺在床铺上，我会想念妈妈，也会想念珍妮。"}, {"t": "a", "text": "A young private tosses a Playboy magazine onto Forrest.", "zh": "一个年轻列兵把一本《花花公子》扔到福雷斯身上。"}, {"t": "d", "speaker": "YOUNG PRIVATE", "note": "", "text": "Hey, Gump. Get a load of the tits on her!", "zh": "嘿，甘。瞧瞧这妞的奶子！"}, {"t": "a", "text": "Forrest pick up the magazine and turns the page, revealing Jenny as she poses with a school sweater on, and that's all.", "zh": "福雷斯拿起杂志翻开，里面是珍妮的照片：她穿着一件校队毛衣，仅此而已。"}, {"t": "a", "text": "The pictorial is titled: \"Girls of the South.\" Forrest looks up with shock. He cranes his head up for a closer look.", "zh": "这组图片标题是《南方女孩》。福雷斯震惊地抬起头，又伸长脖子凑近细看。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Turns out, Jenny had gotten into some trouble over... some photos of her in her college sweater. And she was thrown out of school.", "zh": "原来，珍妮因为……一些她穿着大学毛衣拍的照片惹了麻烦，被学校开除了。"}, {"t": "d", "speaker": "SONG", "note": "", "text": "\"My baby does the hanky-panky...\"", "zh": "“我的宝贝在和人鬼混……”"}]}, {"index": 60, "title": "INT. NASHVILLE/NIGHT CLUB - NIGHT (1966)", "blocks": [{"t": "a", "text": "Forrest, in his army uniform, steps into the foyer of the club.", "zh": "福雷斯穿着军装走进俱乐部门厅。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But that wasn't a bad thing. Because a man who owns a theater in Memphis, Tennessee, saw those photo and offered Jenny a job singing in a show. The first chance I got, I took the bus up to Memphis to see her perform in that show.", "zh": "不过这也不算坏事。因为田纳西州孟菲斯市一家剧院的老板看到了那些照片，请珍妮去一个演出里唱歌。我一有机会就坐大巴去孟菲斯看她演出。"}, {"t": "a", "text": "EMCEE steps out onto the stage.", "zh": "主持人走上舞台。"}, {"t": "d", "speaker": "EMCEE", "note": "", "text": "That was Amber, Amber Flame. Give her a big hand, guys. Good job, Amber. And now, for your listening and viewing pleasure, direct from Hollywood, California, our very own beatnik beauty, let's give a big round of applause to the luscious Bobbie Dylan.", "zh": "刚才是安珀，安珀·弗莱姆。各位，给她来点掌声。干得好，安珀。接下来，为了各位的视听享受，有请直接从加利福尼亚好莱坞来的、我们自己的“垮掉一代”美女——让我们用热烈掌声欢迎迷人的博比·迪伦！"}, {"t": "d", "speaker": "CROWD", "note": "", "text": "Bobbie... Bobbie...", "zh": "博比……博比……"}, {"t": "a", "text": "The emcee walks back off the stage and the curtain opens, revealing Jenny as she sits on a stool on the stage. She holds a guitar up and begins to play. She is topless.", "zh": "主持人走下台，幕布拉开，珍妮坐在舞台上的一张凳子上，抱着吉他弹唱。她上身赤裸。"}, {"t": "d", "speaker": "JENNY", "note": "sings", "text": "\"Yes, and how many seas must the white dove said, before she sleeps in the sand.\"", "zh": "“是啊，白鸽要飞越多少片海洋，才能在沙滩上安眠。”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Her dream had come true. She was a folk singer.", "zh": "她的梦想实现了。她成了一名民谣歌手。"}, {"t": "d", "speaker": "JENNY", "note": "sings", "text": "\"Yes, how many times must the cannonballs fly before they're forever banned.\"", "zh": "“是啊，炮弹还要飞行多少次，才能被永远禁止。”"}, {"t": "d", "speaker": "MAN #1", "note": "", "text": "You gotta lose the guitar, darling.", "zh": "吉他就别拿了，亲爱的。"}, {"t": "d", "speaker": "MAN #2", "note": "", "text": "Hey, come on, baby. Shake it up. Shake it up now.", "zh": "嘿，来啊，宝贝。扭起来。现在就扭起来。"}, {"t": "d", "speaker": "MAN #3", "note": "", "text": "Hey, somebody ought to get her a harmonica.", "zh": "嘿，该有人给她递个口琴。"}, {"t": "a", "text": "The men laugh.", "zh": "男人们大笑。"}, {"t": "d", "speaker": "JENNY", "note": "sings", "text": "\"The answer, my friend is blowing in the wind. The answer is blowing in...", "zh": "“答案啊，我的朋友，在风中飘荡。答案在风中……”"}, {"t": "d", "speaker": "MAN #", "note": "", "text": "...skin, honey. This isn't Captain Kangaroo.", "zh": "……露皮肉啊，宝贝。这儿可不是袋鼠船长儿童节目。"}, {"t": "d", "speaker": "MEN", "note": "", "text": "Yeah! Come on!", "zh": "对！来啊！"}, {"t": "a", "text": "Man #5 reaches up and tries to stick some money in Jenny's shoe.", "zh": "男人五号伸出手，想把钱塞进珍妮的鞋里。"}, {"t": "d", "speaker": "MAN #5", "note": "", "text": "Hey, honey, I got something here for you.", "zh": "嘿，宝贝，我这儿有样东西给你。"}, {"t": "a", "text": "Jenny kicks his hand. He yells angrily as he sits back down, then tosses his drink on her.", "zh": "珍妮踢开他的手。他气冲冲地坐回去，把酒泼在她身上。"}, {"t": "d", "speaker": "MAN #5", "note": "", "text": "Goddamnit!", "zh": "该死的！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hey! Hey! Stupid jerk! I'm singing a song here. Polly, get out here!", "zh": "嘿！嘿！你这蠢货！我在这儿唱歌呢！波莉，给我出来！"}, {"t": "d", "speaker": "MAN #", "note": "", "text": "Hey, show us some stuff, honey!", "zh": "嘿，给咱们露点什么啊，宝贝！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Shut up! Oh, shut up!", "zh": "闭嘴！哦，闭嘴！"}, {"t": "a", "text": "Forrest walks up to Man #5 and grabs him and tosses him down on the ground. Man #4 tries to grab Forrest, but Forrest shoves him down too.", "zh": "福雷斯走到男人五号面前，一把揪住他把他掼倒在地。男人四号想抓福雷斯，也被他推倒。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, what are you doing here? What are you doing?", "zh": "福雷斯，你在这儿干什么？你干什么呀？"}, {"t": "a", "text": "Forrest climbs up onto the stage and picks Jenny up, guitar and all, and carries her.", "zh": "福雷斯爬上舞台，连人带吉他把珍妮抱了起来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Come on.", "zh": "走。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "What are you doing? Forrest, let me down!", "zh": "你干什么？福雷斯，放我下来！"}, {"t": "a", "text": "Jenny struggles and frees herself from Forrest. Forrest steps back in surprise. Jenny shoves the guitar at Forrest. Jenny walks off as Forrest holds the guitar. He follows after her.", "zh": "珍妮挣扎着从福雷斯怀里挣脱。福雷斯吃惊地后退。珍妮把吉他塞给他，转身走了，福雷斯抱着吉他跟上去。"}]}, {"index": 61, "title": "EXT. MEMPHIS BRIDGE - NIGHT", "blocks": [{"t": "a", "text": "Forrest follows Jenny over a bridge outside the night club.", "zh": "福雷斯跟着珍妮走过夜总会外的一座桥。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You can't keep doing this, Forrest. You can't keep tryin' to rescue me all the time.", "zh": "你不能老这样，福雷斯。你不能老是想着来救我。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "They was tryin' to grab you.", "zh": "他们想占你便宜。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "A lot of people try to grab me. Just -- you can't keep doing this all the time!", "zh": "想占我便宜的人多了。只是——你不能老这样！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I can't help it. I love you.", "zh": "我忍不住。我爱你。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, you don't know what love is.", "zh": "福雷斯，你不懂什么是爱。"}, {"t": "a", "text": "Jenny turns and looks over the bridge.", "zh": "珍妮转身望向桥下。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You remember that time we prayed, Forrest? We prayed for God to turn me into a bird so I could fly far, far away?", "zh": "你还记得我们祈祷的那次吗，福雷斯？我们求上帝把我变成一只鸟，飞得远远的？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, I do.", "zh": "我记得。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "You think I can fly off this bridge?", "zh": "你觉得我能从这座桥上飞下去吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "What do you mean, Jenny?", "zh": "你什么意思，珍妮？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Nothing.", "zh": "没什么。"}, {"t": "a", "text": "Jenny turns and looks at the light of an approaching vehicle.", "zh": "珍妮转头看见一辆车驶近的灯光。"}, {"t": "a", "text": "She steps into the street.", "zh": "她走到马路中央。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I gotta get outta here.", "zh": "我得离开这儿。"}, {"t": "a", "text": "Jenny runs and flags down the approaching vehicle.", "zh": "珍妮跑着挥手拦下驶近的车。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "But wait. Jenny!", "zh": "等等。珍妮！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest, you stay away from me, okay? You just stay away from me, please.", "zh": "福雷斯，你离我远点，好吗？求你了，离我远点。"}, {"t": "a", "text": "A pickup truck pulls over as Jenny looks at the driver.", "zh": "一辆皮卡靠边停下，珍妮看着司机。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Can I have a ride?", "zh": "能搭个便车吗？"}, {"t": "d", "speaker": "DRIVER", "note": "", "text": "Where you going?", "zh": "你去哪儿？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I don't care.", "zh": "我不在乎。"}, {"t": "d", "speaker": "DRIVER", "note": "", "text": "Get in the truck.", "zh": "上车吧。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "So bye-bye, Jenny. They sendin' me to Vietnam. It's this whole other country.", "zh": "那么再见了，珍妮。他们要派我去越南了，那是另一个国家。"}, {"t": "a", "text": "Jenny walks toward Forrest. She looks at the driver.", "zh": "珍妮走向福雷斯，又看了一眼司机。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Just hang on a minute.", "zh": "等一下。"}, {"t": "a", "text": "Jenny walks up to Forrest.", "zh": "珍妮走到福雷斯面前。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Listen, you promise me something, okay? Just if you're ever in trouble, don't try to be brave, you just run, okay? Just run away.", "zh": "听着，你答应我一件事，好吗？要是遇到危险，别逞英雄，你就跑，明白吗？只管跑开。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay. Jenny, I'll write you all the time.", "zh": "好。珍妮，我会一直给你写信的。"}, {"t": "a", "text": "Jenny takes a last look at Forrest, then climbs into the truck. Forrest watches Jenny in the pickup as it drives away.", "zh": "珍妮最后看了福雷斯一眼，爬上皮卡。皮卡驶走，福雷斯望着车上的珍妮。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And just like that.", "zh": "就这样。"}]}, {"index": 62, "title": "EXT. GREENBOW/GUMP BOARDING HOUSE/RIVER - DAY", "blocks": [{"t": "a", "text": "Forrest, dressed in his uniform, sits on a log and looks out at a river.", "zh": "福雷斯穿着军装坐在一根圆木上，望着河面。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...she was gone.", "zh": "……她走了。"}, {"t": "a", "text": "Mrs. Gump walks toward Forrest and sits down next to him on the log. Forrest leans down, placing his head on his mother's shoulder.", "zh": "甘太太走到福雷斯身边，在圆木上坐下。福雷斯俯身把头靠在母亲肩上。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "You come back safe to me, do ya hear?", "zh": "你要平平安安地回到我身边，听见没有？"}]}, {"index": 63, "title": "EXT. VIETNAM/MEKONG DELTA - MORNING (1967)", "blocks": [{"t": "a", "text": "The shadow of a helicopter over the rice field below. A soldier is manning a gun from inside the helicopter. The solider looks left, Forrest and Bubba ride in the helicopter.", "zh": "直升机的影子掠过下方的稻田。一名士兵在机内操着机枪。他看向左边——福雷斯和布巴坐在机上。"}]}, {"index": 64, "title": "EXT. FIREBASE/4TH PLATOON", "blocks": [{"t": "a", "text": "The helicopter circles overhead, then lands at the firebase.", "zh": "直升机在头顶盘旋，随后降落在火力基地。"}, {"t": "d", "speaker": "SONG", "note": "", "text": "\"Some folks are born made to wave the flag. Ooh, they're red, white and blue. And when the band plays \"Hail to the Chief,\" ohh, they point the cannon at you all. It ain't me. It ain't me. I ain't no Senator's son, no. It ain't me. It ain't me...\"", "zh": "“有些人生来就会挥舞旗帜。哦，那红白蓝三色。当乐队奏起《向统帅致敬》，哦，他们把大炮对准你们。那不是我。那不是我。我不是参议员的儿子，不。那不是我。那不是我……”"}, {"t": "a", "text": "Bubba and Forrest jump out of the helicopter with their gear/ They walk and look around oddly.", "zh": "布巴和福雷斯背着装备跳下直升机，走路时奇怪地东张西望。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, they told us that Vietnam was gonna be very different from the United Sates of America.", "zh": "他们告诉我们，越南和美利坚合众国会很不一样。"}, {"t": "a", "text": "The soldier places a case of beer on a large stack of cases.", "zh": "一名士兵把一箱啤酒放在一大堆啤酒箱上。"}, {"t": "a", "text": "He takes two beers out and walks away. In the background, soldiers are barbecuing steaks and drinking beer.", "zh": "他拿出两瓶啤酒走开。背景里，士兵们在烤牛排、喝啤酒。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Except for all the beer cans and the barbecue, it was.", "zh": "除了满地的啤酒罐和烧烤，确实很不一样。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Y'know, I bet there's shrimp all in these waters. They tell me these Vietnams is good shrimp. You know, after we win this war, and we take over everything we can get American shrimpers to come on here and shrimp these waters. We'll just shrimp all the time, man. So much shrimp, why, you wouldn't believe it.", "zh": "你知道吗，我敢说这片水域里全是虾。人家说越南这地方虾很好。等我们打赢了这场仗，把一切接收过来，就能叫美国的捕虾人到这儿来捕虾了。我们就天天捕虾，伙计。虾多到你都不敢相信。"}, {"t": "a", "text": "Lieutenant DAN TAYLOR steps out of a tent. Shirtless, he holds a roll of toilet paper in his hand.", "zh": "丹·泰勒中尉从帐篷里走出来。他没穿衬衫，手里拿着一卷卫生纸。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You must be my F.N.G.'s.", "zh": "你们准是我的新兵蛋子。"}, {"t": "d", "speaker": "BUBBA AND FORREST", "note": "", "text": "Morning', sir!", "zh": "早上好，长官！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Ho! Get your hands down. Do not salute me. There are goddamned snipers all around this area who would love to grease an officer. I'm Lieutenant Dan Taylor. Welcome to Fourth Platoon.", "zh": "嗬！把手放下。别向我敬礼。这一带到处是他妈的狙击手，他们可巴不得干掉一个军官。我是丹·泰勒中尉。欢迎来到四排。"}, {"t": "a", "text": "Lt. Dan looks at Bubba.", "zh": "丹中尉看着布巴。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "What's wrong with your lips?", "zh": "你的嘴唇怎么了？"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I was born with big gums, sir.", "zh": "报告长官，我天生牙龈大。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Yeah, well, you better tuck that in. Gonna get that caught on a trip wire. Where you boys from in the world?", "zh": "嗯，你最好把它收进去，当心绊到诡雷线上。你们俩是哪儿人？"}, {"t": "d", "speaker": "BUBBA & FORREST", "note": "", "text": "Alabama, sir!", "zh": "亚拉巴马，长官！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You twins?", "zh": "你们是双胞胎？"}, {"t": "a", "text": "Forrest and Bubba look at each other oddly, they don't get the joke.", "zh": "福雷斯和布巴奇怪地对视一眼，没听懂这个玩笑。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "No, we are not relations, sir.", "zh": "不是，我们不是亲戚，长官。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Look, it's pretty basic here.", "zh": "听着，这儿的规矩很简单。"}, {"t": "a", "text": "Lt. Dan starts to walk. Bubba and Forrest grab their gear and follow him.", "zh": "丹中尉迈步走起来，布巴和福雷斯抓起装备跟上。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You stick with me, you learn from the guys who been in country awhile, you'll be right. There is one item of G.I. gear that can be the difference between a live grunt and a dead grunt.", "zh": "跟着我，向在这个国家待过一阵的弟兄们学，你们就不会有事。大兵的装备里有一样东西，能决定一个步兵是活着还是送命。"}, {"t": "a", "text": "Lt. Dan stops and looks at the boys.", "zh": "丹中尉停下，看着两个小伙子。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Socks, cushion, sole, O.D. green. Try and keep your feet dry when we're out humpin'. I want you boys to remember to change your socks wherever we stop. The Mekong will eat a grunt's feet right off his legs.", "zh": "袜子，垫袜底，军绿色。行军的时候尽量保持脚干燥。你们俩记住，不管在哪儿停下，都要换袜子。湄公河能把步兵的脚直接从腿上烂掉。"}, {"t": "a", "text": "Lt. Dan steps over to a large black soldier named SERGEANT SIMS.", "zh": "丹中尉走到一个名叫西姆斯中士的高大黑人士兵面前。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Sergeant Sims! Goddamnit, where is that sling-rope I told you to order.", "zh": "西姆斯中士！该死的，我让你订的吊索绳呢？"}, {"t": "d", "speaker": "SGT. SIMS", "note": "", "text": "I put in requisitions at Battalion.", "zh": "我已经向营部提交申请了。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Yeah, yeah, yeah, well you call those sonabitches again, call them again and again and again. I don't care how much it takes...", "zh": "好好好，你再给那些狗娘养的打电话，一遍一遍地打。我不管要费多少工夫……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Lt. Dan sure knew his stuff. I felt real lucky he was my lieutenant. He was from a long, great military tradition. Somebody in his family had fought and died in every single American war.", "zh": "丹中尉对业务真是了如指掌。有他当中尉我觉得很幸运。他出身于一个悠久而伟大的军人世家。他家里似乎每一场美国战争都有人参战并阵亡。"}]}, {"index": 65, "title": "EXT. VALLEY FORGE/THE REVOLUTIONARY WAR - DAY (1778)", "blocks": [{"t": "a", "text": "A distant relative of Lt. Dan's, wearing a revolutionary war uniform, falls dead in the snow.", "zh": "丹中尉的一位远亲穿着独立战争时期的军装，倒在雪地里死去。"}]}, {"index": 66, "title": "EXT. GETTYSBURG/THE CIVIL WAR - DAY (1863)", "blocks": [{"t": "a", "text": "Another relative, wearing a civil war uniform and bearing a striking resemblance to Lt. Dan, falls down dead.", "zh": "另一位亲戚穿着内战军装，长得和丹中尉惊人地相似，中弹倒地身亡。"}]}, {"index": 67, "title": "EXT. NORMANDY/WORLD WAR II - DAY (1944)", "blocks": [{"t": "a", "text": "Another relative, wearing a World War II, falls down dead on the beach at Normandy.", "zh": "又一位亲戚穿着二战军装，倒在诺曼底海滩上死去。"}]}, {"index": 68, "title": "EXT. VETNAM/MEKONG DELTA/FIREBASE - DAY (1967)", "blocks": [{"t": "d", "speaker": "LT. DAN", "note": "", "text": "Goddamnit, kick some ass!", "zh": "该死的，给我狠狠打！"}, {"t": "d", "speaker": "SGT. SIMS", "note": "", "text": "I'm on it, Lieutenant.", "zh": "我这就去办，中尉。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get on it!", "zh": "快去办！"}, {"t": "a", "text": "Lt. Dan steps back up to Bubba and Forrest.", "zh": "丹中尉走回布巴和福雷斯面前。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I guess you could say he had a lot to live up to.", "zh": "可以说，他背负着家族很高的期望。"}, {"t": "a", "text": "Lt. Dan walks along the walkway and Bubba and Forrest follow.", "zh": "丹中尉沿通道走着，布巴和福雷斯跟在后面。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "So, you boys are from Arkansas, huh? Well, I've been through there. Little Rock's a fine town. Now, go shake down your gear, see the platoon sergeant, draw what you need for the field.", "zh": "这么说，你们俩是阿肯色来的，嗯？我去过那儿，小石城是个不错的城市。好了，去整理装备，找副排长领野战需要的东西。"}, {"t": "a", "text": "Lt. Dan steps inside the latrine, still holding the roll of toilet paper.", "zh": "丹中尉走进厕所，手里还拿着那卷卫生纸。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "If you boys are hungry, we got steaks burnin' right here.", "zh": "你们俩要是饿了，这儿正烤着牛排呢。"}, {"t": "a", "text": "Lt. Dan sits down out of sight in the latrine, then stands up, looking at the boys.", "zh": "丹中尉在厕所里坐下，看不见人影，又站起来看着两个小伙子。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Two standing orders in this platoon. One, take good care of your feet. Two, try not to do anything stupid, like gettin' yourself killed.", "zh": "这个排有两条长期命令。第一，照顾好你们的脚。第二，尽量别干蠢事，比如把自己的命弄丢了。"}, {"t": "a", "text": "Lt. Dan sits back down out of sight in the latrine. Bubba and Forrest look at each other.", "zh": "丹中尉又坐回厕所里。布巴和福雷斯对视一眼。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I sure hope I don't let him down.", "zh": "我真希望自己不会让他失望。"}]}, {"index": 69, "title": "EXT. RICE FIELD - ANOTHER DAY", "blocks": [{"t": "a", "text": "Forrest, Bubba, and other soldiers in the Fourth Platoon walk across the rice field. Some Vietnamese rice farmers are working as the soldiers walk past.", "zh": "福雷斯、布巴和四排的其他士兵穿过稻田。一些越南稻农正在干活，士兵们从旁走过。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I got to see a lot of countryside. We would take these real long walks.", "zh": "我看到了很多乡下风光。我们要走好多好多的路。"}]}, {"index": 70, "title": "EXT. JUNGLE/DIRT ROAD - ANOTHER DAY", "blocks": [{"t": "a", "text": "Forrest's unit walks along a dirt road.", "zh": "福雷斯所在的部队沿土路行进。"}, {"t": "d", "speaker": "SONG", "note": "", "text": "And we were always lookin' for this guy named Charlie. I can't get no relief.", "zh": "我们还一直在找一个叫“查理”的家伙。我片刻不得安宁。"}, {"t": "a", "text": "Suddenly Lt. Dan holds up his fist, a signal for the unit to stop. He motions for them to get down.", "zh": "突然，丹中尉举起拳头，示意部队停下，又打手势让他们卧倒。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Hold it up!", "zh": "停下！"}, {"t": "d", "speaker": "SGT. SIMS", "note": "", "text": "Hold up, boys!", "zh": "卧倒，弟兄们！"}, {"t": "a", "text": "Forrest gets down and looks around.", "zh": "福雷斯趴下，四下张望。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It wasn't always fun. Lt. Dan always gettin' these funny feelings about a rock or a trail, or the road, so he'd tell you to get down, shut up!", "zh": "也不总是好玩的。丹中尉总对一块岩石、一条小径或是马路产生奇怪的预感，然后就叫你卧倒、闭嘴！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get down! Shut up!", "zh": "卧倒！闭嘴！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So we did.", "zh": "我们就照做。"}, {"t": "a", "text": "Lt. Dan motions for the lead soldier to get down. Lt. Dan crouches down. Lt. Dan looks at the soldiers and points to his eyes. He lies down on the dirt road and crawls.", "zh": "丹中尉示意打头的士兵卧倒，自己蹲下来，指着自己的眼睛示意，然后趴在土路上匍匐前进。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, I don't know much about anything, but I think some of American's best young men served in this war. There was Dallas, from Phoenix. Cleveland, he was from Detroit.", "zh": "我对很多事都不太懂，但我觉得美国最优秀的一些年轻人参加了这场战争。有来自菲尼克斯的达拉斯。来自底特律的克利夫兰。"}, {"t": "d", "speaker": "CLEVELAND", "note": "", "text": "Hey, Tex. Hey, Tex. Man, what the hell's going on?", "zh": "嘿，特克斯。嘿，特克斯。伙计，到底怎么回事？"}, {"t": "a", "text": "Tex holds up his hand, motioning that he doesn't know.", "zh": "特克斯举起手，示意他也不知道。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And Tex was, well, I don't remember where Tex come from.", "zh": "至于特克斯嘛，嗯，我不记得特克斯是哪儿人了。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Ah, nothin'. Fourth Platoon, on your feet! Still got ten clicks to go to that river.", "zh": "啊，没事。四排，起立！到那条河还有十公里。"}, {"t": "a", "text": "Forrest stands up and begins to walk with the platoon.", "zh": "福雷斯站起来，跟着队伍出发。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "All right, move out! Comin' out. Look alive out there.", "zh": "好了，出发！出来了。都精神点。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "The good thing about Vietnam is there was always someplace to go.", "zh": "在越南的好处是，总有地方可去。"}, {"t": "d", "speaker": "LT. DAN", "note": "V.O.", "text": "Fire in the hole!", "zh": "洞里有手雷！"}]}, {"index": 71, "title": "EXT. VIETNAM/VIET CONG FOXHOLE - ANOTHER DAY", "blocks": [{"t": "a", "text": "Lt. Dan walks away as Forrest rushes over, aims two pistols in the hole, then climbs inside.", "zh": "丹中尉走开，福雷斯冲过去，双手持枪对着洞口，然后钻了进去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And there was always something to do.", "zh": "而且总有事情可做。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Mount 'em up.", "zh": "上车。"}, {"t": "d", "speaker": "SGT. SIMS", "note": "", "text": "Spread out! Cover his back.", "zh": "散开！掩护他背后。"}, {"t": "a", "text": "ANOTHER DAY - The platoon walks through a rice paddy, waits deep in water. It begins to rain.", "zh": "又一天——排里的士兵穿过稻田，在深水里待命。开始下雨了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "One day it started raining, and it didn't quit for four months.", "zh": "有一天开始下雨，一连下了四个月都没停。"}]}, {"index": 72, "title": "EXT. JUNGLE", "blocks": [{"t": "a", "text": "The rain pours down on Forrest and Bubba as they sit in a foxhole.", "zh": "福雷斯和布巴坐在散兵坑里，大雨倾盆。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "We been through every kind of rain there is. Little bitty stingin' rain...", "zh": "我们经历了各种各样的雨。细细的、扎人的雨……"}, {"t": "a", "text": "ANOTHER DAY - The platoon walks through the jungle as rain pours down on them.", "zh": "又一天——部队在倾盆大雨中穿过丛林。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...and big ol' fat rain.", "zh": "……还有又大又肥的雨。"}, {"t": "a", "text": "ANOTHER DAY - The platoon shelters themselves as they walk through the wind and rain.", "zh": "又一天——部队在风雨中艰难前行，缩着身子躲雨。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Rain that flew in sideways.", "zh": "横着飞过来的雨。"}, {"t": "a", "text": "ANOTHER DAY - Forrest and other soldiers walk chest-deep through a river. The rain splatters back up from the river, hitting the soldiers. Forrest holds his hand up to protect his face.", "zh": "又一天——福雷斯和其他士兵齐胸深地涉过河流，雨点从河面反弹起来打在士兵身上。福雷斯抬手护着脸。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And sometimes rain even seemed to come straight up from underneath.", "zh": "有时候，雨甚至像是直接从脚底下冒上来的。"}]}, {"index": 73, "title": "EXT. ENCAMPMENT - NIGHT", "blocks": [{"t": "a", "text": "The rain pours down on the men of the platoon as they sit in a camp. Bubba sits down next to Forrest.", "zh": "大雨浇在营地坐着的士兵们身上。布巴在福雷斯身边坐下。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Shoot, it even rained at night.", "zh": "好家伙，连晚上都下雨。"}, {"t": "a", "text": "Bubba leans his back up against Forrest's back.", "zh": "布巴把背靠在福雷斯背上。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Hey Forrest...", "zh": "嘿，福雷斯……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey Bubba...", "zh": "嘿，布巴……"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I'm gonna lean up against you, you just lean right back against me.", "zh": "我靠着你，你也靠着我。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "This way, we don't have to sleep with our heads in the mud. You know why we a good partnership, Forrest? 'Cause we be watchin' out for one another. Like brothers and stuff. Hey, Forrest, there's somethin' I've been thinkin' about. I got a very important question to ask you. How would you like to go into the shrimpin' business with me?", "zh": "这样我们睡觉就不用把头埋在泥里了。你知道我们为什么是好搭档吗，福雷斯？因为我们互相照应，就像兄弟一样。嘿，福雷斯，有件事我一直在想。我有个很重要的问题要问你：你愿不愿意和我合伙干捕虾这一行？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "好啊。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Man, I tell you what, I got it all figured out, too. So many pounds of shrimp to pay off the boat, so many pounds for gas, we can just live right on the boat. We ain't got to pay no rent. I'll be the captain; we can just work it together. Split everything right down the middle. Man, I'm tellin' you, fifty-fifty. And, hey, Forrest, all the shrimp you can get.", "zh": "伙计，告诉你，我全都盘算好了。多少磅虾用来还船钱，多少磅用来付油钱，我们就住在船上，不用付房租。我当船长，我们一起干，所有东西对半分。伙计，我说真的，五五分。而且，嘿，福雷斯，捕到的虾全归你。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "That's a fine idea.", "zh": "真是个好主意。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Bubba did have a fine idea.", "zh": "布巴确实出了个好主意。"}, {"t": "a", "text": "ANOTHER NIGHT - Some soldiers patrol the area. Forrest lies in a pup tent and writes a litter as the rain pours down. He uses his flashlight to see.", "zh": "又一个夜晚——一些士兵在巡逻。福雷斯躺在单兵帐篷里，就着雨声写一封信，用手电筒照明。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I even wrote Jenny and told her all about it. I sent her letters. Not every day, but almost. I told her what I was doin' and asked her what she was doing, and I told her how I thought about her always.", "zh": "我甚至写信给珍妮，把这事全告诉了她。我给她寄信，不是每天，但差不多。我告诉她我在做什么，问她在做什么，还告诉她我一直一直都在想她。"}]}, {"index": 74, "title": "EXT. JENNY'S GRANDMOTHER'S TRAILER - DAY", "blocks": [{"t": "a", "text": "Jenny steps out of the trailer with a backpack and a guitar.", "zh": "珍妮背着背包、拎着吉他走出拖车屋。"}, {"t": "a", "text": "She hugs a hippie guy, then jumps into the back of a Volkswagen bus with another guy.", "zh": "她拥抱了一个嬉皮士，然后和另一个家伙跳上一辆大众面包车的后厢。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And how I was looking forward to getting a letter from her just as soon as she had the time I'd always let her know that I was okay.", "zh": "我盼着她一有空就给我回信。每次我都告诉她我一切都好。"}]}, {"index": 75, "title": "EXT. VIETNAM - NIGHT", "blocks": [{"t": "a", "text": "Forrest writes a letter in his tent.", "zh": "福雷斯在帐篷里写信。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Then I'd sign each letter, \"Love, Forrest Gump.\"", "zh": "每封信的结尾我都写上：“爱你的，福雷斯·甘。”"}]}, {"index": 76, "title": "EXT. JUNGLE - DAY", "blocks": [{"t": "a", "text": "The Fourth Platoon makes their way through the jungle and rain.", "zh": "四排在雨中穿行于丛林。"}, {"t": "d", "speaker": "SONG", "note": "", "text": "\"There's something happenin' here. What it is ain't exactly clear. There's a man with a gun over there, telling' me I got to beware.\"", "zh": "“这里正在发生一些事。究竟是什么还不太清楚。那边有个拿枪的男人，告诉我必须小心提防。”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "This one day, we was out walking, like always, and then, just like that, somebody turned off the rain and the sun come out.", "zh": "有一天，我们像往常一样行军，然后，就那么突然，有人关掉了雨，太阳出来了。"}, {"t": "a", "text": "Forrest looks up as the sun suddenly appears. Forrest's platoon is attacked. A bullet kills the soldier standing next to Forrest. Bombs explode all around as the soldiers scramble to the ground.", "zh": "福雷斯抬头看突然出现的太阳。部队遭到了袭击。一颗子弹打死了站在福雷斯身旁的士兵。炸弹在四周爆炸，士兵们纷纷扑倒在地。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Take cover!", "zh": "隐蔽！"}, {"t": "a", "text": "Forrest crawls over a berm as bullets fly overhead and explode all around him. Forrest rolls over and pulls his pack off Lt. Dan lies next to Forrest.", "zh": "福雷斯爬过一道土埂，子弹从头顶呼啸而过，四周爆炸声不断。福雷斯翻身卸下背包。丹中尉在他身旁趴下。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Get that pig up here, goddammit!", "zh": "把机枪抬上来，该死的！"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Forrest, you okay?", "zh": "福雷斯，你没事吧？"}, {"t": "a", "text": "Two soldiers with a machine gun fire into the jungle. Lt. Dan shouts into the radio. Forrest begins firing his weapon into the jungle.", "zh": "两名士兵架着机枪朝丛林里射击。丹中尉对着无线电大喊。福雷斯开始朝丛林里开火。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "...Strongarm, please be advised...", "zh": "……铁腕，请注意……"}, {"t": "a", "text": "Two soldiers pull a wounded soldier into the jungle.", "zh": "两名士兵把一名伤兵拖进丛林。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Medic, we got a man down!", "zh": "医务兵，有人倒下了！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Strongarm, this is Leg Lima 6, over!", "zh": "铁腕，这里是莱格·利马六号，完毕！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Roger, Strongarm, be advised we have incoming from the treeline at point blue plus two. A.K's and rockets...", "zh": "收到，铁腕，请注意，蓝点加二位置的林线有来敌火力，AK 和火箭筒……"}, {"t": "a", "text": "The machine gunner fires into the treeline. Another soldier helps him with the ammunition. The machine gun jams.", "zh": "机枪手朝林线射击，另一名士兵帮他递弹药。机枪卡壳了。"}, {"t": "d", "speaker": "SOLDIER WITH BIG MACHINE GUN", "note": "", "text": "Misfire! Misfire!", "zh": "卡壳了！卡壳了！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Goddammit, Mac! Get that pig unfucked and get it in the treeline!", "zh": "该死的，麦克！把这破机枪弄好，给我朝林线打！"}, {"t": "a", "text": "A rocket explodes on the machine gunner and the other soldier, killing them. Forrest looks down and covers his head as rockets explodes all around him.", "zh": "一发火箭弹在机枪手和另一名士兵身旁爆炸，两人阵亡。火箭弹在四周炸开，福雷斯低下头抱住脑袋。"}, {"t": "d", "speaker": "LT. DAN", "note": "into radio", "text": "Ah, Jesus! My unit is down hard and hurting! 6 pulling back to the blue line, Leg Lima 6 out! Pull back! Pull back!", "zh": "啊，上帝！我的部队伤亡惨重！六号撤向蓝线，莱格·利马六号完毕！撤退！撤退！"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Forrest! Run! Run, Forrest!", "zh": "福雷斯！跑！跑啊，福雷斯！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Pull back!", "zh": "撤退！"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Forrest! Run! Run, Forrest! Run! Run!", "zh": "福雷斯！跑！跑啊，福雷斯！跑！跑！"}, {"t": "d", "speaker": "SGT. SIMS", "note": "", "text": "Pull back! Let's go!", "zh": "撤退！快走！"}, {"t": "a", "text": "Lt. Dan gets up and grabs Forrest by the collar.", "zh": "丹中尉起身抓住福雷斯的衣领。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Run, goddammit, run!", "zh": "跑，该死的，快跑！"}, {"t": "a", "text": "The platoon gets up and runs toward the cover of the jungle.", "zh": "全排起身朝丛林的掩蔽处跑去。"}, {"t": "a", "text": "Rockets explode all around the field. Forrest runs into the jungle. The soldiers run through the jungle as bullets explode all around. A soldier is blown up by a rocket. A soldier runs through the jungle. Forrest runs past the soldier.", "zh": "火箭弹在田野四周爆炸。福雷斯跑进丛林。士兵们在枪林弹雨中穿行，一名士兵被火箭弹炸飞。一个士兵跑过丛林，福雷斯从他身旁跑过。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Medic! Medic! Jesus, can I get a medic?", "zh": "医务兵！医务兵！老天，能不能来个医务兵？"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I ran and ran, just like Jenny told me to.", "zh": "我跑啊跑，就照珍妮说的做。"}, {"t": "a", "text": "Rockets explode in the jungle as Forrest runs out toward a clearing.", "zh": "火箭弹在丛林里炸开，福雷斯跑到一片空地。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I ran so far and so fast that pretty soon I was all by myself, which was a bad thing.", "zh": "我跑得又远又快，很快就只剩我一个人了，这可不妙。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Bubba!", "zh": "布巴！"}, {"t": "a", "text": "Forrest turns around, then runs back into the jungle.", "zh": "福雷斯转身，又跑回丛林。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Bubba was my best good friend. I had to make sure he was okay.", "zh": "布巴是我最好的朋友。我必须确认他没事。"}, {"t": "a", "text": "Rockets explode in the jungle. Forrest runs back into the jungle to look for Bubba.", "zh": "丛林里爆炸不断，福雷斯跑回去找布巴。"}, {"t": "d", "speaker": "1ST SOLDIER", "note": "", "text": "Any friendlies out there?", "zh": "那边有自己人吗？"}, {"t": "d", "speaker": "2ND SOLDIER", "note": "", "text": "Yeah, I've got three over there.", "zh": "有，我那边有三个。"}, {"t": "d", "speaker": "1ST SOLDIER", "note": "", "text": "Where the hell are you?", "zh": "你到底在哪儿？"}, {"t": "a", "text": "Forrest stops and aims his weapon. He looks around, scared.", "zh": "福雷斯停下举枪瞄准，惊恐地四下张望。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Bubba?", "zh": "布巴？"}, {"t": "a", "text": "Something moves. Forrest turns and looks, then rushes over.", "zh": "有什么东西动了一下。福雷斯转头看去，随即冲了过去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And on my way back to find Bubba, well, there was this boy laying on the ground.", "zh": "在我回去找布巴的路上，地上躺着一个弟兄。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Tex!", "zh": "特克斯！"}, {"t": "a", "text": "Tex lies on the ground, his face distorted with pain.", "zh": "特克斯躺在地上，脸因痛苦而扭曲。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay.", "zh": "没事了。"}, {"t": "a", "text": "Forrest reaches down and picks up Tex from the ground. Forrest pulls Tex up over his shoulder, then runs.", "zh": "福雷斯俯身把特克斯从地上扶起来，扛到肩上，拔腿就跑。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I couldn't just let him lay there all alone, scared the way he was, so I grabbed him up and run him out of there.", "zh": "我不能让他一个人吓成那样躺在那儿，就把他扛起来，跑出了那片地方。"}, {"t": "a", "text": "Forrest carries Tex out of the jungle and into the clearing.", "zh": "福雷斯扛着特克斯走出丛林，来到空地上。"}, {"t": "a", "text": "He sets Tex down on the bank of a river, and runs back into the jungle.", "zh": "他把特克斯放在河边，又跑回丛林。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And every time I went back looking for Bubba, somebody else was saying, \"Help me, Forrest. Help me.\"", "zh": "每次我回去找布巴，总有人对我说：“救救我，福雷斯。救救我。”"}, {"t": "a", "text": "Forrest drops another wounded soldier down at the bank of the river next to Tex, and then runs back toward the jungle.", "zh": "福雷斯把另一名伤兵放在河边特克斯身旁，又转身跑回丛林。"}, {"t": "a", "text": "Forrest grabs the third wounded soldier up from the ground and turns him over. It is DALLAS.", "zh": "福雷斯从地上架起第三名伤兵，把他翻过来——是达拉斯。"}, {"t": "d", "speaker": "DALLAS", "note": "", "text": "Can't hear... Can't hear...", "zh": "听不见……听不见了……"}, {"t": "a", "text": "Dallas is dropped off at the bank next to the other wounded soldiers. Forrest turns to go back to the jungle.", "zh": "达拉斯被放在河边其他伤兵身旁。福雷斯转身要回丛林。"}, {"t": "d", "speaker": "2ND WOUNDED SOLDIER", "note": "", "text": "No sweat, man. Just lay back. You're gonna be okay. You're gonna be okay.", "zh": "没事的，伙计。躺着别动。你会没事的。你会没事的。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I started to get scared that I might never find Bubba.", "zh": "我开始害怕，怕自己永远找不到布巴。"}, {"t": "d", "speaker": "STRONGARM", "note": "over radio", "text": "You're danger close for crack air, over.", "zh": "你们离空袭火力太近了，完毕。"}, {"t": "a", "text": "Forrest trips over something and falls to the ground. He looks up to find two bloody legs. It is Lt. Dan, who is wounded. He speaks into the radio.", "zh": "福雷斯被什么东西绊倒在地，抬头看见两条血淋淋的腿——是负伤的丹中尉，他正对着无线电说话。"}, {"t": "d", "speaker": "LT. DAN", "note": "into radio", "text": "Roger, Strongarm, I know my position is danger close! We got Charlie all over this area! I gotta have those fast movers in here now! Over!", "zh": "收到，铁腕，我知道我的位置离火力太近了！这一带到处都是越共！我要喷气机立刻过来！完毕！"}, {"t": "d", "speaker": "STRONGARM", "note": "over radio", "text": "Six, Strongarm, we want...", "zh": "六号，铁腕，我们要……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan, Coleman's dead!", "zh": "丹中尉，科尔曼死了！"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "I know he's dead! My whole goddamned platoon is wiped out!", "zh": "我知道他死了！我他妈的整个排都完了！"}, {"t": "d", "speaker": "STRONGARM", "note": "over radio", "text": "Leg Lima 6, Leg Lima 6, how copy you this transmission? Over.", "zh": "莱格·利马六号，莱格·利马六号，收到请回答？完毕。"}, {"t": "a", "text": "Forrest tries to pick up Lt. Dan, who tries to push Forrest away.", "zh": "福雷斯想把丹中尉架起来，丹中尉却想把他推开。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Goddammit! What are you doing? Leave me here! Get away. Just leave me here! Get out!", "zh": "该死的！你干什么？把我留在这儿！走开。把我留在这儿！你快走！"}, {"t": "a", "text": "Forrest pulls Lt. Dan over his shoulder and runs through the jungle.", "zh": "福雷斯把丹中尉扛到肩上，穿过丛林奔跑。"}, {"t": "d", "speaker": "STRONGARM", "note": "", "text": "Leg Lima 6, Leg Lima 6. This is Strongarm, be advised, your fast movers are inbound at this time, over.", "zh": "莱格·利马六号，莱格·利马六号。这里是铁腕，请注意，支援的喷气机正在飞往你处，完毕。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Then it felt like something just jumped up and bit me.", "zh": "接着，感觉就像有什么东西跳起来咬了我一口。"}, {"t": "a", "text": "Forrest falls down.", "zh": "福雷斯摔倒在地。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Ah, something bit me!", "zh": "啊，有东西咬我！"}, {"t": "a", "text": "Forrest gets up as Lt. Dan yells. Lt. Dan fires his pistol at the unseen enemy as Forrest pulls him away.", "zh": "福雷斯爬起来，丹中尉大喊着朝看不见的敌人开枪，福雷斯拖着他跑。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "You dink son-of-a-bitch! I can't leave the platoon! I told you to leave me there, Gump. Forget about me. Get yourself out! Did you hear what I said! Goddammit, pull me down! Get your ass out of here!", "zh": "你这越南狗娘养的！我不能丢下我的排！我叫你把我留在那儿，甘。别管我。你自己走！听见没有！该死的，把我放下！你给我滚出去！"}, {"t": "a", "text": "Forrest drops Lt. Dan down at the bank, next to the other wounded soldiers. Lt. Dan grabs Forrest by the shirt, angry.", "zh": "福雷斯把丹中尉放在河边其他伤兵身旁。丹中尉愤怒地揪住福雷斯的衣服。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "I didn't ask you to pull me out of there, goddamn you! What the hell do you think you're going?", "zh": "我没叫你把我从那儿拖出来，你这该死的！你以为你在干什么？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "To get Bubba.", "zh": "去找布巴。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "I got an air strike inbound right now. They're gonna nape the whole area.", "zh": "我呼叫的空袭马上就到，他们要把整个地区都烧了。"}, {"t": "a", "text": "Forrest gets up and runs as Lt. Dan yells after him.", "zh": "福雷斯起身就跑，丹中尉在后面喊。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Gump, you stay here, goddammit! That's an order!", "zh": "甘，你给我待在这儿，该死的！这是命令！"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I gotta find Bubba!", "zh": "我要找到布巴！"}, {"t": "a", "text": "Forrest runs through the jungle searching for Bubba. Forrest slows down and looks around carefully.", "zh": "福雷斯穿过丛林寻找布巴。他放慢脚步，仔细地四处张望。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Forrest...", "zh": "福雷斯……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Bubba...", "zh": "布巴……"}, {"t": "a", "text": "Bubba looks up as he lies on the ground.", "zh": "布巴躺在地上，抬起头。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I'm okay.", "zh": "我没事。"}, {"t": "a", "text": "Bubba holds a palm frond over his wound. Forrest removes the frond to look at the wound. Bubba's chest has been blown open.", "zh": "布巴用一片棕榈叶盖着伤口。福雷斯移开叶子看伤口——布巴的胸膛已经被炸开。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Oh, Bubba, no...", "zh": "哦，布巴，不……"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Naw, I'm gonna be all right.", "zh": "没事，我会好的。"}, {"t": "a", "text": "Forrest looks around as he hear the voices of the enemy.", "zh": "听到敌人的声音，福雷斯四下张望。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Come on. Come on. Come here...", "zh": "快。快。过来……"}, {"t": "a", "text": "Forrest carries Bubba through the jungle. The sound of approaching planes fills the air.", "zh": "福雷斯抱着布巴穿过丛林，空中传来飞机逼近的声音。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I'm okay, Forrest. I'm all right.", "zh": "我没事，福雷斯。我没事。"}, {"t": "a", "text": "The roar of approaching planes is deafening. Forrest looks up in fear. Three planes dive down toward the jungle. They fire napalm as the jungle explodes with massive fireballs.", "zh": "逼近的机声震耳欲聋。福雷斯恐惧地抬头。三架飞机朝丛林俯冲，投下凝固汽油弹，丛林里炸开一个个巨大的火球。"}, {"t": "a", "text": "Forrest runs, carrying Bubba. The fireballs explode behind him. The entire jungle area is in flames as Forrest runs.", "zh": "福雷斯抱着布巴奔跑，火球在身后炸开。整片丛林陷入火海。"}, {"t": "a", "text": "Forrest carries Bubba to the bank of the river. Lt. Dan and the other wounded soldiers wait for a rescue helicopter.", "zh": "福雷斯把布巴抱到河边。丹中尉和其他伤兵在等救援直升机。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Helo's inbound. Pop smoke, get it up there!", "zh": "直升机来了！放烟幕弹，把烟点起来！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "If I'd a known this was gonna be the last time me and Bubba was gonna talk, I'd a thought of something better to say.", "zh": "早知道这是我和布巴最后一次说话，我会想出些更好的话来说。"}, {"t": "a", "text": "Forrest looks down at Bubba. A soldier releases a smoke canister.", "zh": "福雷斯低头看着布巴。一名士兵拉响了烟雾罐。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hey, Bubba...", "zh": "嘿，布巴……"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "Hey, Forrest. Forrest, why'd this happen?", "zh": "嘿，福雷斯。福雷斯，为什么会发生这种事？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You got shot.", "zh": "你中弹了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Then Bubba said something I won't even forget.", "zh": "然后布巴说了一句我永远不会忘记的话。"}, {"t": "d", "speaker": "BUBBA", "note": "", "text": "I wanna go home.", "zh": "我想回家。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Bubba was my best good friend. And even I know that ain't something you can find just around the corner. Bubba was gonna be a shrimpin' boat captain, but instead he died right there by that river in Vietnam.", "zh": "布巴是我最好的朋友。连我都知道，这样的朋友不是随便就能找到的。布巴本来要当捕虾船船长，可他却死在了越南那条河边。"}, {"t": "a", "text": "The helicopter fly overhead.", "zh": "直升机从头顶飞过。"}, {"t": "a", "text": "BUS STATION - DAY", "zh": "公交站——白天。"}, {"t": "a", "text": "Forrest continues with his life story. A MAN is sitting next to Forrest on the bus bench.", "zh": "福雷斯继续讲他的故事。一个男人坐在长椅上他旁边。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "That's all I have to say about that.", "zh": "关于那件事，我要说的就这么多。"}, {"t": "d", "speaker": "MAN", "note": "", "text": "It was a bullet, wasn't it?", "zh": "是颗子弹，对吧？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "A bullet?", "zh": "子弹？"}, {"t": "d", "speaker": "MAN", "note": "", "text": "That jumped up and bit you.", "zh": "跳起来咬了你一口。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Oh, yes sir. Bit me directly in the buttocks. They said it was a million dollar wound, but the Army must keep that money, 'cause I still ain't seen a nickel of that million dollars. The only good thing about being wounded in the buttocks...", "zh": "哦，是的，先生。正好咬在屁股上。他们说这是“价值百万的伤”，可军队肯定把那笔钱扣下了，因为那一百万美元我一个子儿都没见着。屁股中弹唯一的好处……"}, {"t": "a", "text": "FLASHBACK - INT. US. ARMY HOSPITAL/VIETNAM - DAY", "zh": "闪回——美国陆军医院（越南）内景——白天。"}, {"t": "a", "text": "Forrest holds two ice cream cones in his hands as he is wheeled on a rolling stretcher.", "zh": "福雷斯躺在轮式担架上被推着走，手里拿着两个冰淇淋蛋筒。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...is the ice cream. They gave me all the ice cream I could eat. And guess what. A good friend of mine was in the bed right next door.", "zh": "……就是冰淇淋。他们给我吃了个够。你猜怎么着，我的一个好朋友就躺在隔壁床上。"}, {"t": "a", "text": "Forrest, lying on his stomach, is wheeled to his bed.", "zh": "福雷斯趴着被推到床边。"}, {"t": "a", "text": "Forrest's butt sticks up and is bandaged. Forrest looks at Lt. Dan lying on the bed. Forrest holds out an ice cream cone for Lt. Dan.", "zh": "他的屁股翘着，缠着绷带。福雷斯看着躺在床上的丹中尉，递给他一个冰淇淋蛋筒。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Lieutenant Dan, I got you some ice cream. Lieutenant Dan, ice cream.", "zh": "丹中尉，我给你拿了点冰淇淋。丹中尉，冰淇淋。"}, {"t": "a", "text": "Lt. Dan, annoyed, takes the ice cream cone and drops it into his bed pan. Forrest slides himself onto his bed. A NURSE reaches toward Lt. Dan.", "zh": "丹中尉烦躁地接过蛋筒，丢进了便盆里。福雷斯挪到自己床上。一名护士朝丹中尉走来。"}, {"t": "d", "speaker": "MALE NURSE", "note": "", "text": "It's time for your bath, Lieutenant.", "zh": "中尉，该洗澡了。"}, {"t": "a", "text": "The male nurse places Lt. Dan's hands on a pull-up bar, then picks up Lt. Dan, whose legs have been amputated.", "zh": "男护士把丹中尉的手放到牵引杆上，把他抱起来——他的双腿已经截肢。"}, {"t": "d", "speaker": "MALE NURSE", "note": "", "text": "Harper...", "zh": "哈珀……"}, {"t": "a", "text": "Another nurse wheels the rolling bed under Lt. Dan. The male nurse sets Lt. Dan down on the rolling bed. Forrest looks up at Lt. Dan as he is wheeled away. A soldier reads the names from a pile of letters.", "zh": "另一名护士把轮床推到丹中尉身下，男护士把他放到轮床上推走，福雷斯抬头看着。一个士兵从一堆信里念名字。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Cooper, Larson, Webster, Gump, Gump...", "zh": "库珀、拉森、韦伯斯特、甘、甘……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm Forrest Gump.", "zh": "我是福雷斯·甘。"}, {"t": "a", "text": "The soldier hands Forrest a large pile of letters.", "zh": "士兵把一大摞信递给福雷斯。"}, {"t": "a", "text": "\"Undeliverable as addressed. No forwarding order on file.\"", "zh": "“地址查无此人，无转寄记录。”"}, {"t": "a", "text": "Jenny Curran Rural Route 2 Greenbow, Ala. 39902 Forrest looks down at the pile of letters.", "zh": "珍妮·柯伦，乡村二号邮路，绿弓镇，亚拉巴马州，39902。福雷斯低头看着那摞信。"}]}, {"index": 77, "title": "INT. ARMY HOSPITAL/VIETNAM - DAY", "blocks": [{"t": "a", "text": "A group of wounded soldiers hang out in the hospital, recuperating. Forrest sits and watches \"Gomer Pyle\" on the television.", "zh": "一群伤兵在医院里养伤。福雷斯坐着看电视里的《戈默·派尔》。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Gump, how can you watch that stupid shit? Turn it off!", "zh": "甘，这种蠢玩意儿你怎么看得下去？关掉！"}, {"t": "d", "speaker": "ANNOUNCER", "note": "", "text": "From the D.M.Z. to the Delta, you are tuned to the American Forces Vietnam Network. This is Channel 6, Saigon.", "zh": "从非军事区到湄公河三角洲，您收听的是驻越美军广播网。这里是西贡六频道。"}, {"t": "a", "text": "Forrest turns the TV off and he is hit on the back of the head by a ping-pong ball.", "zh": "福雷斯关掉电视，一个乒乓球打中了他的后脑勺。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Good catch, Gump. You know how to play this?", "zh": "接得好，甘。会打这个吗？"}, {"t": "a", "text": "Forrest shakes his head.", "zh": "福雷斯摇摇头。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Come on, let me show you. Here.", "zh": "来，我教你。拿着。"}, {"t": "a", "text": "The wounded ping-pong player hands Forrest a paddle. Forrest and the wounded ping-pong player step toward the ping-pong table.", "zh": "受伤的乒乓球手递给福雷斯球拍，两人走向乒乓球台。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "Now the secret to this game is, no matter what happens, never, never take your eye off the ball.", "zh": "这个游戏的秘诀是：不管发生什么，眼睛永远、永远不要离开球。"}, {"t": "a", "text": "He holds the ball up and moves it back and forth. Forrest keeps his eyes on the ball.", "zh": "他举起球来回移动，福雷斯的眼睛紧紧盯着球。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "All right...", "zh": "好……"}, {"t": "a", "text": "The wounded ping-pong player tosses the ball down onto the table. Forrest begins to hit the ball back to the other player.", "zh": "伤兵把球抛到台上，福雷斯开始把球打回去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "For some reason, ping pong came very natural to me.", "zh": "不知为什么，乒乓球对我来说特别自然。"}, {"t": "d", "speaker": "SOLDIER", "note": "", "text": "See, any idiot can play.", "zh": "瞧，是个白痴都会打。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "So I started playing it all the time.", "zh": "于是我开始一刻不停地打。"}, {"t": "a", "text": "Forrest hits ping-pong balls.", "zh": "福雷斯击打着乒乓球。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I played ping-pong even when I didn't have anyone to play ping-pong with.", "zh": "哪怕没有人和我对打，我也打。"}, {"t": "a", "text": "The balls at land in a bed pan positioned on a chair. A group of wounded soldier sit and watch Forrest play with himself. Forrest hits two balls at a time against the opposite side of the table.", "zh": "球都落进放在椅子上的便盆里。一群伤兵坐着看福雷斯自己跟自己打，他一次朝对面打两个球。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "The hospital's people said it made me look like a duck in water, whatever that means. Even Lieutenant Dan would come and watch me play.", "zh": "医院里的人说我如鱼得水，不管那是什么意思。连丹中尉都会来看我打球。"}, {"t": "a", "text": "Lt. Dan stares out the window. Forrest lies in his bed asleep. A hand reaches and grabs him.", "zh": "丹中尉盯着窗外。福雷斯躺在床上睡着了，一只手伸过来抓住他。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I played ping-pong so much, I even played it in my sleep.", "zh": "我乒乓球打得太多，连睡觉都在打。"}, {"t": "a", "text": "Lt. Dan pulls Forrest to the floor, and holds Forrest down.", "zh": "丹中尉把福雷斯拖到地上按住。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Now, you listen to me. We all have a destiny. Nothing just happens, it's all part of a plan. I should have died out there with my men! But now, I'm nothing but a goddamned cripple! A legless freak. Look! Look! Look at me! Do you see that? Do you know what it's like not to be able to use your legs?", "zh": "你给我听着。每个人都有自己的命运。没有什么事是偶然发生的，一切都是计划的一部分。我本该和我的弟兄们一起死在战场上！可现在，我成了个该死的残废！一个没腿的怪物。看！看！看着我！看见了吗？你知道不能用腿走路是什么滋味吗？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well... Yes, sir, I do.", "zh": "这个……是的，长官，我知道。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Did you hear what I said? You cheated me. I had a destiny. I was supposed to die in the field! With honor! That was my destiny! And you cheated me out of it! You understand what I'm saying, Gump? This wasn't supposed to happen. Not to me. I had a destiny. I was Lieutenant Dan Tyler.", "zh": "你听见我说的话了吗？你骗走了我的命运。我有我的命运。我本该光荣地战死沙场！那才是我的命运！你把它从我手里骗走了！你明白我的意思吗，甘？这种事不该发生。不该发生在我身上。我有我的命运。我是丹·泰勒中尉。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yo-You're still Lieutenant Dan.", "zh": "你……你还是丹中尉啊。"}, {"t": "a", "text": "Lt. Dan looks at Forrest, lets go of Forrest and rolls.", "zh": "丹中尉看着福雷斯，松开手，转过轮椅。"}, {"t": "a", "text": "Lt. Dan sits up as Forrest looks at him.", "zh": "丹中尉坐起身，福雷斯看着他。"}, {"t": "d", "speaker": "LT. DAN", "note": "", "text": "Look at me. What am I gonna do now? What am I gonna do now?", "zh": "看看我。我现在该怎么办？我现在该怎么办？"}]}, {"index": 78, "title": "INT. REC ROOM/VIETNAM HOSPITAL - ANOTHER DAY", "blocks": [{"t": "a", "text": "Forrest plays ping-pong by himself. An OFFICER walks up to him.", "zh": "福雷斯自己一个人打乒乓球。一名军官走到他面前。"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "P.F.C. Gump?", "zh": "一等兵甘？"}, {"t": "a", "text": "Forrest immediately grabs the ball and places it down on the table under its paddle. Stands at attention.", "zh": "福雷斯立刻抓住球，把球压在球拍下的球台上，立正站好。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Yes, sir!", "zh": "是，长官！"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "As you were.", "zh": "稍息。"}, {"t": "a", "text": "The officer holds up an envelope.", "zh": "军官举起一个信封。"}, {"t": "d", "speaker": "OFFICER", "note": "", "text": "Son, you've been awarded the Medal of Honor.", "zh": "孩子，你被授予了荣誉勋章。"}]}, {"index": 79, "title": "INT. VIETNAM HOSPITAL WARD", "blocks": [{"t": "a", "text": "Forrest steps up to Lt. Dan's bed.", "zh": "福雷斯走到丹中尉的床边。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Guess what, Lieutenant Dan, they want to give me a me...", "zh": "你猜怎么着，丹中尉，他们要给我颁发勋……"}, {"t": "a", "text": "Forrest stops in mid-sentence as he looks down at the bed. A heavily bandaged soldier with bloodstains lies there. Forrest turns and look at the NURSE.", "zh": "话说到一半，福雷斯停住了。床上躺着一个缠满绷带、带着血迹的士兵。福雷斯转身问护士。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Ma'am, what'd they do with Lieutenant Dan?", "zh": "小姐，丹中尉他们怎么安排了？"}, {"t": "d", "speaker": "NURSE", "note": "", "text": "They sent him home.", "zh": "他被送回国了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Two weeks later, I left Vietnam.", "zh": "两周后，我离开了越南。"}]}, {"index": 80, "title": "INT. BARBER SHOP/GREENBOW - DAY", "blocks": [{"t": "d", "speaker": "ANCHORMAN", "note": "on T.V.", "text": "The ceremony was kicked off with a candid speech by the President regarding the need for further escalation of the war in Vietnam. President Johnson awarded four Medals of Honor to men from each of the Armed Services.", "zh": "颁奖典礼以总统一番坦率的演讲开场，他谈到有必要进一步升级越南战争。约翰逊总统向各军种的四名军人颁发了荣誉勋章。"}, {"t": "a", "text": "The television reveals Forrest as he is awarded the Medal of Honor by President Johnson.", "zh": "电视画面里，约翰逊总统为福雷斯佩戴荣誉勋章。"}, {"t": "d", "speaker": "PRESIDENT JOHNSON", "note": "", "text": "America owes you a debt of gratitude, son.", "zh": "美国欠你一份感激，孩子。"}, {"t": "a", "text": "Color footage revealing President Johnson as he places the award around Forrest's neck and shakes hands.", "zh": "彩色影像：约翰逊总统把勋章挂到福雷斯脖子上，与他握手。"}, {"t": "d", "speaker": "PRESIDENT JOHNSON", "note": "", "text": "I understand you were wounded. Where were you hit?", "zh": "我听说你负伤了。伤在哪儿？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "In the buttocks, sir.", "zh": "屁股上，长官。"}, {"t": "d", "speaker": "PRESIDENT JOHNSON", "note": "", "text": "Oh, that must be a sight.", "zh": "哦，那一定很值得一看。"}, {"t": "a", "text": "President Johnson leans and whispers into Forrest's ear.", "zh": "约翰逊总统凑到福雷斯耳边低语。"}, {"t": "d", "speaker": "PRESIDENT JOHNSON", "note": "", "text": "I'd kinda like to see that.", "zh": "我倒挺想看看。"}]}, {"index": 81, "title": "INT. BARBER SHOP", "blocks": [{"t": "a", "text": "The television revealing Forrest as he drops his pants, bends over and shows the bullet wound on his bare buttocks.", "zh": "电视画面里，福雷斯脱下裤子，弯下腰，露出光屁股上的枪伤。"}, {"t": "a", "text": "President Johnson looks down and smiles. The
