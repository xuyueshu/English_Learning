<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forrest Gump · Screenplay Study Edition</title>
<style>
:root {
  --bg: #f4f1ea;
  --panel: #fbf9f4;
  --paper: #fffdf8;
  --text: #2b2620;
  --text-soft: #6b6358;
  --border: #e3ddd0;
  --accent: #b3542f;
  --accent-soft: #f3e2d8;
  --mark: #ffe9a8;
  --shadow: 0 8px 30px rgba(80, 60, 30, .10);
  --serif: Georgia, "Times New Roman", "Songti SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-size: 18px;
  --line-height: 1.9;
}
[data-theme="dark"] {
  --bg: #16181d;
  --panel: #1d2026;
  --paper: #20242b;
  --text: #d8dce3;
  --text-soft: #9098a5;
  --border: #2e333d;
  --accent: #e08a5e;
  --accent-soft: #3a2c24;
  --mark: #6b5418;
  --shadow: 0 8px 30px rgba(0, 0, 0, .45);
}
[data-theme="sepia"] {
  --bg: #efe3d0;
  --panel: #f6ecdc;
  --paper: #faf2e4;
  --text: #433422;
  --text-soft: #8a765c;
  --border: #ddccb0;
  --accent: #9c5a22;
  --accent-soft: #ecd9c1;
  --mark: #f6df94;
  --shadow: 0 8px 30px rgba(120, 80, 30, .12);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  transition: background .25s, color .25s;
}
/* ---------- Top bar ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; align-items: center; gap: 12px;
  height: 58px; padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,.05);
}
.topbar .brand {
  font-family: var(--serif); font-weight: 700; font-size: 17px;
  white-space: nowrap; color: var(--text);
}
.topbar .brand small { color: var(--text-soft); font-weight: 400; font-size: 12px; margin-left: 6px; }
.icon-btn {
  border: 1px solid var(--border); background: transparent; color: var(--text);
  min-width: 38px; height: 38px; padding: 0 10px; border-radius: 10px;
  font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.icon-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.search-wrap { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 6px; margin-left: auto; }
.search-input {
  flex: 1; height: 38px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14px; outline: none; min-width: 0;
}
.search-input:focus { border-color: var(--accent); }
.search-count { font-size: 12px; color: var(--text-soft); white-space: nowrap; min-width: 44px; text-align: center; }
.spacer { flex: 1; }
/* ---------- Layout ---------- */
.sidebar {
  position: fixed; top: 58px; left: 0; bottom: 0; width: 300px; z-index: 40;
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: transform .25s ease;
}
.sidebar header {
  padding: 16px 18px 10px; font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-soft);
}
.scene-list { overflow-y: auto; padding: 0 8px 24px; flex: 1; }
.scene-item {
  display: block; width: 100%; text-align: left; padding: 9px 12px;
  border: none; background: transparent; color: var(--text-soft);
  border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1.45;
  font-family: var(--sans);
}
.scene-item .num { color: var(--accent); font-weight: 700; margin-right: 8px; font-size: 11px; }
.scene-item:hover { background: var(--accent-soft); color: var(--text); }
.scene-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.scene-item.active .num { color: var(--accent); }
.main { margin-left: 300px; padding: 82px 24px 120px; }
.article {
  max-width: 820px; margin: 0 auto; background: var(--paper);
  border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 56px 64px 80px;
  font-size: var(--font-size); line-height: var(--line-height);
}
/* ---------- Cover ---------- */
.cover { text-align: center; padding: 30px 0 50px; border-bottom: 1px dashed var(--border); margin-bottom: 36px; }
.cover .feather { font-size: 52px; line-height: 1; }
.cover h1 { font-family: var(--serif); font-size: 40px; margin: 14px 0 6px; letter-spacing: 2px; }
.cover .sub { color: var(--text-soft); font-size: 15px; margin: 4px 0; }
.cover .stats { margin-top: 18px; font-size: 13px; color: var(--text-soft); }
.cover .stats b { color: var(--accent); }
.cover .tips {
  margin: 26px auto 0; max-width: 560px; text-align: left;
  background: var(--accent-soft); border-radius: 12px; padding: 14px 18px;
  font-size: 13.5px; line-height: 1.9; color: var(--text);
}
.cover .tips kbd {
  background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
  padding: 0 6px; font-family: var(--sans); font-size: 12px;
}
/* ---------- Screenplay ---------- */
.scene { margin-bottom: 44px; scroll-margin-top: 80px; }
.scene-head {
  font-family: var(--mono, ui-monospace, Menlo, Consolas, monospace);
  font-size: .82em; font-weight: 700; letter-spacing: .08em;
  color: var(--accent); text-transform: uppercase;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 8px; margin-bottom: 18px;
  display: flex; align-items: baseline; gap: 10px;
}
.scene-head .scene-no {
  font-size: .75em; background: var(--accent); color: #fff;
  border-radius: 6px; padding: 2px 8px; letter-spacing: 0; flex-shrink: 0;
}
.block { position: relative; padding: 2px 0 2px 26px; }
.block.action { margin: 12px 0; color: var(--text); }
.block.dialogue { margin: 18px 0 18px 40px; }
.speaker {
  font-weight: 700; font-size: .86em; letter-spacing: .06em;
  display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
}
.speaker .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.speaker .note {
  font-weight: 400; font-size: .8em; color: var(--text-soft); letter-spacing: 0;
}
.line { font-family: var(--serif); }
.block.action .line { font-family: var(--sans); font-size: .95em; color: var(--text-soft); }
.zh-translation {
  display: none;
  margin: 7px 0 2px;
  padding: 8px 11px;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--accent-soft);
  color: var(--text);
  font-family: var(--sans);
  font-size: .82em;
  line-height: 1.75;
}
.block.action .zh-translation {
  color: var(--text-soft);
  background: transparent;
  border-left-color: var(--border);
  padding-left: 10px;
}
.block.show-zh > .zh-translation { display: block; }
body.translations-visible .zh-translation { display: block; }
body.translations-visible .block.hide-zh > .zh-translation { display: none; }
.zh-toggle {
  margin-top: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-soft);
  border-radius: 999px;
  min-width: 42px;
  height: 24px;
  padding: 0 10px;
  font-size: 12px;
  line-height: 22px;
  cursor: pointer;
  font-family: var(--sans);
}
.zh-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.block.show-zh .zh-toggle,
body.translations-visible .zh-toggle.on {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
body.translations-visible .block.hide-zh .zh-toggle {
  border-color: var(--border);
  color: var(--text-soft);
  background: transparent;
}
.star-btn {
  position: absolute; left: -2px; top: 5px; width: 22px; height: 22px;
  border: none; background: transparent; cursor: pointer; font-size: 14px;
  color: var(--border); opacity: 0; transition: opacity .15s, color .15s, transform .15s;
  padding: 0; line-height: 22px; text-align: center;
}
.block:hover .star-btn { opacity: 1; }
.star-btn:hover { transform: scale(1.25); color: #e0a526; }
.block.starred .star-btn { opacity: 1; color: #e0a526; }
.block.starred { background: rgba(224, 165, 38, .08); border-radius: 8px; }
body.dialogue-only .block.action { display: none; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
body.is-searching .block:not(.hit) { opacity: .18; }
.block.hit { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
/* ---------- Word popover ---------- */
.popover {
  position: absolute; z-index: 80; max-width: 360px; width: 320px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px;
  font-size: 14px; line-height: 1.6; display: none;
}
.popover.open { display: block; }
.popover .word { font-family: var(--serif); font-size: 22px; font-weight: 700; }
.popover .phonetic { color: var(--text-soft); margin-left: 8px; font-size: 13px; }
.popover .audio-btn {
  border: none; background: var(--accent-soft); color: var(--accent);
  border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 14px;
  margin-left: 6px; vertical-align: middle;
}
.popover .meaning { margin: 10px 0 0; padding-left: 18px; }
.popover .meaning li { margin-bottom: 6px; }
.popover .pos { color: var(--accent); font-style: italic; margin-right: 6px; }
.popover .example { color: var(--text-soft); font-size: 12.5px; display: block; margin-top: 2px; }
.popover .loading { color: var(--text-soft); padding: 6px 0; }
.popover .links { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.popover .links a, .popover .links button {
  font-size: 12.5px; padding: 6px 12px; border-radius: 8px; text-decoration: none;
  border: 1px solid var(--border); color: var(--text); background: transparent; cursor: pointer;
}
.popover .links a:hover, .popover .links button:hover { border-color: var(--accent); color: var(--accent); }
.popover .links button.saved { background: var(--accent); color: #fff; border-color: var(--accent); }
/* ---------- Drawer panels ---------- */
.overlay { position: fixed; inset: 58px 0 0 0; background: rgba(0,0,0,.35); z-index: 45; display: none; }
.overlay.show { display: block; }
.drawer {
  position: fixed; top: 58px; right: 0; bottom: 0; width: 380px; max-width: 92vw;
  z-index: 50; background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: var(--shadow); transform: translateX(105%); transition: transform .25s ease;
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer h2 { font-size: 15px; margin: 0; padding: 18px 20px 10px; }
.drawer .drawer-body { overflow-y: auto; padding: 0 20px 30px; flex: 1; }
.drawer .empty { color: var(--text-soft); font-size: 13.5px; text-align: center; padding: 40px 0; }
.saved-item {
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 10px; font-size: 13.5px; line-height: 1.6; background: var(--paper);
  position: relative; cursor: pointer;
}
.saved-item .meta { font-size: 11.5px; color: var(--accent); font-weight: 700; display: block; margin-bottom: 4px; }
.saved-item .del {
  position: absolute; top: 8px; right: 10px; border: none; background: transparent;
  color: var(--text-soft); cursor: pointer; font-size: 14px;
}
.saved-item .del:hover { color: #c0392b; }
.settings-row { margin: 18px 0; }
.settings-row label { font-size: 13px; color: var(--text-soft); display: block; margin-bottom: 8px; }
.settings-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
}
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.value-tag { float: right; color: var(--accent); font-weight: 700; }
/* ---------- Progress ---------- */
.progress { position: fixed; top: 58px; left: 300px; right: 0; height: 3px; z-index: 55; background: transparent; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--paper); padding: 10px 22px; border-radius: 20px;
  font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 90;
}
.toast.show { opacity: .92; transform: translateX(-50%) translateY(0); }
/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
  .article { padding: 40px 36px 60px; }
  .block.dialogue { margin-left: 16px; }
}
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: translateX(0); }
  .main { margin-left: 0; padding: 74px 12px 80px; }
  .progress { left: 0; }
  .article { padding: 28px 20px 50px; }
  .topbar .brand small { display: none; }
  .btn-label { display: none; }
  .cover h1 { font-size: 30px; }
}
@media print {
  .topbar, .sidebar, .progress, .popover, .drawer, .overlay, .star-btn, .zh-toggle, .toast { display: none !important; }
  .main { margin: 0; padding: 0; }
  .article { box-shadow: none; border: none; max-width: 100%; padding: 0; }
}
</style>
</head>
<body>

<nav class="topbar">
  <button class="icon-btn" id="navBtn" title="目录 (Ctrl+Shift+F)">☰</button>
  <div class="brand">Forrest Gump<small>Screenplay · English Study Edition</small></div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="search" placeholder="搜索台词 / Search…" autocomplete="off">
    <button class="icon-btn" id="searchPrev" title="上一个 (Shift+Enter)">↑</button>
    <button class="icon-btn" id="searchNext" title="下一个 (Enter)">↓</button>
    <span class="search-count" id="searchCount"></span>
  </div>
  <button class="icon-btn" id="translationToggle" title="显示或隐藏全部中文翻译">译<span class="btn-label" id="translationToggleLabel">显示译文</span></button>
  <button class="icon-btn" id="dialogueOnlyBtn" title="只看对白">💬<span class="btn-label">只看对白</span></button>
  <button class="icon-btn" id="favBtn" title="我的收藏与生词本">⭐<span class="btn-label">收藏</span><sup id="favBadge"></sup></button>
  <button class="icon-btn" id="settingsBtn" title="阅读设置">⚙</button>
</nav>

<div class="progress"><i id="progressBar"></i></div>

<aside class="sidebar">
  <header>Scenes · 场景导航</header>
  <div class="scene-list" id="sceneList"></div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <article class="article" id="article"></article>
</main>

<div class="popover" id="popover"></div>

<div class="drawer" id="favDrawer">
  <h2>⭐ 我的收藏 & 生词本</h2>
  <div class="drawer-body">
    <div class="seg" style="margin-bottom:14px">
      <button data-tab="lines" class="on">收藏句子</button>
      <button data-tab="words">生词本</button>
    </div>
    <div id="favLines"></div>
    <div id="favWords" style="display:none"></div>
  </div>
</div>

<div class="drawer" id="settingsDrawer">
  <h2>⚙ 阅读设置</h2>
  <div class="drawer-body">
    <div class="settings-row">
      <label>字号 Font size <span class="value-tag" id="fsVal"></span></label>
      <input type="range" id="fsRange" min="15" max="26" step="1">
    </div>
    <div class="settings-row">
      <label>行距 Line height <span class="value-tag" id="lhVal"></span></label>
      <input type="range" id="lhRange" min="1.5" max="2.6" step="0.1">
    </div>
    <div class="settings-row">
      <label>主题 Theme</label>
      <div class="seg" id="themeSeg">
        <button data-theme="light">浅色</button>
        <button data-theme="sepia">护眼</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>
    <div class="settings-row">
      <label>字体 Font（对白）</label>
      <div class="seg" id="fontSeg">
        <button data-font="serif">Serif</button>
        <button data-font="sans">Sans</button>
      </div>
    </div>
    <div class="settings-row">
      <button class="icon-btn" id="resetBtn" style="width:100%;justify-content:center">清除阅读设置与本地数据</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCREENPLAY_DATA = [{"index": 1, "title": "EXT. A SAVANNAH STREET - DAY (1981)", "blocks": [{"t": "a", "text": "A feather floats through the air. The falling feather.", "zh": "一根羽毛在空中飘浮。飘落的羽毛。"}, {"t": "a", "text": "A city, Savannah, is revealed in the background. The feather floats down toward the city below. The feather drops down toward the street below, as people walk past and cars drive by, and nearly lands on a man's shoulder.", "zh": "背景中渐渐显出一座城市——萨凡纳。羽毛朝下方的城市飘去。它飘向街道，行人和汽车从旁经过，羽毛险些落在一个男人的肩膀上。"}, {"t": "a", "text": "He walks across the street, causing the feather to be whisked back on its journey. The feather floats above a stopped car. The car drives off right as the feather floats down toward the street.", "zh": "那男人穿过马路，带起的气流把羽毛重新送上旅程。羽毛在一辆停着的汽车上方飘过。就在羽毛落向街面时，汽车恰好开走了。"}, {"t": "a", "text": "The feather floats under a passing car, then is sent flying back up in the air. A MAN sits on a bus bench. The feather floats above the ground and finally lands on the man's mudsoaked shoe.", "zh": "羽毛从一辆驶过的汽车底下穿过，又被卷回空中。一个男人坐在公交长椅上。羽毛贴着地面飘行，最后落在那男人沾满泥浆的鞋子上。"}, {"t": "a", "text": "The man reached down and picks up the feather. His name is FORREST GUMP. He looks at the feather oddly, moves aside a box of chocolates from an old suitcase, then opens the case.", "zh": "男人俯身捡起羽毛。他叫福雷斯·甘。他奇怪地看着羽毛，把一盒巧克力从一只旧皮箱上挪开，然后打开箱子。"}, {"t": "a", "text": "Inside the old suitcase are an assortment of clothes, a pingpong paddle, toothpaste and other personal items.", "zh": "旧皮箱里装着各式各样的衣服、一只乒乓球拍、牙膏和其他个人物品。"}, {"t": "a", "text": "Forrest pulls out a book titled \"Curious George,\" then places the feather inside the book. Forrest closes the suitcase.", "zh": "福雷斯抽出一本名为《好奇的乔治》的书，把羽毛夹进书里，然后合上了箱子。"}, {"t": "a", "text": "Something in his eyes reveals that Forrest may not be all there.", "zh": "他眼神里有某种东西，让人觉得福雷斯似乎不太机灵。"}, {"t": "a", "text": "Forrest looks right as the sound of an arriving bus is heard.", "zh": "听到公交车驶来的声音，福雷斯向右望去。"}, {"t": "a", "text": "A bus pulls up. Forrest remains on the bus bench as the bus continues on.", "zh": "一辆公交车靠站又开走了，福雷斯仍坐在公交长椅上。"}, {"t": "a", "text": "A BLACK WOMAN in a nurse's outfit steps up and sits down at the bus bench next to Forrest. The nurse begins to read a magazine as Forrest looks at her.", "zh": "一位穿护士制服的黑人女子走过来，在福雷斯身旁的长椅坐下。护士开始看杂志，福雷斯望着她。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Hello. My name's Forrest Gump.", "zh": "你好。我叫福雷斯·甘。"}, {"t": "a", "text": "He opens a box of chocolates and holds it out for the nurse.", "zh": "他打开一盒巧克力，递向护士。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "You want a chocolate?", "zh": "来块巧克力吗？"}, {"t": "a", "text": "The nurse shakes her head, a bit apprehensive about this strange man next to her.", "zh": "护士摇摇头，对身边这个陌生男人有些戒备。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I could eat about a million and a half of these. My momma always said, \"Life was like a box of chocolates. You never know what you're gonna get.\"", "zh": "这种东西我能吃一百五十万块。我妈妈常说：“人生就像一盒巧克力，你永远不知道下一块是什么味道。”"}, {"t": "a", "text": "Forrest eats a chocolate as he looks down at the nurse's shoes.", "zh": "福雷斯吃着巧克力，低头看护士的鞋。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Those must be comfortable shoes. I'll bet you could walk all day in shoes like that and not feel a thing. I wish I had shoes like that.", "zh": "这双鞋一定很舒服。我敢说穿这种鞋走一整天都不觉得累。真希望我也有一双这样的鞋。"}, {"t": "d", "speaker": "BLACK WOMAN", "note": "", "text": "My feet hurt.", "zh": "我的脚很疼。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Momma always says there's an awful lot you could tell about a person by their shoes. Where they're going. Where they've been.", "zh": "妈妈总说，看一个人的鞋，就能知道他很多事情——他要去哪儿，去过什么地方。"}, {"t": "a", "text": "The black woman stares at Forrest as he looks down at his own shoes.", "zh": "福雷斯低头看着自己的鞋，黑人女子盯着他看。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I've worn lots of shoes. I bet if I think about it real hard I could remember my first pair of shoes.", "zh": "我穿过好多鞋。我敢说，只要使劲回想，我就能记起自己的第一双鞋。"}, {"t": "a", "text": "Forrest closes his eyes tightly.", "zh": "福雷斯紧紧闭上眼睛。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Momma said they'd take my anywhere.", "zh": "妈妈说它们能带我去任何地方。"}]}, {"index": 2, "title": "INT. COUNTRY DOCTOR'S OFFICE - GREENBOW, ALABAMA - DAY (1951)", "blocks": [{"t": "a", "text": "A little boy closes his eyes tightly. It is young Forrest as he sits in a doctor's office.", "zh": "一个小男孩紧紧闭着眼睛。那是坐在医生诊所里的小福雷斯。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She said they was my magic shoes.", "zh": "她说那是我的魔法鞋。"}, {"t": "a", "text": "Forrest has been fitted with orthopedic shoes and metal leg braces.", "zh": "福雷斯装上了矫形鞋和金属腿支架。"}, {"t": "d", "speaker": "DOCTOR", "note": "", "text": "All right, Forrest, you can open your eyes now. Let's take a little walk around.", "zh": "好了，福雷斯，现在可以睁开眼睛了。来，走几步看看。"}, {"t": "a", "text": "The doctor sets Forrest down on its feet. Forrest walks around stiffly. Forrest's mother, MRS. GUMP, watches him as he clanks around the room awkwardly.", "zh": "医生把福雷斯放到地上。福雷斯僵硬地走着，叮叮当当地在屋里笨拙地挪动。他的母亲甘太太在一旁看着。"}, {"t": "d", "speaker": "DOCTOR", "note": "", "text": "How do those feel? His legs are strong, Mrs. Gump. As strong as I've ever seen. But his back is as crooked as a politician.", "zh": "感觉怎么样？他的腿很结实，甘太太，是我见过最结实的腿。可他的背弯得像个政客。"}, {"t": "a", "text": "Forrest walks foreground past the doctor and Mrs. Gump.", "zh": "福雷斯从医生和甘太太面前走过，走向前景。"}, {"t": "d", "speaker": "DOCTOR", "note": "", "text": "But we're gonna straighten him right up now, won't we, Forrest?", "zh": "不过我们会把他矫正过来的，对吧，福雷斯？"}, {"t": "a", "text": "A loud thud is heard as, outside, Forrest falls.", "zh": "外面传来一声闷响——福雷斯摔倒了。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Forrest!", "zh": "福雷斯！"}]}, {"index": 3, "title": "EXT. GREENBOW, ALABAMA", "blocks": [{"t": "a", "text": "Mrs. Gump and young Forrest walk across the street. Forrest walks stiffly next to his mother.", "zh": "甘太太和小福雷斯穿过马路。福雷斯迈着僵硬的步子走在母亲身边。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, when I was a baby, Momma named me after the great Civil War hero, General Nathan Bedford Forrest...", "zh": "我还是婴儿的时候，妈妈给我取了内战大英雄内森·贝德福德·福雷斯特将军的名字……"}]}, {"index": 4, "title": "EXT. RURAL ALABAMA", "blocks": [{"t": "a", "text": "A black and white photo of General Nathan Bedford Forrest.", "zh": "一张内森·贝德福德·福雷斯特将军的黑白照片。"}, {"t": "a", "text": "The photo turns into live action as the General dons a hooded sheet over his head.", "zh": "照片化作实景：将军把一块带兜帽的白布套在头上。"}, {"t": "a", "text": "The General is in full Ku Klux Klan garb, including his horse.", "zh": "将军全身三K党装束，连他的马也披挂齐全。"}, {"t": "a", "text": "The General rides off, followed by a large group of Klan members dressed in full uniform.", "zh": "将军骑马而去，身后跟着一大群全副装束的三K党成员。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She said we was related to him in some way. And, what he did was, he started up this club called the Ku Klux Klan. They'd all dress up in their robes and their bedsheets and act like a bunch of ghosts or spooks or something. They'd even put bedsheets on their horses and ride around. And anyway, that's how I got my name. Forrest Gump.", "zh": "她说我们和他多少有点亲戚关系。他干的事嘛，就是创办了一个叫三K党的俱乐部。他们裹上长袍、披着床单，装神弄鬼的。他们还给马也披上床单到处跑。总之，我的名字就是这么来的——福雷斯·甘。"}]}, {"index": 5, "title": "EXT. GREENBOW", "blocks": [{"t": "a", "text": "Mrs. Gump and Forrest walk across the street.", "zh": "甘太太和福雷斯穿过马路。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma said that the Forrest part was to remind me that sometimes we all do things that, well, just don't make no sense.", "zh": "妈妈说，取“福雷斯”这个名字，是要提醒我：有时候，我们每个人都会做一些……嗯，毫无道理的事。"}, {"t": "a", "text": "Forrest stops suddenly as his brace gets stuck. Forrest's brace is caught in a gutter grate. Mrs. Gump bends down and tries to free Forrest. Two old cronies sit in front of a barber shop and watch.", "zh": "福雷斯突然停住，他的支架卡住了，卡在了排水沟的格栅里。甘太太弯下腰想帮他弄出来。两个老头坐在理发店前看着。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Just wait, let me get it.", "zh": "等等，我来弄。"}, {"t": "a", "text": "Mrs. Gump struggles to pull the stuck brace from the grate.", "zh": "甘太太使劲想把卡住的支架从格栅里拔出来。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Let me get it. Wait, get it this way. Hold on.", "zh": "我来弄。等等，换个方向。别动啊。"}, {"t": "a", "text": "Forrest pulls his foot out of the grate.", "zh": "福雷斯把脚从格栅里抽了出来。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "All right.", "zh": "好了。"}, {"t": "a", "text": "Mrs. Gump helps Forrest up onto the sidewalk. She looks up and notices the two old man.", "zh": "甘太太扶福雷斯走上人行道。她抬头看见了那两个老头。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Oooh. All right. What are you all staring at? Haven't you ever seen a little boy with braces on his legs before?", "zh": "哦，好了。你们盯着看什么看？没见过腿上戴支架的小男孩吗？"}, {"t": "a", "text": "Mrs. Gump and Forrest walk along the sidewalk past the two old men. Mrs. Gump holds tightly onto Forrest's hand.", "zh": "甘太太牵着福雷斯沿人行道走过两个老头，她紧紧握着他的手。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Don't ever let anybody tell you they're better than you, Forrest. If God intended everybody to be the same, he'd have given us all braces on our legs.", "zh": "福雷斯，别让任何人说他们比你强。如果上帝想让人人都一样，他会给每个人腿上都戴上支架。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma always had a way of explaining things so I could understand them.", "zh": "妈妈总有办法把事情解释得让我听得懂。"}]}, {"index": 6, "title": "EXT. OAK ALLEY/THE GUMP BOARDING HOUSE", "blocks": [{"t": "a", "text": "Mrs. Gump and Forrest walk along a dirt road. A row of mailboxes stands left.", "zh": "甘太太和福雷斯走在一条土路上。左边立着一排邮箱。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "We lived about a quarter mile of Route 17, about a half mile from the town of Greenbow, Alabama. That's in the county of Greenbow. Our house had been in Momma's family since her grandpa's grandpa's grandpa had come across the ocean about a thousand years ago. Something like that.", "zh": "我们家住在十七号公路往里四分之一英里的地方，离亚拉巴马州的绿弓镇大约半英里，就在绿弓县。我们家的房子从妈妈的爷爷的爷爷的爷爷那一辈起就在她娘家了，大概一千年前漂洋过海来的吧，差不多。"}, {"t": "a", "text": "Mrs. Gump and Forrest walk along the Gump Boarding House driveway.", "zh": "甘太太和福雷斯走在甘家供宿公寓的车道上。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Since it was just me and Momma and we had all these empty rooms, Momma decided to let those rooms out. Mostly to people passing through. Like from, oh, Mobile, Montgomery, place like that. That's how me and Mommy got money. Mommy was a real smart lady.", "zh": "因为家里只有我和妈妈，空房间又那么多，妈妈决定把房间租出去，主要租给过路的客人，比如从莫比尔、蒙哥马利那些地方来的人。我和妈妈就是这样挣到钱的。妈妈真是个聪明的女人。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Remember what I told you, Forrest. You're no different than anybody else is.", "zh": "记住我说的话，福雷斯。你和别人没有任何不同。"}, {"t": "a", "text": "Mrs. Gump heads Forrest to the porch. She bends down to look Forrest in the eye.", "zh": "甘太太把福雷斯带到门廊，蹲下来看着他的眼睛。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Did you hear what I said, Forrest? You're the same as everybody else. You are no different.", "zh": "听见我说的话了吗，福雷斯？你和所有人一样。你没有什么不同。"}]}, {"index": 7, "title": "INT. ELEMENTARY SCHOOL / PRINCIPAL'S OFFICE - DAY", "blocks": [{"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "Your boy's... different, Mrs. Gump. Now, his I.Q. is seventy-five.", "zh": "您的孩子……不太一样，甘太太。他的智商是七十五。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Well, we're all different, Mr. Hancock.", "zh": "好吧，我们每个人都不一样，汉考克先生。"}, {"t": "a", "text": "The principal sighs, then stands up.", "zh": "校长叹了口气，站起身来。"}]}, {"index": 8, "title": "INT. HALLWAY", "blocks": [{"t": "a", "text": "Forrest sits outside the principal's office and waits.", "zh": "福雷斯坐在校长办公室外面等着。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She wanted me to have the finest education, so she took me to the Greenbow County Central School. I met the principal and all.", "zh": "她想让我接受最好的教育，就把我送进了绿弓县中心学校。我见到了校长什么的。"}, {"t": "a", "text": "The principal stands in front of Mrs. Gump. Forrest, sitting left, listens.", "zh": "校长站在甘太太面前，福雷斯坐在左边听着。"}, {"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "I want to show you something, Mrs. Gump. Now, this is normal.", "zh": "甘太太，我给您看样东西。看，这个范围是正常的。"}, {"t": "a", "text": "The principal holds up a chart with a designations according to I.Q. and points to the center of the graph, labeled \"Normal.\" A red line below the normal area is labeled \"State Acceptance.\" The principal points to the section below the acceptance line labeled \"Below.\"", "zh": "校长举起一张按智商划分的图表，指着图中央标着“正常”的区域。正常区域下方有一条红线，标着“州立录取线”。校长指着录取线以下标着“以下”的区域。"}, {"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "Forrest is right here. The state requires a minimum I.Q. of eighty to attend public school, Mrs. Gump. He's gonna have to go to a special school. Now, he'll be just fine.", "zh": "福雷斯就在这儿。州里规定公立学校的智商最低要达到八十，甘太太。他得去特殊学校。不过，他在那儿会过得好好的。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "What does normal mean, anyway? He might be a bit on the slow side, but my boy Forrest is going to get the same opportunities as everyone else. He's not going to some special school to learn to how to re-tread tires. We're talking about five little points here. There must be something can be done.", "zh": "“正常”又是什么意思？他也许是反应慢一点，可我的福雷斯要和其他人有同样的机会。他不能去什么特殊学校学怎么翻新旧轮胎。不就差五分嘛。一定有办法的。"}]}, {"index": 9, "title": "INT. HALLWAY", "blocks": [{"t": "a", "text": "Forrest sits outside the principal's office.", "zh": "福雷斯坐在校长办公室外面。"}, {"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "We're a progressive school system. We don't want to see anybody left behind.", "zh": "我们的学制是很进步的，我们不想看到任何一个孩子掉队。"}]}, {"index": 10, "title": "INT. PRINCIPAL'S OFFICE", "blocks": [{"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "Is there a Mr. Gump, Mrs. Gump?", "zh": "甘太太，甘先生在吗？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "He's on vacation.", "zh": "他在度假。"}]}, {"index": 11, "title": "EXT. GUMP BOARDING HOUSE - NIGHT", "blocks": [{"t": "a", "text": "Forrest sits on a swing outside the house. Loud organic male grunts are heard coming from inside the house. Forrest sits on the swing as the grunts continue. The principal steps out of the Gump House and wipes the sweat from his face.", "zh": "福雷斯坐在屋外的秋千上。屋里传来男人粗重的呻吟声。福雷斯坐在秋千上，呻吟声持续不断。校长走出甘家，擦着脸上的汗。"}, {"t": "a", "text": "Forrest is sitting on the porch.", "zh": "福雷斯坐在门廊上。"}, {"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "Well, your momma sure does care about your schooling, son. Mm-mm-mm.", "zh": "呃，你妈妈可真关心你的学业啊，孩子。嗯——嗯——嗯。"}, {"t": "a", "text": "The principal wipes the sweat from his neck, then looks back at Forrest.", "zh": "校长擦了擦脖子上的汗，回头看了看福雷斯。"}, {"t": "d", "speaker": "PRINCIPAL", "note": "", "text": "You don't say much, do you?", "zh": "你话不多，是吧？"}, {"t": "a", "text": "Forrest grunts, imitating him. The principal, embarrassed, turns and walks away.", "zh": "福雷斯学着他的样子哼了一声。校长尴尬地转身走了。"}]}, {"index": 12, "title": "INT. GUMP BOARDING HOUSE/FORREST'S BEDROOM", "blocks": [{"t": "a", "text": "Mrs. Gump reads from the book \"Curious George\" as Forrest sits on the bed and listens.", "zh": "甘太太读着《好奇的乔治》，福雷斯坐在床上听。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Finally, he had to try it. It looked easy, but, oh, what happened. First there...", "zh": "最后，他不得不试一试。看起来挺容易，可是，唉，出事了。先是……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Momma, what's vacation mean?", "zh": "妈妈，“度假”是什么意思？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Vacation?", "zh": "度假？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Where Daddy went?", "zh": "爸爸去哪儿了？"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Vacation's when you go somewhere, and you don't ever come back.", "zh": "度假就是你去一个地方，然后再也不回来了。"}, {"t": "a", "text": "Forrest lies down on his bed and looks up.", "zh": "福雷斯躺到床上，望着上方。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Anyway, I guess you could say me and Momma was on our own.", "zh": "总之，可以说我和妈妈只能相依为命了。"}]}, {"index": 13, "title": "EXT. GUMP BOARDING HOUSE - DAY", "blocks": [{"t": "a", "text": "A cab driver closes the trunk of the car as two women walk toward the house. A milkman steps down from the porch.", "zh": "一个出租车司机关上后备箱，两个女人朝房子走来。一个送奶工从门廊走下来。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But we didn't mind. Our house was never empty. There was always folks comin' and goin'.", "zh": "但我们并不介意。我们家从不清静，总有人进进出出。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "V.O.", "text": "Suppa.", "zh": "晚饭啦。"}]}, {"index": 14, "title": "INT. GUMP BOARDING HOUSE", "blocks": [{"t": "a", "text": "Mrs. Gump steps forward and speaks to all the boarders.", "zh": "甘太太走上前，对所有房客说话。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "It's suppa, everyone. Forrest...", "zh": "各位，吃晚饭了。福雷斯……"}, {"t": "a", "text": "A MAN WITH A CANE steps left across the hall.", "zh": "一个拄拐杖的男人穿过门厅往左走。"}, {"t": "d", "speaker": "MAN WITH CANE", "note": "", "text": "My, my. That sure looks special.", "zh": "哎呀，哎呀。看起来可真丰盛。"}, {"t": "a", "text": "Mrs. Gump looks into a sitting room and informs the boarders about dinner.", "zh": "甘太太朝客厅里望了望，通知房客们吃饭。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Gentlemen, would you care to join us for supper? Hurry up and get it before the flies do. I prefer you don't smoke that cigar so close to mealtime.", "zh": "先生们，愿意和我们一起吃晚饭吗？趁苍蝇还没来，快来吃吧。还有，快吃饭了，麻烦您别抽那支雪茄了。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometimes we had so many people stayin' with us that every room was filled with travelers. You know, folks livin' out of their suitcases, and hat cases, and sample cases.", "zh": "有时候住在家里的人太多，每个房间都住满了旅客。就是那种拎着行李箱、帽盒、样品箱过日子的人。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Well, you go ahead and start. I can't find Forrest.", "zh": "你们先吃吧，我找不到福雷斯。"}, {"t": "a", "text": "Mrs. Gump walks up the stairs.", "zh": "甘太太走上楼梯。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Forrest... Forrest...", "zh": "福雷斯……福雷斯……"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "One time a young man was staying with us, and he had him a guitar case.", "zh": "有一次，一个年轻人住在我们家，他带着一个吉他盒。"}, {"t": "a", "text": "Mrs. Gump looks into Forrest's room. She hears singing coming from another room and walks over to a closed door. Mrs. Gump opens the door, revealing a young man with long sideburns as he plays the guitar and sings. Forrest holds onto a broom and dances oddly. The young man is ELVIS PRESLEY.", "zh": "甘太太朝福雷斯的房间里看了看，她听到另一个房间传来歌声，便走过去推开一扇关着的门。一个留着长长络腮胡的年轻人正弹着吉他唱歌，福雷斯抱着扫帚怪模怪样地跳舞。这个年轻人就是“猫王”埃尔维斯·普雷斯利。"}, {"t": "d", "speaker": "ELVIS PRESLEY", "note": "sings", "text": "\"Well, you ain't never caught a rabbit, and you ain't no friend of mine.\"", "zh": "“哼，你连兔子都逮不着，你算不得我的朋友。”"}, {"t": "a", "text": "Forrest's legs rock back and forth to the guitar.", "zh": "福雷斯的双腿随着吉他声前后晃动。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "Forrest! I told you not to bother this nice young man.", "zh": "福雷斯！我说过别打扰这位好心的年轻人。"}, {"t": "d", "speaker": "ELVIS", "note": "", "text": "Oh, no, that's all right, ma'am. I was just showin' him a thing or two on the guitar here.", "zh": "哦，没关系，夫人。我不过是教他两招吉他而已。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "All right, but your supper's ready if y'all want to eat.", "zh": "那好吧，晚饭好了，想吃就来吧。"}, {"t": "d", "speaker": "ELVIS", "note": "", "text": "Yeah, that sounds good. Thank you, ma'am.", "zh": "好啊，听起来不错。谢谢您，夫人。"}, {"t": "a", "text": "Mrs. Gump leaves and closes the door. Elvis sits back down.", "zh": "甘太太带上门离开了。埃尔维斯重新坐下。"}, {"t": "a", "text": "Forrest stands left, and looks himself in a mirror.", "zh": "福雷斯站在左边，对着镜子看自己。"}, {"t": "d", "speaker": "ELVIS", "note": "", "text": "Say, man, show me that crazy little walk you just did there. Slow it down some.", "zh": "嘿，伙计，再走一遍你刚才那疯狂的步子给我看看。放慢一点。"}, {"t": "a", "text": "Forrest begins to dance again as Elvis plays the guitar and sings.", "zh": "福雷斯又跳起来，埃尔维斯弹着吉他唱。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "\"You ain't nothin' but a hound, hound dog...\"", "zh": "“你不过是只猎狗，猎狗……”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I liked that guitar.", "zh": "我喜欢那把吉他。"}, {"t": "a", "text": "Forrest dances as he watches himself in the mirror.", "zh": "福雷斯一边对着镜子看自己，一边跳舞。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "It sounded good.", "zh": "听起来真带劲。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "\"...cryin' all the time\"", "zh": "“……成天哭哭啼啼”"}, {"t": "a", "text": "Forrest rocks up and down on his braced legs, then begins to step.", "zh": "福雷斯戴着支架的腿上下晃动，接着开始迈步。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "\"You ain't nothin' but a hound dog...\"", "zh": "“你不过是只猎狗……”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I started moving around to the music, swinging my hips. This one night me and Momma...", "zh": "我开始跟着音乐动起来，扭着屁股。有天晚上，我和妈妈……"}]}, {"index": 15, "title": "EXT. GREENBOW - NIGHT", "blocks": [{"t": "a", "text": "Mrs. Gump and Forrest walk along a sidewalk. A television inside a store window reveals Elvis Presley as he performs \"Houng Dog\" on a stage.", "zh": "甘太太和福雷斯走在人行道上。商店橱窗里的电视正在播放埃尔维斯·普雷斯利在舞台上演唱《猎狗》。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...was out shoppin', and we walked right by Benson's Furniture and Appliance store, and guess what.", "zh": "……出去买东西，正好经过本森家具电器商店，你猜怎么着。"}, {"t": "a", "text": "The television reveals Elvis as he thrusts his hips and sings.", "zh": "电视里，埃尔维斯扭着胯唱歌。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "You ain't nothin' but a hound dog...", "zh": "你不过是只猎狗……"}, {"t": "a", "text": "Mrs. Gump and Forrest watch the television. Elvis dances around in the same manner Forrest did. A woman in the audience screaming and applauding.", "zh": "甘太太和福雷斯看着电视。埃尔维斯跳舞的姿势和福雷斯刚才一模一样。观众席上一个女人尖叫着鼓掌。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "You ain't nothin' but a hound dog...", "zh": "你不过是只猎狗……"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "This is not children's eyes.", "zh": "这可不是小孩子该看的东西。"}, {"t": "a", "text": "Mrs. Gump walks away, pulling Forrest with her. Forrest stops and takes one last look. Elvis continues to perform over the television.", "zh": "甘太太拉着福雷斯走开。福雷斯停下来，又看了最后一眼。埃尔维斯在电视里继续表演。"}, {"t": "d", "speaker": "ELVIS", "note": "sings", "text": "\"Well, you ain't never caught a rabbit and you ain't no friend of mine.\"", "zh": "“哼，你连兔子都逮不着，你算不得我的朋友。”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Some years later, that handsome young man who they called \"The King,\" well, he sung too many songs, had himself a heart attack or something.", "zh": "几年后，那个被称为“猫王”的英俊年轻人，歌唱得太多，结果心脏病发作什么的，就这么走了。"}]}, {"index": 16, "title": "EXT. SAVANNAH/BUS BENCH - DAY", "blocks": [{"t": "a", "text": "Forrest is still sitting on the bus bench. The black nurse looks at him.", "zh": "福雷斯仍坐在公交长椅上，黑人护士看着他。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Must be hard being a king. You know, it's funny how you remember some things, but some things you can't.", "zh": "当国王肯定不容易。你瞧，有些事你记得，有些事你怎么也记不起来，这真有意思。"}]}, {"index": 17, "title": "EXT. COUNTRY ROAD/ALABAMA - MORNING (1954)", "blocks": [{"t": "a", "text": "Mrs. Gump and Forrest wait for the school bus. The bus pulls up as Mrs. Gump prepares Forrest for his first day of school.", "zh": "甘太太和福雷斯等校车。车靠站了，甘太太为福雷斯第一天上学做准备。"}, {"t": "d", "speaker": "MRS. GUMP", "note": "", "text": "You do your very best now, Forrest.", "zh": "福雷斯，你要尽自己最大的努力。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I sure will, Momma.", "zh": "我一定会的，妈妈。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I remember the bus ride on the first day of school very well.", "zh": "第一天上学坐校车的情景，我记得清清楚楚。"}, {"t": "a", "text": "The bus driver opens the door and looks down. Forrest walks to the steps of the bus and looks at the bus driver. She is smoking a cigarette.", "zh": "女司机打开车门低头看。福雷斯走到车门前台阶，望着司机——她正抽着烟。"}, {"t": "d", "speaker": "BUS DRIVER", "note": "", "text": "Are you comin' along?", "zh": "你到底上不上来？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Momma said not to be taking rides from strangers.", "zh": "妈妈说不要坐陌生人的车。"}, {"t": "d", "speaker": "BUS DRIVER", "note": "", "text": "This is the bus to school.", "zh": "这是去学校的校车。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm Forrest Gump.", "zh": "我叫福雷斯·甘。"}, {"t": "d", "speaker": "BUS DRIVER", "note": "", "text": "I'm Dorothy Harris.", "zh": "我叫多萝西·哈里斯。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Well, now we ain't strangers anymore.", "zh": "好啦，那我们就不是陌生人了。"}, {"t": "a", "text": "The bus driver smiles as Forrest steps up into the bus.", "zh": "福雷斯踏上公交车，女司机微笑着。"}]}, {"index": 18, "title": "INT. BUS", "blocks": [{"t": "a", "text": "Forrest steps up onto the bus. Mrs. Gump waves to Forrest as the bus drives away. Forrest begins to walk down the aisle.", "zh": "福雷斯上了车。公交车开走时，甘太太朝他挥手。福雷斯沿着过道往里走。"}, {"t": "a", "text": "TWO YOUNG BOYS look up from the seat.", "zh": "两个小男孩从座位上抬起头。"}, {"t": "d", "speaker": "BOY #1", "note": "", "text": "This seat's taken.", "zh": "这位子有人了。"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "It's taken!", "zh": "有人了！"}, {"t": "a", "text": "Forrest looks around. A larger girl slides over so Forrest can't sit next to her. She shakes her head. Forrest looks to the other side where a boy sits alone on a larger seat. They boy glares up at Forrest.", "zh": "福雷斯四处张望。一个大块头女孩往里挪了挪，不让福雷斯坐她旁边，还摇了摇头。福雷斯看向另一边，一个男孩独自占着一个大座位，那男孩瞪了他一眼。"}, {"t": "d", "speaker": "BOY #3", "note": "", "text": "You can't sit here.", "zh": "你不能坐这儿。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "You know, it's funny what a young man recollects. 'Cause I don't remember being born.", "zh": "你知道吗，一个人能记住什么，真是件怪事。因为我不记得自己出生的情形。"}]}, {"index": 19, "title": "EXT. SAVANNAH/BUS BENCH - DAY", "blocks": [{"t": "a", "text": "Forrest continues talking as he sits on the bus bench.", "zh": "福雷斯坐在公交长椅上继续说着。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I, I... don't recall what I got for my first Christmas and I don't know when I went on my first outdoor picnic. But, I do remember the first time I heard the sweetiest voice...", "zh": "我……我不记得第一个圣诞节收到了什么礼物，也不记得第一次户外野餐是什么时候。可我清楚地记得，我第一次听到那最甜美的声音……"}]}, {"index": 20, "title": "INT. BUS - MORNING (1954)", "blocks": [{"t": "a", "text": "Young Forrest is still standing in the aisle on the bus.", "zh": "小福雷斯仍站在公交车过道里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...in the wide world.", "zh": "……在这个世界上。"}, {"t": "d", "speaker": "GIRL", "note": "", "text": "You can sit here if you want.", "zh": "你想坐的话，可以坐这儿。"}, {"t": "a", "text": "Forrest looks back at JENNY CURRAN, a young girl about Forrest's age.", "zh": "福雷斯回头看向珍妮·柯伦，一个和他年纪相仿的小女孩。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I had never seen anything so beautiful in my life. She was like an angel.", "zh": "我这辈子从没见过那么美的人。她就像个天使。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Well, are you gonna sit down, or aren't ya?", "zh": "喂，你到底坐不坐？"}, {"t": "a", "text": "Forrest sits down next to Jenny.", "zh": "福雷斯在珍妮身旁坐下。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "What's wrong with your legs?", "zh": "你的腿怎么了？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Um, nothing at all, thank you. My legs are just fine and dandy.", "zh": "嗯，没什么，谢谢。我的腿好得很，一点事儿都没有。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "I just sat next to her on that bus and had conversation all the way to school.", "zh": "我就坐在她旁边，一路和她聊到了学校。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Then why do you have those shoes on?", "zh": "那你干吗穿那双鞋？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My momma said my back's crooked like a question mark. These are going to make me as straight as an arrow. They're my magic shoes.", "zh": "我妈妈说我的背弯得像个问号。穿上它们，我就能站得像箭一样直。这是我的魔法鞋。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And next to Momma, no one ever talked to me or asked me questions.", "zh": "除了妈妈，从没有人和我说过话，也没人问过我问题。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Are you stupid or something.", "zh": "你是傻还是怎么的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Mommy says stupid is as stupid does.", "zh": "妈妈说，傻人做傻事。"}, {"t": "a", "text": "Jenny puts her hand out toward Forrest. Forrest reaches over and shakes her hand.", "zh": "珍妮把手伸向福雷斯。福雷斯伸手过去和她握了握。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "I'm Jenny.", "zh": "我叫珍妮。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "I'm Forrest Gump. Forrest Gump.", "zh": "我叫福雷斯·甘。福雷斯·甘。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "From that day on, we was always together. Jenny and me was like peas and carrots.", "zh": "从那天起，我们就形影不离。我和珍妮好得就像豌豆和胡萝卜。"}]}, {"index": 21, "title": "EXT. OAK TREE - DAY", "blocks": [{"t": "a", "text": "Young Jenny and Forrest run toward a large oak tree.", "zh": "小珍妮和福雷斯朝一棵高大的橡树跑去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She taught me how to climb...", "zh": "她教我爬树……"}, {"t": "a", "text": "Jenny sits on a large branch and calls down to Forrest.", "zh": "珍妮坐在一根粗树枝上，朝下喊福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Come on, Forrest, you can do it.", "zh": "加油，福雷斯，你能行的。"}, {"t": "a", "text": "Forrest dangles from the branch.", "zh": "福雷斯吊在树枝上晃悠。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...I showed her how to dangle.", "zh": "……我教她怎么吊着晃。"}, {"t": "a", "text": "Jenny and Forrest sit on a tree branch and read.", "zh": "珍妮和福雷斯坐在树枝上读书。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "\"...a good little monkey and...\"", "zh": "“……一只乖小猴，然后……”"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She helped me to learn how to read.", "zh": "她帮我学认字。"}, {"t": "a", "text": "Forrest hangs upside down from a branch and swings back and forth. Forrest's braces are wedged in the tree.", "zh": "福雷斯倒挂在树枝上荡来荡去，支架卡在了树里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And I showed her to swing.", "zh": "我还教她荡秋千。"}]}, {"index": 22, "title": "EXT. OAK TREE - NIGHT", "blocks": [{"t": "a", "text": "The silhouete of the oak tree, Jenny and Forrest as they sit on a branch.", "zh": "橡树、珍妮和福雷斯坐在树枝上的剪影。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Sometimes we'd just sit out and wait for the stars.", "zh": "有时候我们就坐在外面等星星出来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Momma's gonna worry about me.", "zh": "妈妈该担心我了。"}, {"t": "a", "text": "Jenny puts her hand on Forrest's hand.", "zh": "珍妮把手放在福雷斯的手上。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Just stay a little longer.", "zh": "再待一会儿嘛。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "For some reason, Jenny didn't never want to go home.", "zh": "不知为什么，珍妮从来不想回家。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Okay, Jenny. I'll stay.", "zh": "好吧，珍妮，我留下。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "She was my most special friend.", "zh": "她是我最特别的朋友。"}]}, {"index": 23, "title": "INT. SAVANNAH/BUS STOP - DAY", "blocks": [{"t": "a", "text": "Forrest nods as he remembers.", "zh": "福雷斯回忆着，点了点头。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "My only friend.", "zh": "我唯一的朋友。"}, {"t": "a", "text": "Forrest continues talking to the black woman. She doesn't seem to be listening as she reads her magazine. She looks up from her magazine.", "zh": "福雷斯继续对黑人女子说着。她看着杂志，似乎没在听。这时她从杂志上抬起头来。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Now, my Momma always told me that miracles happen every day. Some people don't think so, but they do.", "zh": "我妈妈总对我说，奇迹每天都在发生。有些人不这么想，但奇迹确实存在。"}]}, {"index": 24, "title": "EXT. OAK ALLEY - ANOTHER DAY (1954)", "blocks": [{"t": "a", "text": "Jenny and Forrest walk. A dirt clod hits Forrest in the back of the head. Jenny looks as Forrest rubs his head. THREE YOUNG BOYS get off their bikes and pick up more rocks.", "zh": "珍妮和福雷斯走着，一块土疙瘩砸中福雷斯的后脑勺。福雷斯揉着头，珍妮看过去。三个小男孩从自行车上下来，又捡起石块。"}, {"t": "d", "speaker": "BOY #1", "note": "", "text": "Hey... dummy!", "zh": "嘿……笨蛋！"}, {"t": "a", "text": "Forrest is hit in the eye with another dirt clod. Forrest falls backward onto the ground as the boys glare at him.", "zh": "又一块土疙瘩打中福雷斯的眼睛。他仰天摔倒，男孩们瞪着他。"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "Are you retarded, or just plain stupid?", "zh": "你是弱智，还是纯粹的蠢？"}, {"t": "d", "speaker": "BOY #3", "note": "", "text": "Look, I'm Forrest Gump.", "zh": "你们好，我叫福雷斯·甘。"}, {"t": "a", "text": "Jenny helps Forrest back up. Boy #1 and Boy #2 throw more dirt clods at Forrest.", "zh": "珍妮把福雷斯扶起来。男孩甲和男孩乙朝他扔更多土块。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Just run away, Forrest.", "zh": "快跑，福雷斯。"}, {"t": "a", "text": "Another dirt clod hits Forrest in the arm.", "zh": "又一块土疙瘩打中福雷斯的胳膊。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest!", "zh": "跑啊，福雷斯！"}, {"t": "a", "text": "Forrest tries to run along the road, but his braces makes it impossible. He hobbles along as Jenny yells after him.", "zh": "福雷斯想沿路跑起来，可支架让他根本跑不动。珍妮在后面喊着，他一瘸一拐地往前挪。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run away! Hurry!", "zh": "快跑！快点！"}, {"t": "a", "text": "Boy #1 and Boy #2 turn back toward the bikes.", "zh": "男孩甲和男孩乙转身跑向自行车。"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "Get the bikes!", "zh": "骑车追！"}, {"t": "d", "speaker": "BOY #3", "note": "", "text": "Hurry up!", "zh": "快点！"}, {"t": "a", "text": "The boys pick up their bikes and ride after Forrest.", "zh": "男孩们推起自行车，骑车去追福雷斯。"}, {"t": "d", "speaker": "BOY #3", "note": "", "text": "Let's get him! Come on!", "zh": "抓住他！快！"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "Look out, dummy, here we come!", "zh": "当心了，笨蛋，我们来啦！"}, {"t": "a", "text": "The boys ride after Forrest. Jenny stands and watches.", "zh": "男孩们骑车追赶，珍妮站在原地看着。"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "We're gonna get you!", "zh": "我们要抓到你啦！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest! Run!", "zh": "跑，福雷斯！跑！"}, {"t": "a", "text": "Forrest hobbles along the dirt road.", "zh": "福雷斯在土路上一瘸一拐地跑。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest!", "zh": "跑啊，福雷斯！"}, {"t": "a", "text": "Forrest looks over his shoulder. The three boys race on their bikes.", "zh": "福雷斯回头看。三个男孩骑着自行车飞驰。"}, {"t": "d", "speaker": "BOY #1", "note": "", "text": "Come back here, you!", "zh": "你给我回来！"}, {"t": "a", "text": "Forrest begins to run faster with his braces on. Forrest continues running as the boys chase him. Blood drips down from a cut on his head. The boys on the bikes are gaining on Forrest. Forrest hobbles along. He begins to gain speed.", "zh": "福雷斯戴着支架越跑越快，男孩们紧追不舍，头上伤口的血滴下来。骑车的男孩越来越近。福雷斯一瘸一拐，速度却开始加快。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest! Run!", "zh": "跑，福雷斯！跑！"}, {"t": "a", "text": "SLOW MOTION --", "zh": "慢镜头——"}, {"t": "a", "text": "Forrest runs from the chasing room. He looks over his shoulder in fear.", "zh": "福雷斯在追赶中奔逃，害怕地回头张望。"}, {"t": "a", "text": "The boys on the bikes peddle faster as they gain on Forrest, running.", "zh": "骑车的男孩蹬得更快，渐渐追上奔跑的福雷斯。"}, {"t": "a", "text": "Forrest tries to run even faster to get away. Suddenly his braces shatter, sending steel and plastic flying into the air.", "zh": "福雷斯想跑得再快些甩开他们。突然，他的支架崩碎了，钢铁和塑料碎片飞向空中。"}, {"t": "a", "text": "Forrest runs and look down at his legs in surprise.", "zh": "福雷斯跑着，惊讶地低头看自己的腿。"}, {"t": "a", "text": "Forrest continues to run faster as the metal braces and straps fly off his legs.", "zh": "金属支架和绑带纷纷从腿上飞散，福雷斯越跑越快。"}, {"t": "a", "text": "Forrest runs free of his braces and begins to pick up speed.", "zh": "福雷斯挣脱了支架，开始加速。"}, {"t": "a", "text": "The chasing boys ride over the remains of Forrest's braces.", "zh": "追赶的男孩们骑车碾过福雷斯支架的残骸。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, you wouldn't believe it if I told you.", "zh": "说出来你们都不会相信。"}]}, {"index": 25, "title": "EXT. SAVANNAH/ BUS BENCH - DAY", "blocks": [{"t": "d", "speaker": "FORREST", "note": "", "text": "But I can run like the wind blows.", "zh": "我跑起来像风一样快。"}, {"t": "a", "text": "The black woman continues to read her magazine. Forrest smiles as he remembers.", "zh": "黑人女子继续看杂志。福雷斯回忆着，露出微笑。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "From that day on, if I was going somewhere, I was running!", "zh": "从那天起，只要我要去什么地方，我就跑着去！"}]}, {"index": 26, "title": "EXT. OAK ALLEY - DAY (1954)", "blocks": [{"t": "a", "text": "Forrest sprints away from the boys. The boys stop the chase and watch in disbelief. Forrest is already at the far end of the road, clear of the chasing boys.", "zh": "福雷斯甩开男孩们飞奔而去。男孩们停下追逐，难以置信地望着。福雷斯已经跑到了大路的尽头，把追赶者甩得远远的。"}, {"t": "d", "speaker": "BOY #2", "note": "", "text": "He's gettin' away! Stop him!", "zh": "他跑了！拦住他！"}, {"t": "a", "text": "Boy #1 throws his bike down in frustration. Forrest runs across a field.", "zh": "男孩甲懊恼地把自行车摔在地上。福雷斯跑过一片田野。"}]}, {"index": 27, "title": "EXT. COUNTRY ROAD", "blocks": [{"t": "a", "text": "Forrest runs past a chain gang in their prison uniforms.", "zh": "福雷斯跑过一队穿着囚服的锁链苦役犯。"}, {"t": "a", "text": "They are cutting at the weeds on the side of the road.", "zh": "他们正在路边割杂草。"}]}, {"index": 28, "title": "EXT. GREENBOW", "blocks": [{"t": "a", "text": "Forrest runs across the street. THE TWO OLD MEN sit in front of the barber shop.", "zh": "福雷斯跑过马路。那两个老头仍坐在理发店前。"}, {"t": "d", "speaker": "OLD CRONY", "note": "", "text": "That boy sure is a running fool.", "zh": "那孩子可真是个跑起来不要命的傻子。"}]}, {"index": 29, "title": "EXT. JENNY'S HOUSE", "blocks": [{"t": "a", "text": "Forrest runs down a driveway toward Jenny's small house.", "zh": "福雷斯沿车道跑向珍妮家的小房子。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now remember how I told you that Jenny never seemed to want to go home? Well, she lived in a house that was as old as Alabama. Her Momma had gone up to heaven when she was five and her daddy was some kind of a farmer.", "zh": "还记得我说过珍妮好像总不想回家吗？她住的房子和亚拉巴马州一样老。她五岁时妈妈就上了天堂，她爸爸算是个农民吧。"}, {"t": "a", "text": "Forrest knocks on Jenny's door.", "zh": "福雷斯敲珍妮家的门。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Jenny? Jenny?", "zh": "珍妮？珍妮？"}, {"t": "a", "text": "Forrest look around the field at the left. He notices Jenny and runs toward her.", "zh": "福雷斯望了望左边的田野，发现了珍妮，便朝她跑去。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "He was a very lovin' man. He was always kissing and touchin' her and her sisters. And then this one time, Jenny wasn't on the bus to go to school.", "zh": "他是个很有“爱心”的男人。他总是亲吻、抚摸她和她的姐妹们。有一次，珍妮没坐校车来上学。"}, {"t": "a", "text": "Forrest runs to Jenny.", "zh": "福雷斯跑到珍妮面前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Jenny, why didn't you come to school today?", "zh": "珍妮，你今天怎么没上学？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Hsh! Daddy's takin' a nap.", "zh": "嘘！爸爸在打盹呢。"}, {"t": "a", "text": "Jenny grabs Forrest's hand and runs into the field. Jenny's DAD drunk, steps out onto the porch and shouts.", "zh": "珍妮抓住福雷斯的手跑进田野。珍妮醉醺醺的爸爸走到门廊大喊。"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Jenny!", "zh": "珍妮！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Come on!", "zh": "快走！"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Jenny, where'd you run to? You'd better come back here, girl!", "zh": "珍妮，你跑哪儿去了？你最好给我回来，死丫头！"}, {"t": "a", "text": "Jenny's dad steps out toward the field. Jenny leads Forrest into the thick tobacco field. Jenny's dad runs through the field searching for Jenny with a liquor bottle in his hand.", "zh": "珍妮的爸爸朝田野走来。珍妮领着福雷斯钻进茂密的烟草地。她爸爸手拿酒瓶在田里跑着找她。"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Where you at?", "zh": "你在哪儿？"}, {"t": "a", "text": "Jenny and Forrest run into a corn field as Jenny's dad tries to chase her.", "zh": "珍妮和福雷斯跑进一片玉米地，她爸爸在后面追。"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Jenny! Jenny! Where you at? Jenny!", "zh": "珍妮！珍妮！你在哪儿？珍妮！"}, {"t": "a", "text": "Jenny drops to her knees and pulls Forrest down with her.", "zh": "珍妮跪倒在地，把福雷斯也拉着蹲下。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Pray with me, Forrest. Pray with me.", "zh": "跟我一起祈祷，福雷斯。跟我祈祷。"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Jenny!", "zh": "珍妮！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Dear God, make me a bird so I can fly far, far, far away from here. Dear God, make me a bird so I can fly far, far, far away from here.", "zh": "亲爱的上帝，把我变成一只鸟吧，让我飞得远远的，远远离开这里。亲爱的上帝，把我变成一只鸟吧，让我飞得远远的，远远离开这里。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Momma always said that God is mysterious.", "zh": "妈妈总说，上帝是神秘莫测的。"}, {"t": "d", "speaker": "JENNY'S DAD", "note": "", "text": "Jenny! Get back here!", "zh": "珍妮！给我回来！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "He didn't turn Jenny into a bird that day. Instead...", "zh": "那天他没有把珍妮变成一只鸟。而是……"}]}, {"index": 30, "title": "EXT. TRAILER PARK/ALABAMA - DAY (1955)", "blocks": [{"t": "a", "text": "A police officer escorts Jenny to her grandmother's trailer.", "zh": "一名警察把珍妮送到她祖母的拖车屋。"}, {"t": "a", "text": "Jenny's grandmother meets Jenny outside and leads her toward the trailer.", "zh": "珍妮的祖母在门外接她，带她走向拖车。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...he had the police say Jenny didn't have to stay in that house no more. She went to live with her grandma just over on Creekmore Avenue, which made me happy 'cause she was so close.", "zh": "……让警察出面，说珍妮不必再住在那栋房子里了。她搬去和祖母一起住，就在克里克莫尔大道那边。这让我很高兴，因为她离我很近。"}]}, {"index": 31, "title": "EXT. GUMP HOUSE - NIGHT (1955)", "blocks": [{"t": "a", "text": "Jenny climbs over a second-floor railing and enters the house.", "zh": "珍妮翻过二楼的栏杆进屋。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Some nights, Jenny'd sneak out and come over to my house, just 'cause she said she was scared. Scared of what, I don't know...", "zh": "有些晚上，珍妮会偷偷溜出来跑到我家来，她说她害怕。怕什么，我不知道……"}]}, {"index": 32, "title": "INT. GUMP HOUSE/FORREST'S BEDROOM", "blocks": [{"t": "a", "text": "Jenny lies in bed next to young Forrest. She hugs him.", "zh": "珍妮躺在小福雷斯身边，抱着他。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...but I think it was her grandma's dog. He was a mean dog. Anyway, Jenny and me was best friends...", "zh": "……但我想是她祖母家的狗。那条狗可凶了。总之，我和珍妮是最好的朋友……"}]}, {"index": 33, "title": "EXT. GREENBOW/OAK ALLEY - DAY (1961)", "blocks": [{"t": "a", "text": "Forrest and Jenny are teenagers now. They walk along an oaklined road.", "zh": "福雷斯和珍妮这时已是少年，他们走在橡树成荫的路上。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "...all the way to high school.", "zh": "……一直到高中。"}, {"t": "a", "text": "Suddenly Forrest is hit in the back with a rock. Forrest and Jenny turn around.", "zh": "突然一块石头砸中福雷斯的后背。两人转过身。"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Hey, stupid!", "zh": "嘿，傻子！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Quit it!", "zh": "别打了！"}, {"t": "a", "text": "A teenage boy throws another rock as a pickup truck pulls up behind him. Jenny turns and looks at Forrest.", "zh": "一个少年又扔来一块石头，他身后一辆皮卡停了下来。珍妮回头看福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest, run!", "zh": "跑，福雷斯，快跑！"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Hey. Did you hear me, stupid?", "zh": "嘿。听见没有，傻子？"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest!", "zh": "跑啊，福雷斯！"}, {"t": "a", "text": "Forrest drops his books and runs down the road. The teenage boy jumps into the back of the pickup truck with another boy as the truck speeds after Forrest. Jenny steps left and gets out of the way.", "zh": "福雷斯扔下书本沿路跑起来。那少年和另一个男孩跳上皮卡后斗，车加速追向福雷斯。珍妮让到左边躲开。"}, {"t": "d", "speaker": "OLDER BOY #2", "note": "", "text": "Come on, he's getting away! Move it!", "zh": "快，他要跑了！快点！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest! Run!", "zh": "跑，福雷斯！跑！"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "You better be runnin', stupid.", "zh": "你最好拼命跑，傻子。"}, {"t": "a", "text": "Forrest runs along the road. The truck speeds after him.", "zh": "福雷斯沿路奔跑，皮卡在后面紧追。"}, {"t": "d", "speaker": "OLDER BOY #2", "note": "", "text": "Come on, dummy!", "zh": "来啊，笨蛋！"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Haul ass, dummy!", "zh": "快跑啊，笨蛋！"}, {"t": "a", "text": "Older Boy throws rocks at Forrest.", "zh": "大男孩们朝福雷斯扔石头。"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Yeah, you better be runnin'!", "zh": "对，你最好跑快点！"}]}, {"index": 34, "title": "INT. TRUCK", "blocks": [{"t": "d", "speaker": "BOY", "note": "", "text": "Ya-hoo!", "zh": "呀呼——！"}]}, {"index": 35, "title": "EXT. OAK ALLEY", "blocks": [{"t": "a", "text": "The boys in the back of the truck throw rocks at Forrest as they drive up to him.", "zh": "车斗里的男孩们开到他身旁，朝他扔石头。"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Move it, jack rabbit!", "zh": "快跑啊，长耳兔！"}, {"t": "a", "text": "The truck follows right on Forrest's heels. A rebel flag license plate adorns the truck's grill.", "zh": "皮卡紧咬在福雷斯脚后跟。车头格栅上挂着一面南方邦联旗的牌照。"}, {"t": "d", "speaker": "OLDER BOY #1", "note": "", "text": "Come on!", "zh": "快！"}, {"t": "a", "text": "Forrest runs along the road as the truck chases him. The boys in the back of the truck pound on the roof as the truck turns right, after Forrest. The truck drives into a field.", "zh": "福雷斯沿路奔跑，皮卡紧追不舍。车斗里的男孩们猛拍车顶，皮卡在福雷斯身后右转追进一片田野。"}, {"t": "a", "text": "Forrest runs toward a fence.", "zh": "福雷斯朝一道栅栏跑去。"}, {"t": "d", "speaker": "BOY", "note": "", "text": "Run! Faster! Yeah! Go! Go! Come on, Forrest! Yeah!", "zh": "跑！再快点！好！冲！冲！加油，福雷斯！好！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Run, Forrest!", "zh": "跑，福雷斯！"}, {"t": "a", "text": "Forrest leaps over a five-foot fence as the boys try to catch him.", "zh": "福雷斯跃过一道五英尺高的栅栏，男孩们抓他不住。"}]}, {"index": 36, "title": "EXT. SAVANNAH/BUS BENCH - DAY (1981)", "blocks": [{"t": "a", "text": "Forrest looks left as he continues telling his life story.", "zh": "福雷斯一边继续讲他的故事，一边看向左边。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Now, it used to be, I ran to get where I was goin'. I never thought it would take me anywhere.", "zh": "以前呢，我跑步只是为了赶到要去的地方。我从没想过跑步会把我带到什么地方去。"}]}, {"index": 37, "title": "EXT. HIGH SCHOOL/ROAD - DAY (1961)", "blocks": [{"t": "a", "text": "Forrest runs along the road in front of the high school. The truck continues to chase him as the boys pound on the roof.", "zh": "福雷斯沿着高中校门前的路跑着，皮卡继续追赶，车斗里的男孩们猛拍车顶。"}, {"t": "d", "speaker": "OLDER BOY", "note": "", "text": "Come on. Whoo-hoo!", "zh": "冲啊。呼——哈！"}, {"t": "a", "text": "The truck speeds past Forrest as he turns from the road and runs onto the high school football field. Forrest runs across the field during a football scrimmage.", "zh": "皮卡在福雷斯转出公路、跑上高中橄榄球场时超了过去。福雷斯穿过正在进行训练赛的球场。"}, {"t": "a", "text": "In the stands watching the scrimmage is the legendary University of Alabama football coach BEAR BRYANT, wearing his trademark plaid hat.", "zh": "看台上观看训练赛的是亚拉巴马大学传奇橄榄球教练“大熊”布赖恩特，戴着他标志性的格纹帽。"}, {"t": "a", "text": "A group of assistant coaches sit around him, as well as the high school football coach. The quarterback throws the ball into the air.", "zh": "一群助理教练和高中橄榄球教练围坐在他身旁。四分卫把球抛向空中。"}, {"t": "a", "text": "Forrest runs past the quarterback. The receiver catches the ball. Forrest runs past the receiver as an opposing player tackles the stunned receiver.", "zh": "福雷斯从四分卫身旁跑过。外接手接住球，福雷斯又从他身旁跑过，一名防守球员把目瞪口呆的外接手扑倒。"}, {"t": "a", "text": "The football coach stands, followed by the assistant coaches.", "zh": "橄榄球教练站了起来，助理教练们跟着起身。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "Who in the hell is that?", "zh": "那他妈到底是谁？"}, {"t": "d", "speaker": "HIGH SCHOOL COACH", "note": "", "text": "That there is Forrest Gump. Coach. Just a local idiot.", "zh": "那个是福雷斯·甘，教练。本地的一个傻子而已。"}, {"t": "a", "text": "Forrest runs under the field goal post and through the end zone.", "zh": "福雷斯从球门柱下跑过，穿过端区。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "And can you believe it? I got to go to college, too.", "zh": "你信吗？我也能上大学了。"}]}, {"index": 38, "title": "EXT. UNIVERSITY OF ALABAMA STADIUM - DAY (1962)", "blocks": [{"t": "a", "text": "The crowd roars with excitement as a football is kicked off.", "zh": "橄榄球开球，观众兴奋地欢呼。"}, {"t": "a", "text": "The football players run around on the field. The crowd of cheering fans create a huge sign that reads: \"GO.\"", "zh": "球员们在场上奔跑。欢呼的球迷们翻出一块巨大的标语牌，上面写着“冲”。"}, {"t": "a", "text": "Forrest is in a University of Alabama football uniform. He looks up into the cheering crowd as his teammate fields the kickoff. The teammate runs over to Forrest and hands him the ball.", "zh": "福雷斯身穿亚拉巴马大学橄榄球队服。队友接住开球时，他抬头望着欢呼的人群。队友跑过来把球塞到他手里。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "Okay! Run!", "zh": "好！跑！"}, {"t": "a", "text": "The football coach, the assistants, and Alabama players cheer for Forrest.", "zh": "橄榄球教练、助理教练和亚拉巴马队的球员们都为福雷斯加油。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "Run, you stupid son-of-a-bitch! Run!", "zh": "跑啊，你这蠢杂种！跑！"}, {"t": "a", "text": "Forrest runs across the field. He speeds past the defending players. Forrest runs past the opposite players. The crowd cheers wildly, holding up cards, making a large sign that reads: \"Go.\"", "zh": "福雷斯冲过球场，从防守队员身边疾驰而过，又越过对方球员。观众疯狂欢呼，举牌拼出巨大的字：“冲”。"}, {"t": "a", "text": "They turn the cards over, creating the word: \"ALABAMA.\" The football coach runs along the sidelines as he yells.", "zh": "他们翻过纸牌，拼出：“亚拉巴马”。橄榄球教练沿着边线边跑边喊。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "You stupid son-of-a-bitch! Run! Go! Run!", "zh": "你这蠢杂种！跑！冲！跑！"}, {"t": "a", "text": "Forrest cuts and runs toward the sidelines. Two opposing players collide. The football coach, the assistants and the players all motion for Forrest to run toward the end zone.", "zh": "福雷斯变向往边线冲去，两名对方球员撞在一起。教练、助教和球员们都比划着让福雷斯往端区跑。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "Run! Turn! Go!", "zh": "跑！转弯！冲！"}, {"t": "a", "text": "Forrest turns up the sidelines and runs toward the end zone.", "zh": "福雷斯沿边线转身，朝端区冲去。"}, {"t": "a", "text": "Some opposing players fall down. Forrest runs along the sidelines. The opposing players try to catch him.", "zh": "几个对方球员摔倒在地。福雷斯沿边线飞奔，对方球员想抓住他。"}, {"t": "a", "text": "Forrest runs into the end zone as an opposing player dives at his feet. The referee holds up his arm, signaling a touch down. The crowd cheers wildly.", "zh": "福雷斯冲进端区，一名对方球员鱼跃扑向他的脚。裁判举起手臂示意达阵。观众疯狂欢呼。"}, {"t": "a", "text": "Forrest continues to run, smashing through the band members, then all the way toward the team tunnel. The football coach looks at an assistant coach.", "zh": "福雷斯继续跑，撞散了乐队队员，一路冲向球队通道。橄榄球教练看着一名助教。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "He must be the stupidest son-of-a- bitch alive. But he sure is fast!", "zh": "他肯定是天底下最蠢的杂种。可他跑得真他妈快！"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "Now, maybe it was just me but college was very confusing times.", "zh": "也许只是我自己的感觉，大学时代真是一段令人困惑的日子。"}]}, {"index": 39, "title": "INT. GREENBOW/BARBER SHOT - BLACK & WHITE TELEVISION (JUNE 11, 1963)", "blocks": [{"t": "a", "text": "An anchorman named CHET HUNTLEY appears over the television.", "zh": "一位名叫切特·亨特利的新闻主播出现在电视上。"}, {"t": "d", "speaker": "CHET HUNTLEY", "note": "on TV", "text": "Federal troops enforcing a court order integrated the University of Alabama today.", "zh": "联邦军队今天执行法院命令，在亚拉巴马大学推行种族融合。"}]}, {"index": 40, "title": "EXT. UNIVERSITY OF ALABAMA - DAY", "blocks": [{"t": "a", "text": "Forrest walks through a crowd of people.", "zh": "福雷斯穿过人群。"}, {"t": "d", "speaker": "CHET HUNTLEY", "note": "", "text": "Governor George Wallace had carried out his symbolic threat to stand in the schoolhouse door.", "zh": "乔治·华莱士州长兑现了他象征性的威胁——站在校舍门口阻拦。"}, {"t": "d", "speaker": "GOVERNOR WALLACE", "note": "", "text": "We hereby denounce and forbid this illegal and unwarranted action by the central government.", "zh": "我们在此谴责并禁止中央政府这一非法且无理的行动。"}]}, {"index": 41, "title": "INT. GREENBOW/BARBER SHOP", "blocks": [{"t": "a", "text": "A black & white television reveals George Wallace as he stands in the doorway of the schoolhouse.", "zh": "黑白电视画面中，乔治·华莱士站在校舍门口。"}, {"t": "d", "speaker": "KATZENBACH", "note": "on TV", "text": "Governor Wallace, I take it from that, uh...", "zh": "华莱士州长，我是否可以这样理解，呃……"}]}, {"index": 42, "title": "EXT. UNIVERSITY OF ALABAMA", "blocks": [{"t": "a", "text": "Forrest steps over to a young man as the crowd looks at the demonstration.", "zh": "人群看着示威场面，福雷斯朝一个年轻人走过去。"}, {"t": "d", "speaker": "KATZENBACH", "note": "", "text": "...statement that you are going to stand in that door, and that you are not going to carry out the orders of this court, and that you are going to resist us from doing so. I would ask you once again to responsibility step aside and if you do not, I'm going to assure you...", "zh": "……从您的声明来看，您打算站在那道门口，不执行本法院的命令，并阻挠我们执行。我再次请您负责任地让开，如果您不让开，我向您保证……"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Earl, what's going on?", "zh": "厄尔，出什么事了？"}, {"t": "d", "speaker": "EARL", "note": "", "text": "Coons are tryin' to get into school.", "zh": "黑鬼想进学校。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Coons? When raccoons try to get on our back porch, Momma just chase 'em off with a broom.", "zh": "黑鬼？浣熊跑到我们后门廊的时候，妈妈就拿扫帚把它们赶走。"}, {"t": "d", "speaker": "EARL", "note": "", "text": "Not raccoons, you idiot, niggas. And they want to go to school with us.", "zh": "不是浣熊，你这白痴，是黑鬼。他们想和我们一起上学。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "With us? They do?", "zh": "和我们？真的吗？"}, {"t": "a", "text": "Forrest walks toward the schoolhouse.", "zh": "福雷斯朝校舍走去。"}]}, {"index": 43, "title": "INT. COACHES' OFFICE", "blocks": [{"t": "a", "text": "A football coach looks at a black and white television as a newsman outside the schoolhouse speaks to the camera.", "zh": "一名橄榄球教练看着黑白电视，校舍外一名记者正对着镜头报道。"}, {"t": "d", "speaker": "NEWSMAN", "note": "on TV", "text": "...block the doorway, President Kennedy ordered the Secretary of Defense then to use the military force.", "zh": "……堵住门口，肯尼迪总统随后命令国防部长动用军队。"}, {"t": "a", "text": "BLACK AND WHITE FOOTAGE", "zh": "黑白影像资料。"}, {"t": "a", "text": "The footage cuts to Governor Wallace as he speaks to General Graham.", "zh": "影像切到华莱士州长正对格雷厄姆将军讲话。"}, {"t": "d", "speaker": "NEWSMAN", "note": "", "text": "Here by videotape is the encounter by General Graham, Commander of the National Guard, and Governor Wallace.", "zh": "这是录像中国民警卫队司令格雷厄姆将军与华莱士州长的对峙场面。"}, {"t": "a", "text": "Forrest stands next to George Wallace and listens.", "zh": "福雷斯站在乔治·华莱士旁边听着。"}, {"t": "d", "speaker": "GOVERNOR WALLACE", "note": "", "text": "We must have no violence today, or any other day, because these National Guardsmen are here today as Federal Soldiers for Alabamans. And they live within our borders and they are all our brothers. We are winning in this fight because we are awakening the American people to the dangers that we have spoken about so many times, just so evident today, the trend toward military dictatorship in this country.", "zh": "我们今天不能有暴力，任何一天都不能。因为这些国民警卫队员今天是作为联邦士兵为亚拉巴马人民而来的。他们生活在我们的州界之内，都是我们的兄弟。我们正在赢得这场斗争，因为我们正在唤醒美国人民认清危险——这危险我们已多次谈起，今天更是显而易见——那就是这个国家走向军事独裁的趋势。"}]}, {"index": 44, "title": "EXT. UNIVERSITY OF ALABAMA", "blocks": [{"t": "a", "text": "Some of the Alabama policeman and citizens clap their hands as the National Guardsmen stand at attention with their weapons in front of them. Forrest walks through the crowd.", "zh": "一些亚拉巴马警察和市民鼓起掌来，国民警卫队员持枪立正。福雷斯从人群中穿过。"}, {"t": "a", "text": "Two black students were being led toward the schoolhouse.", "zh": "两名黑人学生被领着朝校舍走去。"}, {"t": "d", "speaker": "NEWSMAN", "note": "", "text": "And so at day's end the University of Alabama in Tuscaloosa had been desegregated and students Jimmy Hood and Vivian Malone had been signed up for summer classes.", "zh": "于是，在这一天结束时，塔斯卡卢萨的亚拉巴马大学取消了种族隔离，学生吉米·胡德和维维安·马龙注册了夏季课程。"}, {"t": "a", "text": "The young black girl drops one of her books. Forrest notices and steps past the policeman toward the book on the ground.", "zh": "黑人女孩的一本书掉在地上。福雷斯看见了，绕过警察朝地上的书走去。"}, {"t": "a", "text": "Forrest steps out from the crowd and picks up the book. He brings it up to the girl.", "zh": "福雷斯走出人群捡起书，递到女孩面前。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Ma'am, you dropped your book. Ma'am.", "zh": "小姐，您的书掉了。小姐。"}]}, {"index": 45, "title": "INT. COACHES' OFFICE - NIGHT (1963)", "blocks": [{"t": "a", "text": "A coach looks at the television. The television reveals Forrest as he stands at the schoolhouse door. He looks around, then waves.", "zh": "一名教练看着电视。画面里福雷斯站在校舍门口，他四下望了望，然后挥了挥手。"}, {"t": "d", "speaker": "CHET HUNTLEY", "note": "on TV", "text": "Governor Wallace did what he promised to do. By being on the Tuscaloosa campus, he kept the mob from gathering and prevented violence.", "zh": "华莱士州长说到做到。他出现在塔斯卡卢萨校园，阻止了暴民聚集，防止了暴力。"}, {"t": "a", "text": "An assistant coach looks at the television, then at the other coaches.", "zh": "一名助教看着电视，又看了看其他教练。"}, {"t": "d", "speaker": "ASSISTANT COACH", "note": "", "text": "Say, wasn't that Gump?", "zh": "嘿，那不是甘吗？"}, {"t": "a", "text": "The football coach and two assistant coaches look. Forrest dries himself off with a towel as he steps from the showers.", "zh": "橄榄球教练和两名助教看过去。福雷斯披着毛巾从淋浴间出来。"}, {"t": "d", "speaker": "CHET HUNTLEY", "note": "on TV", "text": "NBC News will present a special program on the Alabama integration story at 7:30 p.m. tonight...", "zh": "全国广播公司新闻频道将于今晚七点半播出亚拉巴马大学种族融合事件的特别节目……"}, {"t": "d", "speaker": "ASSISTANT COACH", "note": "", "text": "Naw, that couldn't be.", "zh": "不可能，不会是他。"}, {"t": "d", "speaker": "FOOTBALL COACH", "note": "", "text": "It sure as hell was.", "zh": "绝对就是他。"}, {"t": "d", "speaker": "CHET HUNTLEY", "note": "", "text": "...standard Eastern Daylight Time. Now a word from Anacin.", "zh": "……东部夏令时标准时间播出。现在是安乃近广告时间。"}, {"t": "a", "text": "Forrest steps up to the coaches' area and grabs a clean towel.", "zh": "福雷斯走到教练区，拿起一条干净毛巾。"}, {"t": "a", "text": "The coaches turn and stare at Forrest. Forrest gives them one of his silly waves, then walks away.", "zh": "教练们转过头盯着福雷斯。福雷斯冲他们憨憨地挥了挥手，然后走开了。"}, {"t": "a", "text": "COLOR FOOTAGE - Governor Wallace waves to the crowd as he stands behind a podium with his wife.", "zh": "彩色影像——华莱士州长和妻子站在讲台后向人群挥手。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "A few years later, that angry little man at the schoolhouse door thought it would be a good idea, and ran for President.", "zh": "几年后，校舍门口那个怒气冲冲的小个子觉得竞选总统是个好主意。"}, {"t": "a", "text": "COLOR FOOTAGE - Governor Wallace mingles in a crowd. Gunshots are fired, wounding him. Some men wrestle the shooter. Wallace lies wounded on the ground.", "zh": "彩色影像——华莱士州长在人群中与人握手，枪声响起，他中弹倒地。几个人扭住枪手。华莱士受伤躺在地上。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But, somebody thought that it wasn't.", "zh": "但有人觉得这不是个好主意。"}]}, {"index": 46, "title": "EXT. SAVANNAH/BUS BENCH - DAY (1981)", "blocks": [{"t": "a", "text": "Forrest sits on the bench as the black woman looks at him. A WHITE WOMAN with a bay sits left.", "zh": "福雷斯坐在长椅上，黑人女子看着他。一个抱孩子的白人女子坐在左边。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "But he didn't die.", "zh": "不过他没死。"}, {"t": "a", "text": "A bus pulls up to the bus stop. The BLACK WOMAN looks down at her watch.", "zh": "一辆公交车靠站。黑人女子低头看表。"}, {"t": "d", "speaker": "BLACK WOMAN", "note": "", "text": "My bus is here.", "zh": "我的车来了。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Is it the number 9?", "zh": "是九路车吗？"}, {"t": "d", "speaker": "BLACK WOMAN", "note": "", "text": "No, it's the number 4.", "zh": "不，是四路。"}, {"t": "a", "text": "The Black Woman gets up and steps over to the bus.", "zh": "黑人女子起身走向公交车。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "It was nice talkin' to you.", "zh": "和你聊天很开心。"}, {"t": "a", "text": "The white woman sits closer to Forrest.", "zh": "白人女子坐得离福雷斯近了些。"}, {"t": "d", "speaker": "WHITE WOMAN", "note": "", "text": "I remember when that happened, when Wallace got shot. I was in college.", "zh": "华莱士遇刺那会儿我记得，我当时正在上大学。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "Did you go to a girls' college, or to a girls' and boys' together college?", "zh": "你上的是女子学院，还是男女同校的大学？"}, {"t": "d", "speaker": "WHITE WOMAN", "note": "", "text": "It was co-ed.", "zh": "男女同校的。"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "'Cause Jenny went to a college I couldn't go to. It was a college just for girls.", "zh": "因为珍妮上了一所我上不了的大学，那是一所女子大学。"}]}, {"index": 47, "title": "EXT, GIRLS' COLLEGE/JENNY'S DORM - NIGHT (1963)", "blocks": [{"t": "a", "text": "Forrest sits outside Jenny's dorm in the rain.", "zh": "福雷斯冒雨坐在珍妮宿舍外。"}, {"t": "d", "speaker": "FORREST", "note": "V.O.", "text": "But, I'd go and visit her every chance I got.", "zh": "但一有机会我就去看她。"}, {"t": "a", "text": "A car pulls up. A song is heard from the radio. Forrest, holding a box of chocolates, looks at the car. The two people inside the car begins to kiss and embrace each other. Jenny is inside the car with a boy. She leans back against the passenger side door as they struggle to get comfortable.", "zh": "一辆车停下，收音机里放着歌。福雷斯手捧一盒巧克力看着那辆车。车里的两个人开始亲吻搂抱。珍妮和一个男孩在车里，她仰靠在副驾车门上，两人扭着身子想找个舒服姿势。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Ouch! That hurts.", "zh": "哎哟！好疼。"}, {"t": "a", "text": "Forrest gets up and runs toward the car. He tries to look in the window as he steps over to the driver's side door. He opens the door and begins to punch the boy inside. Jenny jump out of the car and runs over to Forrest.", "zh": "福雷斯起身朝汽车跑去，凑到车窗前往里看，又绕到驾驶座一侧，拉开车门就揍车里的男孩。珍妮跳下车跑向福雷斯。"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "Forrest! Forrest! Forrest, stop it! Stop it!", "zh": "福雷斯！福雷斯！福雷斯，住手！住手！"}, {"t": "d", "speaker": "BILLY", "note": "", "text": "Jesus!", "zh": "老天！"}, {"t": "d", "speaker": "JENNY", "note": "", "text": "What are you doing?", "zh": "你干什么？"}, {"t": "d", "speaker": "FORREST", "note": "", "text": "He was hurtin' you.", "zh": "他在弄疼你。"}, {"t": "a", "text": "Jenny's date, named BILLY, gets o
